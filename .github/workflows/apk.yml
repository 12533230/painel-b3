name: Gerar APK (app Android)

# Empacota a PWA do painel num APK Android (TWA — Trusted Web Activity) e publica
# o arquivo como Release do GitHub, pronto para instalar no celular.
# Rode manualmente em Actions → "Gerar APK (app Android)" → Run workflow.
#
# Em vez de `bubblewrap init` (que é interativo e falha em CI), escrevemos o
# twa-manifest.json direto e apontamos o Bubblewrap para o JDK e o Android SDK
# que já vêm no runner. Nenhum passo mascara erro com `|| true`.
on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão do app (ex.: 1.0.0)"
        required: false
        default: "1.0.0"
      alvo:
        description: "Qual painel empacotar"
        required: false
        default: "insignia"
        type: choice
        options: [insignia, publico]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: "20"

      - name: Definir alvo
        id: cfg
        run: |
          set -euo pipefail
          if [ "${{ inputs.alvo }}" = "publico" ]; then
            echo "url=https://12533230.github.io/painel-b3/p/"                       >> $GITHUB_OUTPUT
            echo "manifest=https://12533230.github.io/painel-b3/app/manifest-public.json" >> $GITHUB_OUTPUT
            echo "appid=io.github.painelb3.publico"                                  >> $GITHUB_OUTPUT
            echo "nome=Painel B3"                                                    >> $GITHUB_OUTPUT
          else
            echo "url=https://12533230.github.io/painel-b3/"                         >> $GITHUB_OUTPUT
            echo "manifest=https://12533230.github.io/painel-b3/app/manifest.json"   >> $GITHUB_OUTPUT
            echo "appid=io.github.painelb3.insignia"                                 >> $GITHUB_OUTPUT
            echo "nome=Painel B3"                                                    >> $GITHUB_OUTPUT
          fi

      - name: Instalar Bubblewrap
        run: npm install -g @bubblewrap/cli@1.22.0

      - name: Apontar Bubblewrap para o JDK e o Android SDK do runner
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || { echo "Android SDK não encontrado"; exit 1; }
          test -d "$JAVA_HOME" || { echo "JAVA_HOME não encontrado"; exit 1; }

          # O Bubblewrap valida o SDK exigindo <sdk>/tools ou <sdk>/bin, e procura o
          # sdkmanager em <sdk>/tools/bin/sdkmanager ou <sdk>/bin/sdkmanager. O SDK do
          # runner usa a estrutura moderna (cmdline-tools/latest/bin), então criamos o
          # link que ele espera — apontando para os binários reais.
          if [ ! -e "$SDK/bin" ] && [ ! -e "$SDK/tools" ]; then
            sudo ln -s "$SDK/cmdline-tools/latest/bin" "$SDK/bin"
          fi
          test -x "$SDK/bin/sdkmanager" || { echo "sdkmanager não encontrado em $SDK/bin"; ls -la "$SDK"; exit 1; }

          # build-tools 34.0.0 é a versão que o Bubblewrap 1.22 exige; instalamos aqui
          # para o build não depender de prompt interativo.
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;34.0.0" "platforms;android-34" "platform-tools"
          test -d "$SDK/build-tools/34.0.0" || { echo "build-tools 34.0.0 não instalou"; exit 1; }

          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$SDK" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      - name: Chave de assinatura
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.ANDROID_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | tr -d '\n\r ' | base64 -d > android.keystore
            echo "usando keystore do secret ANDROID_KEYSTORE_B64"
          else
            keytool -genkeypair -v -keystore android.keystore -alias painelb3 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass painelb3 -keypass painelb3 \
              -dname "CN=Painel B3, OU=Painel, O=Painel B3, L=Sao Paulo, S=SP, C=BR"
            echo "::warning::Keystore gerado nesta execução — este APK NÃO poderá atualizar o anterior e a barra do Chrome voltará. Guarde um keystore fixo no secret ANDROID_KEYSTORE_B64."
          fi
          test -s android.keystore

          # Falha aqui, com mensagem clara, em vez de quebrar no meio do build:
          # confere que o keystore abre com a senha e tem o alias que o manifesto usa.
          if ! keytool -list -keystore android.keystore -storetype PKCS12 -storepass painelb3 -alias painelb3 > /dev/null 2>&1; then
            echo "::error::O keystore não abriu com a senha 'painelb3' ou não tem o alias 'painelb3'. Se você colou o secret ANDROID_KEYSTORE_B64, confira se o valor é o base64 completo, em uma linha só."
            exit 1
          fi
          FP=$(keytool -list -v -keystore android.keystore -storetype PKCS12 -storepass painelb3 -alias painelb3 \
               | grep -i "SHA256:" | head -1 | sed 's/.*SHA256: *//' | tr -d ' \r')
          echo "fingerprint SHA-256 desta assinatura: $FP"
          echo "Se este fingerprint não estiver no assetlinks.json dos domínios, o app abrirá com a barra do Chrome." >> $GITHUB_STEP_SUMMARY
          echo "Fingerprint desta build: \`$FP\`" >> $GITHUB_STEP_SUMMARY

      - name: Escrever twa-manifest.json
        run: |
          set -euo pipefail
          mkdir -p twa
          cp android.keystore twa/android.keystore
          cat > twa/twa-manifest.json <<JSON
          {
            "packageId": "${{ steps.cfg.outputs.appid }}",
            "host": "12533230.github.io",
            "name": "${{ steps.cfg.outputs.nome }}",
            "launcherName": "Painel B3",
            "display": "standalone",
            "themeColor": "#0c2a2d",
            "themeColorDark": "#0c2a2d",
            "navigationColor": "#0c2a2d",
            "navigationColorDark": "#0c2a2d",
            "navigationDividerColor": "#0c2a2d",
            "navigationDividerColorDark": "#0c2a2d",
            "backgroundColor": "#0c2a2d",
            "enableNotifications": false,
            "startUrl": "${{ steps.cfg.outputs.url }}",
            "iconUrl": "https://12533230.github.io/painel-b3/app/icon-512.png",
            "maskableIconUrl": "https://12533230.github.io/painel-b3/app/icon-maskable-512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": { "path": "./android.keystore", "alias": "painelb3" },
            "appVersionName": "${{ inputs.versao }}",
            "appVersionCode": ${{ github.run_number }},
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "${{ steps.cfg.outputs.manifest }}",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": { "enabled": false },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "${{ steps.cfg.outputs.url }}",
            "minSdkVersion": 23,
            "orientation": "default",
            "fingerprints": []
          }
          JSON
          node -e "JSON.parse(require('fs').readFileSync('twa/twa-manifest.json','utf8')); console.log('twa-manifest.json válido')"

      - name: Build do APK
        working-directory: twa
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: painelb3
          BUBBLEWRAP_KEY_PASSWORD: painelb3
        run: |
          set -euo pipefail
          # `update --skipVersionUpgrade` gera o projeto Android a partir do twa-manifest.json
          # e grava o manifest-checksum.txt — sem isso o `build` para num prompt interativo.
          bubblewrap update --skipVersionUpgrade < /dev/null
          test -f manifest-checksum.txt
          bubblewrap build --skipPwaValidation < /dev/null
          echo "--- artefatos gerados ---"
          find . -name "*.apk" -o -name "*.aab" | sort

      - name: Coletar artefatos
        run: |
          set -euo pipefail
          mkdir -p saida
          find twa -name "*.apk" -exec cp {} saida/ \;
          find twa -name "*.aab" -exec cp {} saida/ \; || true
          cp twa/assetlinks.json saida/ 2>/dev/null || true
          ls -la saida/
          # o APK precisa existir, senão o job falha aqui e não publica release vazio
          test -n "$(find saida -name '*.apk' -print -quit)"

      - name: Publicar assetlinks (vincula o app ao site e tira a barra do navegador)
        run: |
          set -euo pipefail
          if [ -f saida/assetlinks.json ]; then
            mkdir -p docs/.well-known
            cp saida/assetlinks.json docs/.well-known/assetlinks.json
            git config user.name "painel-bot"
            git config user.email "actions@users.noreply.github.com"
            git add docs/.well-known/assetlinks.json
            git diff --cached --quiet || { git commit -m "assetlinks do app Android"; git push; }
          else
            echo "sem assetlinks.json (o app abrirá com a barra do Chrome)"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: painel-b3-apk
          path: saida/*

      - name: Publicar Release com o APK
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2
        with:
          tag_name: app-v${{ inputs.versao }}
          name: Painel B3 — app Android v${{ inputs.versao }}
          body: |
            APK do Painel B3 (${{ inputs.alvo }}).

            **Como instalar no Android:** baixe o `.apk` abaixo pelo celular, abra o arquivo e
            autorize "instalar de fontes desconhecidas" quando o Android pedir.

            O app abre o painel em tela cheia, com ícone próprio, e funciona offline com os
            últimos dados carregados (as cotações ao vivo precisam de internet).
          files: saida/*.apk
          fail_on_unmatched_files: true
