name: Cotações quase ao vivo

# ANTES: cron "*/15 13-21 * * 1-5" (33 gatilhos/dia). O GitHub entrega
# agendamento por "best effort" e descarta o excedente quando a fila está cheia:
# medido em 07/09/2026, este workflow caiu de 33 execuções/dia (20-25/ago) para
# 13, depois 6, depois 1 por dia, e no dia 07 nenhuma — o branch "quotes" ficou
# 3 dias parado sem ninguém perceber.
#
# AGORA: 2 gatilhos por dia e o ciclo de 10 minutos roda DENTRO do job. Um único
# agendamento entregue cobre a janela inteira; o segundo gatilho também serve de
# recuperação se o primeiro for descartado.
on:
  schedule:
    - cron: "8 13 * * 1-5"    # 10:08 Brasília — cobre até 17h UTC
    - cron: "8 17 * * 1-5"    # 14:08 Brasília — cobre até o fim do pregão
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cotacoes
  cancel-in-progress: true    # o gatilho da tarde substitui o ciclo da manhã

jobs:
  cotacoes:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # actions fixadas por SHA (supply chain); os comentários indicam a tag equivalente
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: pip install --quiet requests==2.34.2

      - name: Baixar último quotes.json publicado (para manter valores em caso de falha)
        run: |
          if curl -sf --retry 3 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/quotes/data/quotes.json" -o /tmp/quotes_prev.json \
             && python -c "import json; json.load(open('/tmp/quotes_prev.json'))"; then
            mv /tmp/quotes_prev.json data/quotes.json
          else
            echo "sem snapshot anterior válido no branch quotes"
          fi

      - name: Coletar e publicar a cada 10 min até o fim da janela
        run: |
          set -u
          git config user.name "painel-bot"
          git config user.email "actions@users.noreply.github.com"

          # Publica no branch "quotes" um commit órfão único (sem histórico, sem
          # mexer no branch de trabalho) — dá para repetir dentro do laço.
          # Só publica se o arquivo MUDOU: republicar conteúdo idêntico avançaria a
          # data do commit e o vigia passaria a ver como fresco um dado congelado.
          ultimo=""
          publica() {
            novo=$(git hash-object data/quotes.json)
            if [ "$novo" = "$ultimo" ]; then return 2; fi
            tmpidx=$(mktemp)
            GIT_INDEX_FILE="$tmpidx" git read-tree --empty
            GIT_INDEX_FILE="$tmpidx" git add -f data/quotes.json
            tree=$(GIT_INDEX_FILE="$tmpidx" git write-tree)
            rm -f "$tmpidx"
            commit=$(git commit-tree "$tree" -m "cotações $(date -u +%FT%TZ)")
            git push -f origin "$commit:refs/heads/quotes" || return 1
            ultimo="$novo"
            return 0
          }
          ultimo=$(git hash-object data/quotes.json 2>/dev/null || echo "")

          # Dois limites, os dois em tempo ABSOLUTO: o fim do pregão e a folga do
          # timeout do job (300 min). Usar hora-do-dia deixava o ciclo da tarde
          # com folga zero — e qualquer início fora do horário previsto (o
          # agendamento do GitHub atrasa horas) criava janela maior que o timeout.
          LIMITE=$(( $(date -u +%s) + 255*60 ))
          FIMPREGAO=$(date -u -d 'today 21:50' +%s)
          # atenção: o shell do Actions roda com -e, então "[ cond ] && cmd" solto
          # DERRUBA o passo quando a condição é falsa. Sempre if/fi aqui.
          if [ "$(date -u +%s)" -ge "$FIMPREGAO" ]; then
            FIMPREGAO=$(( $(date -u +%s) + 20*60 ))
          fi
          echo "ciclo até $(date -u -d "@$(( LIMITE < FIMPREGAO ? LIMITE : FIMPREGAO ))" +%T) UTC"
          i=0; pub=0; semnovo=0; erros=0
          while true; do
            i=$((i+1))
            echo "=== coleta $i · $(date -u +%T) UTC"
            if python collect_quotes.py; then
              rc=0; publica || rc=$?     # o "||" protege do set -e
              case "$rc" in
                0) pub=$((pub+1)); echo "publicado no branch quotes" ;;
                2) semnovo=$((semnovo+1)); echo "sem preço novo (mercado fechado/feriado) — nada a publicar" ;;
                *) erros=$((erros+1)); echo "::warning::push falhou nesta volta" ;;
              esac
            else
              erros=$((erros+1)); echo "::warning::a coleta falhou nesta volta"
            fi
            agora=$(date -u +%s)
            if [ "$agora" -ge "$LIMITE" ] || [ "$agora" -ge "$FIMPREGAO" ]; then
              echo "fim da janela"; break
            fi
            sleep 600
          done
          echo "voltas: $i · publicações: $pub · sem preço novo: $semnovo · erros: $erros"
          # Falha só quando NADA saiu e houve erro de verdade. Feriado (tudo
          # "sem preço novo") é resultado legítimo e sai verde.
          if [ "$pub" -eq 0 ] && [ "$semnovo" -eq 0 ]; then
            echo "::error::a janela terminou sem nenhuma publicação e com $erros erro(s)"; exit 1
          fi
