name: Testar keystore (temporário)

# Valida que um keystore PKCS12 gerado com openssl (sem Java) é aceito pelo
# toolchain Android — keytool e apksigner. Serve para confirmar a abordagem
# antes de guardar a chave no secret ANDROID_KEYSTORE_B64.
# Pode ser apagado depois de rodar.
on:
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gerar PKCS12 com openssl (igual ao feito na máquina local)
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:2048 -keyout k.key -out k.crt \
            -days 10000 -nodes -sha256 \
            -subj "/C=BR/ST=SP/L=Sao Paulo/O=Painel B3/OU=Painel/CN=Painel B3"
          openssl pkcs12 -export -inkey k.key -in k.crt \
            -name painelb3 -out k.p12 -passout pass:painelb3 -macalg sha256
          ls -l k.p12

      - name: keytool consegue ler o keystore e achar o alias?
        run: |
          set -euo pipefail
          echo "--- listagem ---"
          keytool -list -v -keystore k.p12 -storetype PKCS12 -storepass painelb3 | head -30
          echo "--- o alias 'painelb3' existe? ---"
          keytool -list -keystore k.p12 -storetype PKCS12 -storepass painelb3 -alias painelb3
          echo "OK: keytool leu o keystore e encontrou o alias"

      - name: O fingerprint bate com o que o openssl calculou?
        run: |
          set -euo pipefail
          A=$(keytool -list -v -keystore k.p12 -storetype PKCS12 -storepass painelb3 -alias painelb3 \
              | grep -i "SHA256:" | head -1 | sed 's/.*SHA256: *//' | tr -d ' \r')
          B=$(openssl x509 -in k.crt -noout -fingerprint -sha256 | sed 's/.*= *//' | tr -d ' \r')
          echo "keytool : $A"
          echo "openssl : $B"
          test "$A" = "$B" && echo "OK: os dois concordam"

      - name: apksigner aceita esse keystore para assinar?
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          if [ ! -e "$SDK/bin" ] && [ ! -e "$SDK/tools" ]; then
            sudo ln -s "$SDK/cmdline-tools/latest/bin" "$SDK/bin"
          fi
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;34.0.0" > /dev/null
          APKSIGNER="$SDK/build-tools/34.0.0/apksigner"
          test -x "$APKSIGNER"
          # monta um APK mínimo válido (zip com AndroidManifest) só para exercitar a assinatura
          mkdir -p dummy && printf 'x' > dummy/AndroidManifest.xml
          (cd dummy && zip -q -r ../app.apk .)
          "$APKSIGNER" sign --ks k.p12 --ks-pass pass:painelb3 --key-pass pass:painelb3 \
            --ks-key-alias painelb3 --min-sdk-version 23 --out app-signed.apk app.apk
          echo "--- verificando a assinatura ---"
          "$APKSIGNER" verify --print-certs --min-sdk-version 23 app-signed.apk
          echo "OK: apksigner assinou e verificou com o keystore do openssl"
