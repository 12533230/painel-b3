function avisoIgnorados(oQue){
  if(!cmpSel.buscaLida || !(cmpSel.buscaLida.naoEntendi||[]).length) return null;

      + 'Confira o filtro no seletor acima antes de usar o número.'));
  const sug = sugereTermos(ni, 4);
  if(sug.length){
    const s2 = el('div'); s2.style.marginTop='6px';

  return av;
}

    const inpQ = document.createElement('input');
    inpQ.type = 'text';
    inpQ.placeholder = 'Ex.: varejo com ROIC acima de 15 e alavancagem abaixo de 2';
    inpQ.value = cmpSel.busca || '';
    inpQ.setAttribute('aria-label','Buscar por texto');
    inpQ.style.cssText = 'flex:1 1 380px;min-width:240px;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit';
    const aplicaBusca = () => {
      const r = buscaInterpreta(inpQ.value);
      cmpSel.busca = inpQ.value;
      if(r){
        cmpSel.setor = r.escopo || '';
        cmpSel.filtros = r.filtros;
        cmpSel.buscaLida = {escopo:r.escopo, n:r.filtros.length, naoEntendi:r.naoEntendi, intencao:r.intencao,
                            avisoGrupo:r.avisoGrupo||''};
        // pedido de ranking (sem valor) sai do screener e mostra o ranking
        if(r.intencao==='rank'){ cmpSel.modo='rank'; cmpSel.ind=r.ind; cmpSel.dir=r.dir; cmpSel.setFiltros=[]; }
        // pedido de comparação entre setores sai do screener e vai para o modo "set"
        else if(r.intencao==='setores'){
          cmpSel.modo='set'; cmpSel.ind=r.ind; cmpSel.dir=r.dir;
          cmpSel.setNivel = r.nivel || 'set';
          if(r.setStat) cmpSel.setStat = r.setStat;
          cmpSel.setFiltros = r.setFiltros || [];
          cmpSel.filtros = [];
        }
        else if(r.intencao==='kpi'){ cmpSel.modo='op'; cmpSel.opind=r.kpi; cmpSel.setFiltros=[]; }
        else cmpSel.setFiltros = [];
      } else { cmpSel.buscaLida = null; }
      lsSet('cmp_sel', cmpSel); renderCmp();
    };
    inpQ.onkeydown = e => { if(e.key==='Enter'){ e.preventDefault(); aplicaBusca(); } };
    const btnQ = el('button','btn','🔍 Buscar');
    btnQ.onclick = aplicaBusca;
    const btnLimpa = el('button','btn','limpar');
    btnLimpa.onclick = () => { cmpSel.busca=''; cmpSel.buscaLida=null; cmpSel.filtros=[]; cmpSel.setFiltros=[]; cmpSel.setor=''; lsSet('cmp_sel', cmpSel); renderCmp(); };
    bq.append(inpQ, btnQ, btnLimpa);
    box.append(bq);
    // como a frase foi entendida (e o que ficou de fora)
    if(cmpSel.buscaLida){
      const bl = cmpSel.buscaLida;
      const partes = [];
      if(bl.escopo) partes.push(escopoRotulo(bl.escopo));
      for(const f of cmpSel.filtros){
        const nome = f.kpi ? f.ind : ((CMP_INDS.find(x=>x[0]===f.ind)||[])[1]);
        if(!nome) continue;
        const sinal = f.op==='gt' ? '>' : f.op==='lt' ? '<' : 'entre';
        partes.push(nome+' '+sinal+' '+(f.op==='bt' ? (f.v1+' e '+f.v2) : f.v1));
      }
      const falhou = bl.falhou || (!partes.length && !cmpSel.filtros.length && !bl.parcial);
      if(falhou || bl.parcial){
        // Busca não reconhecida: aviso em destaque + o que existe de parecido +
        // exemplos clicáveis. Não deixa a tela vazia nem executa busca parcial.
        // Quando METADE foi entendida (o escopo), o texto diz isso e o escopo já
        // está aplicado — antes o painel afirmava "não consegui interpretar" para
        // uma consulta cujo setor havia sido reconhecido e usado.
        const av = el('div','notice'); av.style.margin = '0 0 10px';
        if(bl.parcial && bl.escopo){
          av.append(el('b',null,'Entendi só o recorte: '+escopoRotulo(bl.escopo)+'. '),
            document.createTextNode('Falta dizer o indicador (ex.: "com maior ROE", "com P/L abaixo de 10"). '
              + 'O recorte já está aplicado abaixo'
              + ((bl.naoEntendi||[]).length ? ' · não reconheci: '+bl.naoEntendi.join(', ') : '')+'.'));
        } else {
          av.append(el('b',null,'Não consegui interpretar '+(cmpSel.busca ? '"'+cmpSel.busca+'"' : 'a busca')+'. '),
            document.createTextNode('Nada foi filtrado — corrija a frase ou use os seletores abaixo.'));
        }
        box.append(av);

        const sug = sugereTermos(bl.naoEntendi && bl.naoEntendi.length ? bl.naoEntendi : String(cmpSel.busca||'').split(/\s+/), 8);
        if(sug.length){
          const cx = el('div'); cx.style.margin = '0 0 10px';
          cx.append(el('div','ct','Você quis dizer?'));
          const chips = el('div','badges');
          for(const s of sug){
            const b = el('button','btn', s.termo + ' · ' + s.tipo);
            b.onclick = () => {
              if(s.tipo === 'indicador'){ cmpSel.modo='rank'; cmpSel.ind=s.chave; cmpSel.dir='desc'; }
              else { cmpSel.setor = s.chave; cmpSel.modo='rank'; }
              cmpSel.busca=''; cmpSel.buscaLida=null;
              lsSet('cmp_sel', cmpSel); renderCmp();
            };
            chips.append(b);
          }
          cx.append(chips); box.append(cx);
        }

        const ex = el('div'); ex.style.margin = '0 0 12px';
        ex.append(el('div','ct','Buscas que funcionam — clique para rodar'));
        const chipsEx = el('div','badges');
        for(const e of BUSCA_EXEMPLOS){
          const b = el('button','btn', e);
          // roda pelo mesmo caminho da busca digitada, para o exemplo nunca
          // divergir do que a barra faria
          b.onclick = () => { inpQ.value = e; aplicaBusca(); };
          chipsEx.append(b);
        }
        ex.append(chipsEx); box.append(ex);

        const vocab = el('div','note'); vocab.style.margin='0 0 10px';
        vocab.append(el('b',null,'Indicadores que dá para pedir: '),
          document.createTextNode(CMP_INDS.map(x=>x[1]).join(' · ')));
        const vg = el('div'); vg.style.marginTop='4px';
        vg.append(el('b',null,'Classificação: '),
          document.createTextNode('11 setores, 42 subsetores e 80 segmentos — todos no seletor abaixo. Também entende apelidos: varejo, banco, energia, saneamento, construtora, mineração, papel e celulose, frigorífico, shopping, educação, farmácia, agro, transporte.'));
        vocab.append(vg);
        const vs = el('div'); vs.style.marginTop='4px';
        vs.append(el('b',null,'Comparar os setores entre si: '),
          document.createTextNode('"compare os setores por ROIC", "quais subsetores têm maior margem EBITDA", "setores com ROE acima de 15", '
            + '"compare os segmentos do varejo por receita". Cada grupo entra com a mediana (ou o agregado, quando a base tem os componentes) das empresas dele.'));
        vocab.append(vs);
        box.append(vocab);
      } else {
        const lida = el('div','note'); lida.style.margin = '0 0 10px';
        lida.append(el('b',null,'Entendi: '), document.createTextNode(partes.join(' · ')));
        if(bl.avisoGrupo){
          const ag = el('div'); ag.style.marginTop='4px';
          ag.append(el('b',null,'⚠ '), document.createTextNode(bl.avisoGrupo));
          lida.append(ag);
        }
        if(bl.naoEntendi && bl.naoEntendi.length){
          const av = el('div'); av.style.marginTop='4px';
          av.append(el('b',null,'Não reconheci: '), document.createTextNode(bl.naoEntendi.join(', ')
            + ' — esses termos não entraram no filtro. Confira nos seletores abaixo se é o que você queria.'));
          lida.append(av);
          const sug = sugereTermos(bl.naoEntendi, 4);
          if(sug.length){
            const s2 = el('div'); s2.style.marginTop='4px';
            s2.append(el('b',null,'Talvez: '), document.createTextNode(sug.map(s=>s.termo+' ('+s.tipo+')').join(' · ')));
            lida.append(s2);
          }
        }
        box.append(lida);
      }
    }

    cmpSel.filtros.forEach((f,i) => fbox.append(linhaFiltro(f,i)));
    const add = el('button','btn','+ adicionar filtro');
    add.onclick = () => { cmpSel.filtros.push({ind:'roic', op:'gt', v1:null, v2:null}); lsSet('cmp_sel', cmpSel); renderCmp(); };
    fbox.append(add);
    if(!OPD) fbox.append(el('div','dim','carregando os KPIs operacionais — eles aparecem na lista de indicadores em instantes…'));
    box.append(fbox);

    // aplica os filtros que já têm valor preenchido
    const ativos = cmpSel.filtros.filter(f => f.v1!=null || (f.op==='bt' && f.v2!=null));
    // valor de um filtro para uma empresa, seja financeiro ou operacional
    const valorDe = (f, c) => {
      if(f.kpi){ const k = kpiValor(OPIDX, f.ind, c.cvm); return k ? k.v : null; }
      const g = CMP_INDS.find(x=>x[0]===f.ind);
      return g ? g[2](c) : null;
    };
    const rotuloDe = f => f.kpi ? f.ind : ((CMP_INDS.find(x=>x[0]===f.ind)||[])[1] || f.ind);
    const fmtDe = f => f.kpi ? fmtKpi(OPIDX, f.ind) : ((CMP_INDS.find(x=>x[0]===f.ind)||[])[3] || (v=>String(v)));
    const passa = c => ativos.every(f => {
      const v = valorDe(f, c);
      if(v==null || !isFinite(v)) return false;            // sem o dado → fora do resultado
      if(f.op==='gt') return v > f.v1;
      if(f.op==='lt') return v < f.v1;
      const lo = Math.min(f.v1!=null?f.v1:-Infinity, f.v2!=null?f.v2:Infinity);
      const hi = Math.max(f.v1!=null?f.v1:-Infinity, f.v2!=null?f.v2:Infinity);
      return v >= lo && v <= hi;
    });
    const res = escopo.filter(passa);
    // colunas: os indicadores filtrados + valor de mercado como referência
    const cols = [...ativos.map(f=>({kpi:!!f.kpi, ind:f.ind})),
                  {kpi:false, ind:'mktCap'}]
      .filter((x,i,a) => a.findIndex(y=>y.kpi===x.kpi && y.ind===x.ind) === i);
    const valorCol = (col, c) => valorDe(col, c);
    const rotuloCol = col => rotuloDe(col);
    const fmtCol = col => fmtDe(col);
    const ordCol = cols[0];
    res.sort((a,b) => { const va=valorCol(ordCol,a), vb=valorCol(ordCol,b);
      return (vb==null?-Infinity:vb) - (va==null?-Infinity:va); });

    const resumo = el('div','ct');
    resumo.style.marginTop = '12px';
    resumo.textContent = ativos.length
      ? res.length + ' empresa' + (res.length===1?'':'s') + (res.length===1?' passa ':' passam ') + (ativos.length===1?'no ':'nos ') + ativos.length + ' filtro' + (ativos.length===1?'':'s')
        + (escopoNorm(cmpSel.setor) ? ' · ' + rotuloRecorte() : '') + ' (de ' + escopo.length + ' no escopo)'
      : 'Adicione um filtro e preencha o valor para ver o resultado.';
    box.append(resumo);

    // Filtros válidos mas nenhuma empresa passa: mostra qual filtro está cortando
    // tudo e o valor que traria resultado, em vez de só dizer "0 empresas".
    if(ativos.length && !res.length){
      const diag = el('div','notice'); diag.style.marginTop = '10px';
      diag.append(el('b',null,'Nenhuma empresa passa em todos os filtros. '),
        document.createTextNode('Veja abaixo o efeito de cada um separadamente — o que está cortando tudo aparece com poucas empresas.'));
      box.append(diag);
      const linhas = ativos.map(f => {
        const passaSo = escopo.filter(c => {
          const v = valorDe(f, c);
          if(v==null || !isFinite(v)) return false;
          if(f.op==='gt') return v > f.v1;
          if(f.op==='lt') return v < f.v1;
          const lo=Math.min(f.v1,f.v2), hi=Math.max(f.v1,f.v2);
          return v>=lo && v<=hi;
        });
        const vals = escopo.map(c=>valorDe(f,c)).filter(v=>v!=null && isFinite(v)).sort((a,b)=>f.op==='lt'? a-b : b-a);
        // O filtro é ESTRITO (v > limite), então o limite que deixa 3 empresas passando
  // é o 4º melhor valor, não o 3º: com vals[2] a tela prometia "traria 3" e trazia 2.
  const sugerido = vals.length>=4 ? vals[3] : (vals.length? vals[vals.length-1] : null);
  const sugeridoN = vals.length>=4 ? 3 : Math.max(0, vals.length-1);
        const sinal = f.op==='gt' ? '>' : f.op==='lt' ? '<' : 'entre';
        const fm = fmtDe(f);
        // 'nenhuma empresa passa' e 'nenhuma empresa TEM este dado' são coisas
        // diferentes, e a tabela dizia 0 nos dois casos. Indicador recém-adicionado
        // (ou que só existe para parte da base) precisa dizer que falta o dado.
        const semDado = vals.length === 0;
        return [rotuloDe(f) + ' ' + sinal + ' ' + (f.op==='bt' ? (f.v1+'–'+f.v2) : f.v1),
                semDado ? 'nenhuma empresa do escopo tem este dado'
                        : passaSo.length + (f.kpi ? ' (de ' + new Set((OPIDX[f.ind]||[]).map(x=>x.cvm)).size + ' que divulgam)' : ''),
                semDado ? 'o indicador ainda não está na base publicada'
                        : (sugerido==null ? '—' : (f.op==='bt' ? '—' : (sinal+' '+fm(sugerido)+' traria '+sugeridoN)))];
      });
      box.append(tabelaValores(['Filtro','Empresas que passam só neste','Para ter resultado'], linhas));
      const solto = el('div'); solto.style.cssText='display:flex;gap:8px;margin:8px 0 0;flex-wrap:wrap';
      ativos.forEach((f,i) => {
        const b = el('button','btn','remover "'+rotuloDe(f)+'"');
        b.onclick = () => { cmpSel.filtros = cmpSel.filtros.filter(x=>x!==f); lsSet('cmp_sel', cmpSel); renderCmp(); };
        solto.append(b);
      });
      box.append(solto);
    }
    if(ativos.length && res.length){
      const temKpi = cols.some(c=>c.kpi);
      const headers = ['Empresa','Setor', ...cols.map(rotuloCol), ...(temKpi?['Período do KPI']:[])];
      const perKpi = c => { const k = cols.find(x=>x.kpi); const kv = k ? kpiValor(OPIDX, k.ind, c.cvm) : null; return kv ? kv.p : null; };
      const linhas = res.map(c => [c.name, c.subsetor || c.setor, ...cols.map(k => valorCol(k,c)), ...(temKpi?[perKpi(c)]:[])]);
      const w = el('div','qtblwrap'); w.style.marginTop='8px';
      const t = el('table','qtbl');
      const hr = el('tr'); for(const h of headers) hr.append(el('th',null,h));
      const th = el('thead'); th.append(hr); t.append(th);
      const tb = el('tbody');
      res.forEach((c,ix) => {
        const tr = el('tr'); tr.style.cursor='pointer';
        tr.onclick = () => openDetail(c.cvm);
        tr.append(el('td',null,c.name), el('td',null,c.subsetor||c.setor));
        cols.forEach(k => tr.append(el('td',null, fmtCol(k)(valorCol(k,c)))));
        if(temKpi) tr.append(el('td',null, perKpi(c) || '—'));
        tb.append(tr);
      });
      t.append(tb); w.append(t); box.append(w);
      const tools = el('div'); tools.style.cssText='display:flex;gap:8px;margin:8px 0 0;flex-wrap:wrap';
      const bCopy = el('button','btn','⧉ copiar dados (Excel)');
      bCopy.onclick = () => copiaTSV(headers, linhas, bCopy);
      const bPeer = el('button','btn','★ usar como peer set');
      bPeer.onclick = () => {
        cmpSel.emps = res.slice(0, PEER_MAX).map(c=>c.cvm);
        cmpSel.peerNome = '';
        cmpSel.modo = 'peer';
        lsSet('cmp_sel', cmpSel); renderCmp();
      };
      tools.append(bCopy, bPeer);
      box.append(tools);
      if(res.length > PEER_MAX)
        // rotuloCol e não cols[0][1]: cols guarda objetos {kpi, ind}, então indexar
        // por [1] escrevia "ordenado por undefined" na tela
        box.append(el('div','dim','O peer set leva as '+PEER_MAX+' primeiras (ordenado por '+rotuloCol(ordCol)+').'));
    }
    const kpisAtivos = ativos.filter(f=>f.kpi);
    let avisoKpi = '';
    if(kpisAtivos.length){
      const partes = kpisAtivos.map(f => {
        const fora = kpiForaDaUnidade(OPIDX, f.ind);
        const quantos = new Set((OPIDX[f.ind]||[]).map(x=>x.cvm)).size;
        return f.ind + ': ' + quantos + ' empresas divulgam'
          + (fora.length ? '; fora do filtro por reportarem em outra unidade — ' + fora.join(', ') : '');
      });
      avisoKpi = ' ⚠ Os KPIs operacionais vêm da curadoria dos releases, não da CVM estruturada: '
        + 'cada empresa nomeia e mede do seu jeito, e o valor usado é o do ÚLTIMO trimestre que ela divulgou (a coluna Período mostra qual). '
        + 'O filtro compara só dentro da unidade dominante da família. ' + partes.join(' · ') + '.';
    }
    noteEl2.textContent = 'Empresas sem o dado de algum filtro ficam fora do resultado — o screener não presume valor ausente. '
      + 'Múltiplos (P/L, P/VP, EV/EBITDA, DY) vêm do Fundamentus no último fechamento; ROIC, margens e alavancagem são calculados dos 12 meses da CVM. Os filtros ficam salvos neste navegador.'
      + avisoKpi;

  } else if(cmpSel.modo==='peer'){
    // ---------- PEER SET: tabela empresas × indicadores + estatísticas ----------
    const nome = cmpSel.peerNome || 'Peer set';
    titulo.textContent = nome + ' — ' + cmpSel.emps.length + ' empresa' + (cmpSel.emps.length===1?'':'s');
    const cands = COS.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'','pt-BR'));
    const addBar = el('div','cmpbar'); addBar.style.margin='0 0 10px';
    const peerCheio = cmpSel.emps.length >= PEER_MAX;
    const addPeer = mkSel(peerCheio
        ? [['','limite de '+PEER_MAX+' empresas — remova uma para adicionar outra']]
        : [['','+ adicionar empresa…'], ...cands.filter(c=>!cmpSel.emps.includes(c.cvm)).map(c=>[c.cvm,c.name])],
      '', v => { if(v && cmpSel.emps.length<PEER_MAX){ cmpSel.emps.push(v); lsSet('cmp_sel', cmpSel); renderCmp(); } },
      'Adicionar empresa ao peer set');
    if(peerCheio) addPeer.disabled = true;
    addBar.append(addPeer);
    box.append(addBar);
    // chips para remover
    if(cmpSel.emps.length){
      const chips = el('div','badges'); chips.style.marginBottom='10px';
      for(const cv of cmpSel.emps){
        const c2 = COS.find(x=>x.cvm===cv); if(!c2) continue;
        const b = el('span','badge', c2.name+' ');
        const x = el('button','rmv','✕');
        x.onclick = () => { cmpSel.emps = cmpSel.emps.filter(z=>z!==cv); lsSet('cmp_sel', cmpSel); renderCmp(); };
        b.append(x); chips.append(b);
      }
      box.append(chips);
    }
    const membros = cmpSel.emps.map(cv=>COS.find(c=>c.cvm===cv)).filter(Boolean);
    if(!membros.length){
      box.append(el('div','dim','Monte o peer set adicionando empresas acima, ou rode o screener e clique em "usar como peer set".'));
    } else {
      const cols = ['roic','roe','mgE12','evebitda','pl','pvp','dlEbitda','rev12','mktCap']
        .map(k=>CMP_INDS.find(x=>x[0]===k)).filter(Boolean);
      // setor dominante do peer set → mediana setorial de referência
      const cont = {}; for(const c of membros) cont[c.setor]=(cont[c.setor]||0)+1;
      const setorDom = Object.entries(cont).sort((a,b)=>b[1]-a[1])[0][0];
      const peersSetor = COS.filter(c=>c.setor===setorDom);
      const medSet = {}, medPeer = {};
      for(const k of cols){
        medPeer[k[0]] = med(membros.map(c=>k[2](c)).filter(v=>v!=null && isFinite(v)));
        medSet[k[0]]  = med(peersSetor.map(c=>k[2](c)).filter(v=>v!=null && isFinite(v)));
      }
      const headers = ['Empresa', ...cols.map(k=>k[1])];
      const w = el('div','qtblwrap'); const t = el('table','qtbl');
      const hr = el('tr'); for(const h of headers) hr.append(el('th',null,h));
      const th = el('thead'); th.append(hr); t.append(th);
      const tb = el('tbody');
      for(const c of membros){
        const tr = el('tr'); tr.style.cursor='pointer'; tr.onclick = () => openDetail(c.cvm);
        tr.append(el('td',null,c.name));
        for(const k of cols){
          const v = k[2](c);
          const td = el('td',null, k[3](v));
          const mp = medPeer[k[0]];
          if(v!=null && mp!=null && isFinite(v)){
            // negrito quando está acima da mediana do próprio peer set
            if(v > mp) td.style.fontWeight = '600';
          }
          tr.append(td);
        }
        tb.append(tr);
      }
      // Estatística completa do conjunto, no formato que a comps table de um
      // banco ou de uma consultoria usa: n com o dado, mínimo, 1º quartil,
      // mediana, 3º quartil, máximo. Sem o "n", mediana de 3 empresas parece ter
      // o mesmo peso que mediana de 30 — e não tem.
      const vetor = {};
      for(const k of cols) vetor[k[0]] = membros.map(c => k[2](c)).filter(v => v != null && isFinite(v));
      const estatLinhas = [
        ['empresas com o dado', k => String(vetor[k[0]].length), true],
        ['mínimo',   k => k[3](vetor[k[0]].length ? Math.min(...vetor[k[0]]) : null)],
        ['1º quartil', k => k[3](quantil(vetor[k[0]], 0.25))],
        ['mediana do peer set', k => k[3](medPeer[k[0]])],
        ['3º quartil', k => k[3](quantil(vetor[k[0]], 0.75))],
        ['máximo',   k => k[3](vetor[k[0]].length ? Math.max(...vetor[k[0]]) : null)],
        ['mediana do setor '+setorDom, k => k[3](medSet[k[0]])],
      ];
      for(const [rot, fn] of estatLinhas){
        const tr = el('tr'); tr.style.background='var(--wash)';
        const td0 = el('td',null,rot); td0.style.fontWeight = '600';
        tr.append(td0);
        for(const k of cols) tr.append(el('td',null, fn(k)));
        tb.append(tr);
      }
      t.append(tb); w.append(t); box.append(w);
      // Percentil de cada empresa dentro do PRÓPRIO SETOR (não do peer set): é a
      // pergunta "esta empresa é cara ou barata para o setor dela", que o peer
      // set escolhido a dedo não responde sozinho.
      const wp = el('div','qtblwrap'); wp.style.marginTop='10px';
      const tp = el('table','qtbl');
      const hp = el('tr'); hp.append(el('th',null,'Percentil no setor'));

      noteEl2.textContent = 'Negrito = acima da mediana do próprio peer set. Quartis e mínimo/máximo são calculados só sobre as empresas do conjunto que TÊM o indicador (a linha "empresas com o dado" diz quantas são). O percentil compara a empresa com todas as listadas do SETOR dela, não com o peer set. A mediana setorial usa o setor com mais empresas no conjunto ('
        + setorDom + ', ' + peersSetor.length + ' empresas listadas). Clique numa linha para abrir a empresa. '
        + 'Salve o conjunto e copie o link para abrir a mesma comparação em outro computador.';
    }

  } else if(cmpSel.modo==='op'){
    // pediu "por setor" num KPI operacional: diz por que o resultado é por empresa
    if(cmpSel.buscaLida && cmpSel.buscaLida.avisoGrupo)
      card.insertBefore(el('div','notice','⚠ '+cmpSel.buscaLida.avisoGrupo), box);
    const cvmsNoEscopo = new Set(escopo.map(c=>c.cvm));
    let lista = (OPIDX[cmpSel.opind] || []).filter(x => cvmsNoEscopo.has(x.cvm));
    // dentro da família, compara só o grupo de unidade dominante (% com %, R$ com R$…)
    let omitidos = [];
    if(lista.length > 1){
      const cont = {};
      for(const x of lista) cont[x.uc] = (cont[x.uc]||0)+1;
      const ucDom = Object.entries(cont).sort((a,b)=>b[1]-a[1])[0][0];
      omitidos = lista.filter(x => x.uc !== ucDom);
      lista = lista.filter(x => x.uc === ucDom);

    if(!lista.length){

    } else {
      const un = lista[0].unidade || '';
      const unsDiferentes = new Set(lista.map(x=>x.unidade||'')).size > 1;
      const fmtOp = v => nbr2.format(v)+(un && un.length<12 && !unsDiferentes ? ' '+un : '');
      const rows = lista.map(x => { const p = ultimoPeriodo(x.valores);
        return {label: x.empresa+' ('+p+')', v: x.valores[p], cvm: x.cvm}; })

        .sort((a,b)=>b.v-a.v);
      hbarChart(box, rows, fmtOp, cvm=>openDetail(cvm));
      card.append(chartTools(() => box.querySelector('svg'),
        () => ({headers:['Empresa','Período',cmpSel.opind+(un?' ('+un+')':'')],
                linhas: lista.map(x => { const p = ultimoPeriodo(x.valores); return [x.empresa, p, x.valores[p]]; })}),
        () => 'KPI '+cmpSel.opind));
      // histórico do KPI entre as empresas (quando houver 2+ períodos)
      const series = lista.map(x => ({label:x.empresa,
        rows: Object.keys(x.valores).sort().map(p => ({p, v: x.valores[p]}))})).filter(s=>s.rows.length>1);
      if(series.length){
        const h = el('div'); h.style.marginTop='14px';
        card.append(el('div','ct','Evolução do KPI'), h);
        multiLineChart(h, series.slice(0,4), fmtOp);
      }
      noteEl2.textContent = 'Comparação pelo último período divulgado por cada empresa (o período vai no rótulo). '
        + 'Unidade: '+(un||'ver release')+'. '
        + (omitidos.length ? 'Fora do gráfico por reportarem em outra unidade: '
            + omitidos.map(x=>x.empresa+' ('+(x.unidade||'sem unidade')+')').join(', ')+'. ' : '')
        + (unsDiferentes ? '⚠ Definições podem variar entre empresas: '
            + lista.map(x=>x.empresa+' = "'+(x.nomeOriginal||'')+'"').join(' · ')+'. ' : '')
        + 'Fonte: releases das próprias empresas, curadoria verificada.';
    }
  } else if(cmpSel.modo==='hist'){
    // mesmo cuidado do CMP_INDS: desestruturar find() sem fallback derruba a view
    // inteira quando a chave salva no navegador não existe mais na lista
    const parHist = HIST_INDS.find(x=>x[0]===cmpSel.hind) || HIST_INDS[0];
    if(parHist[0] !== cmpSel.hind) cmpSel.hind = parHist[0];
    const [hk, hlabel, hfmt] = parHist;
    titulo.textContent = 'Histórico — '+hlabel;
    // chips das empresas escolhidas
    const chips = el('div','badges'); chips.style.marginBottom = '8px';
    for(const cv of cmpSel.emps){
      const c2 = COS.find(x=>x.cvm===cv); if(!c2) continue;
      const b = el('span','badge', c2.name+' ');
      const x = el('button','rmv','✕');
      x.onclick = () => { cmpSel.emps = cmpSel.emps.filter(z=>z!==cv); lsSet('cmp_sel', cmpSel); renderCmp(); };
      b.append(x); chips.append(b);
    }
    card.insertBefore(chips, box);
    if(!cmpSel.emps.length){
      box.append(el('div','dim','adicione até 4 empresas no seletor acima para comparar o histórico'));
    } else {
      const series = cmpSel.emps.map(cv => {
        const c2 = COS.find(x=>x.cvm===cv);
        const s = c2 && indSeries(c2, hk);
        return {label: c2? c2.name : cv, rows: (s && s.rows) || []};
      });
      // a paleta tem 4 cores (SERIE_CORES): acima disso duas empresas ficavam com
      // a MESMA cor e o gráfico deixava de ser legível. O modo "KPIs operacionais"
      // já cortava em 4; aqui não cortava.
      const series4 = series.slice(0,4);
      multiLineChart(box, series4, hfmt);
      if(series.length > 4)
        box.append(el('div','dim','Mostrando as 4 primeiras de '+series.length+' empresas — o gráfico tem 4 cores. Remova alguma para trocar.'));
      const perAll = [...new Set(series.flatMap(s=>s.rows.filter(r=>r.v!=null).map(r=>r.p)))].sort();
      const linhas = perAll.map(p => [p, ...series.map(s => { const r = s.rows.find(x=>x.p===p); return r? r.v : null; })]);
      card.append(chartTools(() => box.querySelector('svg'),
        () => ({headers: ['Período', ...series.map(s=>s.label)], linhas}),
        () => 'Histórico '+hlabel));
      card.append(tabelaValores(['Período', ...series.map(s=>s.label)],
        linhas.map(l => [l[0], ...l.slice(1).map(v => v==null?null:hfmt(v))])));

      // ---- estatísticas da série: CAGR (quando faz sentido), média, extremos ----
      const podeCagr = CAGR_OK.has(hk);
      const sts = series.map(s => ({label: s.label, e: estat(s.rows, podeCagr)})).filter(x=>x.e);
      if(sts.length){
        const medianaSetor = (() => {
          // mediana do último valor do indicador no setor das empresas escolhidas
          const setores = [...new Set(cmpSel.emps.map(cv => (COS.find(c=>c.cvm===cv)||{}).setor).filter(Boolean))];
          if(setores.length !== 1) return null;   // só faz sentido com peers do mesmo setor
          const vals = COS.filter(c=>c.setor===setores[0]).map(c => {
            const s2 = indSeries(c, hk); if(!s2 || !s2.rows) return null;
            const ok = s2.rows.filter(r=>r.v!=null); return ok.length? ok[ok.length-1].v : null;
          }).filter(v=>v!=null && isFinite(v));
          return vals.length>=3 ? {setor: setores[0], v: med(vals), n: vals.length} : null;
        })();
        const heads = ['Empresa','Período','Último','Média', ...(podeCagr?['CAGR a.a.']:[]), 'Variação no período','Mínimo','Máximo'];
        const lns = sts.map(x => {
          const e = x.e;
          return [x.label,
            e.ini.p+' → '+e.fim.p,
            hfmt(e.fim.v),
            hfmt(+e.media.toFixed(2)),
            ...(podeCagr ? [e.cagr==null? '—' : fmtPct(+e.cagr.toFixed(1))] : []),
            // base negativa não gera percentual (inverteria o sinal): mostra a
            // variação absoluta, que é a informação honesta nesse caso
            e.varTotal!=null ? fmtPct(+e.varTotal.toFixed(1))
              : (e.varAbs!=null ? hfmt(+e.varAbs.toFixed(2))+' (absoluta)' : '—'),
            hfmt(e.min), hfmt(e.max)];
        });
        if(medianaSetor)
          lns.push(['mediana do setor '+medianaSetor.setor, '(último dado)', hfmt(+medianaSetor.v.toFixed(2)), '—',
                    ...(podeCagr?['—']:[]), '—','—','—']);
        card.append(el('div','ct','Estatísticas do período'));
        card.append(tabelaValores(heads, lns));
        const bStat = el('button','btn','⧉ copiar estatísticas (Excel)');
        bStat.onclick = () => copiaTSV(heads, lns, bStat);
        const wrapS = el('div'); wrapS.style.cssText='display:flex;gap:8px;margin:8px 0 0;flex-wrap:wrap';
        wrapS.append(bStat); card.append(wrapS);
      }
    }
    noteEl2.textContent = 'Séries trimestrais da CVM (12m móveis onde indicado). '
      + (CAGR_OK.has(hk)
          ? 'CAGR calculado entre o primeiro e o último trimestre da série, anualizado — só aparece com 1 ano ou mais e valores positivos nas duas pontas. '
          : 'CAGR não se aplica a percentual ou múltiplo, por isso a coluna não aparece neste indicador. ')
      + 'A mediana setorial só entra quando todas as empresas escolhidas são do mesmo setor. '
      + 'Sua seleção fica salva neste navegador. Copie os dados para o Excel ou baixe o gráfico em PNG para usar em slides.';
  } else if(cmpSel.modo==='set'){
    // ---------- SETORES ENTRE SI: uma barra por setor/subsetor/segmento ----------
    const avIg0 = avisoIgnorados('Esta comparação de setores');
    if(avIg0) card.insertBefore(avIg0, box);
    const niv = setNivelEfetivo();
    if(!niv){
      // escopo já está no nível mais fino: não há grupo abaixo para comparar
      titulo.textContent = 'Setores entre si — '+label;
      box.append(el('div','notice','⚠ O filtro está em '+rotuloRecorte()+', o nível mais fino da classificação da B3 — '
        + 'não existe grupo abaixo dele para comparar. Suba o filtro para subsetor ou setor (ou limpe-o) para comparar grupos entre si.'));
      const wr = el('div'); wr.style.cssText = 'display:flex;gap:8px;margin:10px 0 0;flex-wrap:wrap';
      const b1 = el('button','btn','ver o ranking das empresas deste segmento');
      b1.onclick = () => { cmpSel.modo='rank'; lsSet('cmp_sel', cmpSel); renderCmp(); };
      const b2 = el('button','btn','limpar o filtro e comparar todos os setores');
      b2.onclick = () => { cmpSel.setor=''; cmpSel.setNivel='set'; lsSet('cmp_sel', cmpSel); renderCmp(); };
      wr.append(b1, b2); box.append(wr);
      noteEl2.textContent = 'A B3 classifica em três níveis: 11 setores, 42 subsetores e 80 segmentos.';
    } else {
      const st = cmpSel.setStat, minEmp = cmpSel.setMin;
      const nivPedido = ['set','sub','seg'].includes(cmpSel.setNivel) ? cmpSel.setNivel : 'set';
      // limites numéricos vindos da busca ("setores com ROIC acima de 15 e alavancagem
      // abaixo de 2"): valem sobre a estatística do GRUPO, não sobre cada empresa
      const fls = (Array.isArray(cmpSel.setFiltros) ? cmpSel.setFiltros : []).filter(f =>
        f && ['gt','lt','bt'].includes(f.op) && typeof f.v1 === 'number' && CMP_INDS.some(x=>x[0]===f.ind));
      // "Agregado" não existe para todo indicador (ROIC, P/VP, DY não têm componente
      // na base): nesses casos o filtro cai para a mediana, e a nota diz isso.
      const stDe = k => setStatOpcoes(k).some(x=>x[0]===st) ? st : 'med';
      const trocouSt = fls.filter(f => stDe(f.ind) !== st).map(f => (CMP_INDS.find(x=>x[0]===f.ind)||[])[1]);
      const indsNec = [...new Set([cmpSel.ind, ...fls.map(f=>f.ind)])];
      const gs = gruposDe(escopo, niv).map(g => {
        const es = {};
        for(const k of indsNec) es[k] = setEstat(g, k);
        return {g, es, e: es[cmpSel.ind]};
      });
      const semDado = gs.filter(x => x.e.n === 0);
      const semStat = gs.filter(x => x.e.n > 0 && setValor(x.e, st) == null);
      const poucos  = gs.filter(x => setValor(x.e, st) != null && setN(x.e, st) < minEmp);
      let vis      = gs.filter(x => setValor(x.e, st) != null && setN(x.e, st) >= minEmp);
      const passaFiltro = (f, es) => {
        const e2 = es[f.ind]; if(!e2) return false;
        const s2 = stDe(f.ind);
        const v = setValor(e2, s2), n = setN(e2, s2);
        if(v == null || !isFinite(v) || n < minEmp) return false;   // grupo sem base não passa
        if(f.op==='gt') return v > f.v1;
        if(f.op==='lt') return v < f.v1;
        const lo = Math.min(f.v1, f.v2==null ? f.v1 : f.v2), hi = Math.max(f.v1, f.v2==null ? f.v1 : f.v2);
        return v >= lo && v <= hi;
      };
      let cortouFiltro = [];
      if(fls.length){
        cortouFiltro = vis.filter(x => !fls.every(f => passaFiltro(f, x.es)));
        vis = vis.filter(x => fls.every(f => passaFiltro(f, x.es)));
      }
      vis.sort((a,b) => cmpSel.dir==='asc' ? setValor(a.e,st)-setValor(b.e,st) : setValor(b.e,st)-setValor(a.e,st));
      titulo.textContent = (cmpSel.dir==='asc'?'Menores':'Maiores')+' — '+label+' · '+setStatRotulo(st)+' por '+nivelNome(niv)
        + (escopoNorm(cmpSel.setor) ? ' · dentro de '+rotuloRecorte() : '');
      // desceu de nível sozinho porque o pedido daria um grupo só
      if(niv !== nivPedido)
        box.append(el('div','note','Você pediu '+nivelNome(nivPedido)+', mas o filtro já está em '+rotuloRecorte()
          +' — agrupei por '+nivelNome(niv)+', o nível abaixo, que é o que divide esse conjunto em partes comparáveis.'));
      if(fls.length){
        const chip = el('div'); chip.style.cssText = 'display:flex;gap:8px;align-items:center;margin:0 0 8px;flex-wrap:wrap';
        chip.append(el('b',null,'Filtros sobre o grupo: '));
        fls.forEach((f, ifl) => {
          const nm = (CMP_INDS.find(x=>x[0]===f.ind)||[])[1] || f.ind;
          const sinal = f.op==='gt' ? '>' : f.op==='lt' ? '<' : 'entre';
          const b = el('span','badge', setStatRotulo(stDe(f.ind))+' de '+nm+' '+sinal+' '+(f.op==='bt' ? (f.v1+' e '+f.v2) : f.v1)+' ');
          const x = el('button','rmv','✕');
          x.title = 'tirar este filtro';
          x.onclick = () => { cmpSel.setFiltros = fls.filter((_,j)=>j!==ifl); lsSet('cmp_sel', cmpSel); renderCmp(); };
          b.append(x); chip.append(b);
        });
        box.append(chip);
      }
      // o rótulo carrega a cobertura: "(17/49)" quando menos da metade do grupo
      // tem o dado, para o gráfico sozinho (num slide, por exemplo) não sugerir
      // que a barra descreve o grupo inteiro
      const rows = vis.map(x => {
        const parcial = x.e.n*2 < x.e.nGrupo;
        return {label: x.g.nome, suf: ' ('+(parcial ? x.e.n+'/'+x.e.nGrupo : x.e.n)+')',
                v: setValor(x.e, st), key: x.g.chave};
      });
      const grafico = el('div'); box.append(grafico);
      // clicar num grupo desce para o ranking das empresas dele
      hbarChart(grafico, rows, fmt, chave => {
        cmpSel.setor = chave; cmpSel.modo = 'rank';
        lsSet('cmp_sel', cmpSel); renderCmp();
        $('#cmpview').scrollIntoView({block:'start'});
      });
      const temAgg = !!SET_AGG[cmpSel.ind], temSum = SET_SOMA.has(cmpSel.ind);
      const capNiv = nivelNome(niv).charAt(0).toUpperCase()+nivelNome(niv).slice(1);
      // 'Com o dado' conta quem tem o indicador (base da mediana, média, mín e
      // máx). No agregado entra menos gente — só quem tem os DOIS componentes com
      // denominador positivo —, e isso vai em coluna própria para as duas contagens
      // não se passarem uma pela outra.
      const heads = [capNiv,'Empresas no grupo','Com o dado','Mediana','Média',
        ...(temAgg?['Agregado','Entraram no agregado','Maior parcela do denominador']:[]),
        ...(temSum?['Soma do grupo']:[]),'Mínimo','Máximo'];
      const lnNum = vis.map(x => [x.g.nome, x.e.nGrupo, x.e.n,
        x.e.med, x.e.avg==null?null:+x.e.avg.toFixed(2),
        ...(temAgg?[x.e.agg==null?null:+x.e.agg.toFixed(2), x.e.nAgg,
                    x.e.conc==null?null:((x.e.concNome?x.e.concNome+' · ':'')+(100*x.e.conc).toFixed(0)+'%')]:[]),
        ...(temSum?[x.e.sum]:[]), x.e.min, x.e.max]);
      if(vis.length){
        card.append(el('div','ct','Estatísticas de cada grupo'));
        // colunas que NÃO usam o formato do indicador: contagens e a concentração
        const cru = new Set(temAgg ? [0,1,2,6,7] : [0,1,2]);
        card.append(tabelaValores(heads, lnNum.map(l => l.map((v,i) => {
          if(cru.has(i)) return v == null ? '—' : v;
          return v == null ? '—' : fmt(v);
        }))));
        card.append(chartTools(() => grafico.querySelector('svg'),
          () => ({headers: heads, linhas: lnNum}),
          () => 'Setores '+label+' - '+setStatRotulo(st)));
      }
      // ---- por que um grupo não está no gráfico ----
      const fora = [];
      if(poucos.length) fora.push('abaixo do mínimo de '+minEmp+' empresa'+(minEmp===1?'':'s')+' com o dado: '
        + poucos.map(x=>x.g.nome+' ('+setN(x.e, st)+')').join(', '));
      if(semDado.length) fora.push('sem nenhuma empresa com '+label+': '
        + semDado.slice(0,12).map(x=>x.g.nome).join(', ') + (semDado.length>12 ? ' e outros '+(semDado.length-12) : ''));
      if(semStat.length) fora.push('têm '+label+', mas sem '+setStatRotulo(st)
        + (st==='agg' ? ' (nenhuma empresa com denominador positivo, ou soma do denominador abaixo de R$ '+SET_AGG_PISO+' mi)' : '')
        + ': ' + semStat.slice(0,12).map(x=>x.g.nome+' ('+x.e.n+')').join(', ')
        + (semStat.length>12 ? ' e outros '+(semStat.length-12) : ''));
      if(cortouFiltro.length) fora.push('reprovados no filtro do grupo: '
        + cortouFiltro.map(x => {
            const quais = fls.filter(f => !passaFiltro(f, x.es)).map(f => {
              const gi = CMP_INDS.find(y=>y[0]===f.ind) || [];
              const v = x.es[f.ind] ? setValor(x.es[f.ind], stDe(f.ind)) : null;
              return (gi[1]||f.ind)+' '+(v==null ? 'sem dado' : (gi[3]||String)(v));
            });
            return x.g.nome+' ('+quais.join('; ')+')';
          }).join(' · '));
      if(fora.length){
        const d = el('div','note'); d.style.marginTop='10px';
        d.append(el('b',null,'Grupos fora do gráfico — '), document.createTextNode(fora.join(' · ')+'.'));
        card.append(d);
      }
      // grupo em que menos da metade das empresas tem o dado: o número existe, mas
      // representa só uma parte do grupo — isso precisa estar escrito, não implícito
      const parciais = vis.filter(x => x.e.n * 2 < x.e.nGrupo);
      if(parciais.length){
        const d2 = el('div','note'); d2.style.marginTop='6px';
        d2.append(el('b',null,'⚠ Cobertura parcial — '), document.createTextNode(
          'nestes grupos menos da metade das empresas tem '+label+', então a barra descreve só essa parte: '
          + parciais.map(x=>x.g.nome+' ('+x.e.n+' de '+x.e.nGrupo+')').join(', ')
          + '. Costuma ser indicador que não se aplica ao tipo de empresa (EBITDA de banco, múltiplo de empresa sem lucro).'));
        card.append(d2);
      }
      if(!vis.length)
        box.append(el('div','notice','⚠ Nenhum '+nivelNome(niv)+' tem '+minEmp+' ou mais empresas com '+label
          +(fls.length?' que passem nos filtros do grupo':'')+'. Baixe o mínimo de empresas, troque a estatística ou escolha outro indicador — '
          +'o painel não estima o valor que falta.'));
      // ---- nota: o que o número é, exatamente ----
      const A = SET_AGG[cmpSel.ind];
      const nFinEsc = escopo.filter(c=>c.fin).length;
      // a soma junta os 12 meses de cada empresa, e cada uma fecha o próprio
      // trimestre: aqui vai o tamanho real dessa mistura
      const ultimoP = c => { let m=''; for(const q of (c.q||[])) if(q.p > m) m = q.p; return m || null; };
      // conta as empresas que entraram na SOMA (não as dos grupos exibidos):
      // eram coisas diferentes e o texto dizia 346 para uma soma de 195
      const incluidas = vis.flatMap(x => (x.e.dentro || []));
      const pers = {}; let semTri = 0;
      for(const c of incluidas){ const p = ultimoP(c); if(p) pers[p] = (pers[p]||0)+1; else semTri++; }
      const perOrd = Object.entries(pers).sort((a,b)=>b[1]-a[1]);
      const outros = incluidas.length - (perOrd.length ? perOrd[0][1] : 0) - semTri;
      const perTxt = perOrd.length
        ? perOrd[0][1]+' das '+incluidas.length+' empresas que entraram na soma fecham em '+perOrd[0][0]
          + (outros > 0 ? ', '+outros+' em trimestre anterior' : '')
          + (semTri > 0 ? ' e '+semTri+' sem trimestre entregue' : '')+'. '
        : '';
      // (quem tem prejuízo é justamente quem o agregado excluiu — está em foraNeg)
      const foraNeg = [...new Set(vis.flatMap(x => x.e.foraNeg || []))];
      const NAO_APLICA_FIN2 = new Set(['roic','evebitda','mgE12','dlEbitda','ev']);
      noteEl2.textContent = 'Cada barra é ' + (st==='sum' ? 'a soma de ' : st==='agg' ? 'o agregado de ' : 'a '+setStatRotulo(st)+' de ')
        + label + ' das empresas do ' + nivelNome(niv) + '; o número entre parênteses é quantas empresas do grupo têm o indicador, e quando aparecem dois — (23/53) — o segundo é o tamanho do grupo. '
        + 'Empresa sem o dado não entra e não conta como zero. '
        + (st==='agg' && A && vis.length
            ? 'Agregado = ' + A.rot + ' — soma dos componentes de cada empresa, não média de razões: é o indicador do grupo somado, '
              + 'e é o que costuma responder "qual a margem do setor". Como cada empresa fecha o próprio trimestre, a soma junta '
              + 'os 12 meses acumulados de datas de fechamento diferentes: ' + perTxt
              + 'A coluna "maior parcela do denominador" nomeia a empresa com a maior parcela do denominador somado e o peso dela — quando passa de uns 50%, o número do grupo é praticamente o dela. '
              + 'Grupo com denominador somado negativo, ou abaixo de R$ ' + SET_AGG_PISO + ' mi, fica sem número em vez de receber um múltiplo sem sentido '
              + '(foi assim que "ROE do setor Outros" chegava a −208%: 8 holdings com R$ 40 mi de patrimônio somado). '
              + (foraNeg.length
                  ? '⚠ Fora do agregado por ter ' + (A.den2 || 'o denominador') + ' não positivo (somar valor negativo com positivo não produz indicador): '
                    + (foraNeg.length > 14 ? foraNeg.slice(0,14).join(', ')+' e outras '+(foraNeg.length-14) : foraNeg.join(', ')) + '. '
                  : '')
              + (cmpSel.ind === 'pl' && foraNeg.length
                  ? '⚠ As ' + foraNeg.length + ' empresas com prejuízo nos 12 meses NÃO entram no P/L agregado: lucro somado negativo não produz múltiplo, então elas saem da conta junto com o valor de mercado delas. O número é o P/L do grupo lucrativo, não do grupo inteiro. '
                  : '')
            : st==='sum'
            ? 'A soma faz sentido aqui porque o indicador é valor em R$, não razão. '
            : st==='med'
            ? 'A mediana é a empresa do meio do grupo: uma empresa fora do padrão não desloca o número (a média, sim). '
              + (A ? 'Para o indicador do grupo somado, troque a estatística para "Agregado". ' : '')
            : 'A média trata todas as empresas com o mesmo peso, então uma empresa fora do padrão desloca o número — a mediana não. '
              + (A ? 'Para o indicador do grupo somado, troque para "Agregado". ' : ''))
        + 'Clique numa barra para ver o ranking das empresas do grupo. '
        + (fls.length ? 'Os filtros do grupo cortam pela estatística do grupo, não pela empresa: um '+nivelNome(niv)
            +' passa quando o próprio número dele passa no limite. '
            + (trocouSt.length ? '⚠ A estatística "'+setStatRotulo(st)+'" não existe para '+trocouSt.join(' nem para ')
                +', então nesse(s) filtro(s) o corte usou a mediana do grupo. ' : '')
          : '')
        + (NAO_APLICA_FIN2.has(cmpSel.ind) && nFinEsc > 0
            ? '⚠ ' + label + ' não se aplica a banco e seguradora ('
              + (cmpSel.ind === 'ev' ? 'dívida líquida de instituição financeira não é dívida no sentido do múltiplo, e o painel não a estrutura'
                                     : 'a CVM não estrutura EBITDA/capital investido para instituição financeira') + '): '
              + nFinEsc + ' empresa' + (nFinEsc===1?'':'s') + ' do escopo ' + (nFinEsc===1?'fica':'ficam') + ' fora, e grupos financeiros aparecem com menos empresas ou nem aparecem. '
            : '')
        + 'Fontes: CVM (12 meses acumulados) para margens, retornos e alavancagem; Fundamentus (último fechamento) para P/L, P/VP, DY e EV/EBITDA.';
    }

  } else if(cmpSel.modo==='mapa'){
    const metR = (MAPA_CORES.find(m=>m[0]===(cmpSel.mapaCor||'var')) || MAPA_CORES[0])[1];
    titulo.textContent = 'Mapa de calor — ' + metR + ' · ' + rotuloRecorte();
    renderMapa(box);
    card.append(chartTools(() => box.querySelector('svg'), () => null, 'Mapa de calor ' + metR));

  } else if(cmpSel.modo==='rank'){
    const avIg = avisoIgnorados('Este ranking');
    if(avIg) card.insertBefore(avIg, box);
    let rows = escopo.map(c=>({label:c.name, v:getter(c), cvm:c.cvm})).filter(r=>r.v!=null && isFinite(r.v));
    rows.sort((a,b)=>cmpSel.dir==='asc'? a.v-b.v : b.v-a.v);
    titulo.textContent = (cmpSel.dir==='asc'?'Menores':'Maiores')+' — '+label+' · '+rotuloRecorte();
    const mostra20 = rows.slice(0,20);
    hbarChart(box, mostra20, fmt, cvm=>openDetail(cvm));
    card.append(chartTools(() => box.querySelector('svg'),
      () => ({headers: ['Empresa', label], linhas: rows.map(r=>[r.label, r.v])}),
      () => 'Ranking '+label+(escopoNorm(cmpSel.setor)?' - '+rotuloRecorte():'')));
    // Quando o escopo é de bancos/seguradoras e o indicador depende de EBITDA ou
    // capital investido, muita empresa fica de fora — explica o porquê em vez de
    // deixar o ranking curto sem motivo aparente.
    const NAO_APLICA_FIN = new Set(['roic','evebitda','mgE12','dlEbitda','ev']);
    const nFin = escopo.filter(c=>c.fin).length;
    const avisoFin = (NAO_APLICA_FIN.has(cmpSel.ind) && nFin > 0 && nFin >= escopo.length*0.3)
      ? ' ⚠ '+nFin+' das '+escopo.length+' empresas deste filtro são bancos ou seguradoras, e '+label
        +' não se aplica a elas (a CVM não estrutura EBITDA/capital investido para instituição financeira) — por isso ficam fora do ranking. Para financeiras use ROE, P/VP ou Índice de Basileia.'
      : '';
    const nSusp = escopo.filter(niSuspeito).length;
    const avisoSusp = (nSusp && ['roe','mgL12'].includes(cmpSel.ind))
      ? ' ⚠ '+nSusp+' empresa'+(nSusp===1?'':'s')+' do filtro '+(nSusp===1?'ficou':'ficaram')+' fora porque um trimestre chegou fora de escala na CVM e contamina o acumulado de 12 meses (o aviso aparece no detalhe da empresa).'
      : '';
    noteEl2.textContent = 'Top 20 de '+rows.length+' empresas com o dado disponível (o "copiar dados" leva a lista completa). Clique numa barra para abrir a empresa. Fontes: Fundamentus (múltiplos, último fechamento) e CVM (12 meses).'+avisoFin+avisoSusp;
  } else {
    const emp = COS.find(c=>c.cvm===cmpSel.emp);
    if(!emp){ box.append(el('div','dim','escolha uma empresa no seletor acima')); return; }
    // Compara dentro do escopo escolhido: se o filtro está num segmento (ex.:
    // Eletrodomésticos), os pares são desse segmento — não do setor inteiro.
    const usaEscopo = !!escopoNorm(cmpSel.setor);
    const peers = usaEscopo ? escopo : COS.filter(c=>c.setor===emp.setor);
    const grupo = usaEscopo ? rotuloRecorte() : ('setor '+emp.setor);
    let rows = peers.map(c=>({label:c.name, v:getter(c), cvm:c.cvm, hl:c.cvm===emp.cvm})).filter(r=>r.v!=null && isFinite(r.v));
    rows.sort((a,b)=>b.v-a.v);
    const pos = rows.findIndex(r=>r.hl)+1;
    const mediana = med(rows.map(r=>r.v));
    const semDado = getter(emp)==null;
    let mostra = rows.slice(0,15);
    if(!mostra.some(r=>r.hl)){ const eu = rows.find(r=>r.hl); if(eu) mostra = mostra.slice(0,14).concat([eu]); }
    if(mediana!=null){
      const ins = mostra.findIndex(r=>r.v<mediana);
      const medRow = {label:'· mediana do grupo', v:+mediana.toFixed(2), med:true};
      if(ins<0) mostra.push(medRow); else mostra.splice(ins,0,medRow);
    }
    titulo.textContent = emp.name+' × '+grupo+' — '+label;
    // A empresa continua selecionada mesmo sem o indicador: mostra o aviso e o grupo,
    // em vez de trocar a empresa por baixo do usuário. O aviso vai ANTES do box no
    // card — hbarChart limpa o container, e dentro dele o aviso seria apagado.
    if(semDado)
      card.insertBefore(el('div','notice','⚠ '+emp.name+' não tem '+label+' disponível — o indicador não se aplica ao setor dela ou o dado não foi divulgado. O gráfico abaixo mostra o grupo; troque o indicador para ver a empresa.'), box);
    hbarChart(box, mostra, fmt, cvm=>openDetail(cvm));
    card.append(chartTools(() => box.querySelector('svg'),
      () => ({headers: ['Empresa', label], linhas: rows.map(r=>[r.label, r.v])}),
      () => emp.name+' vs '+grupo+' - '+label));
    noteEl2.textContent = emp.name+' é '+(pos>0? pos+'ª de '+rows.length : 'sem dado')+' em '+label+' em '+grupo
      + '. Barra laranja = empresa selecionada; barra clara = mediana do grupo. Clique numa barra para abrir a empresa.'
      + (usaEscopo ? ' O grupo segue o filtro escolhido — limpe o filtro para comparar com o setor inteiro.' : '');
  }
  m.append(el('div','foot','Comparações com os dados já carregados no painel (CVM 12 meses + Fundamentus no último fechamento). Uso informativo; não é recomendação de investimento.'));
}

// ---------- ticker (faixa de cotações) ----------
function tickerItems(){
  const c=MACRO.core||{}, fx=c.fx||{}, cg=c.cripto||{};
  const it=[];
  const ib = LIVEIDX.IBOV || MACRO.ibov;
  if(ib) it.push({l:'IBOVESPA', v:fmtc0.format(ib.pontos)+' pts', p:ib.varDia, st:LIVEIDX.IBOV?(ib.hora||''):brDate(ib.date).slice(0,5)});
  if(LIVEIDX.IFIX) it.push({l:'IFIX', v:fmtc0.format(LIVEIDX.IFIX.pontos)+' pts', p:LIVEIDX.IFIX.varDia});
  for(const [sym,l] of [['^GSPC','S&P 500'],['^IXIC','NASDAQ'],['^DJI','DOW JONES'],['^VIX','VIX'],['^TNX','TREASURY 10A']]){
    const q = getQ(sym); if(!q) continue;
    const v = sym==='^TNX' ? fmtc2.format(q.p)+'% a.a.' : (sym==='^VIX' ? fmtc2.format(q.p) : fmtc0.format(q.p)+' pts');
    it.push({l, v, p:sym==='^TNX'?null:q.pct});
  }

async function refreshLive(){

  const j=u=>tmo(fetch(u).then(r=>r.json()),8000);
  const sgs=id=>j('https://api.bcb.gov.br/dados/serie/bcdata.sgs.'+id+'/dados/ultimos/1?formato=json');

  const furl='https://olinda.bcb.gov.br/olinda/servico/Expectativas/versao/v1/odata/ExpectativasMercadoAnuais?%24format=json&%24select=Indicador,Data,DataReferencia,Mediana&%24filter='+ffilter+'&%24orderby=Data%20desc&%24top=400';
  const r=await Promise.allSettled([
    j('https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL,GBP-BRL,JPY-BRL,CNY-BRL,ARS-BRL,BTC-BRL'),
    j('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd,brl&include_24hr_change=true'),
    sgs(432), sgs(13522), sgs(4389), j(furl)
  ]);
  const c=MACRO.core=MACRO.core||{}; let any=false;
  if(r[0].status==='fulfilled'&&r[0].value&&r[0].value.USDBRL){ c.fx=c.fx||{}; for(const [k,v] of Object.entries(r[0].value)) c.fx[k]={bid:+v.bid,pct:+v.pctChange,ts:v.create_date,name:v.name}; any=true; }
  if(r[1].status==='fulfilled'&&r[1].value&&r[1].value.bitcoin){ c.cripto=r[1].value; any=true; }
  if(r[2].status==='fulfilled'&&r[2].value&&r[2].value[0]){ c.selic=r[2].value[0]; any=true; }
  if(r[3].status==='fulfilled'&&r[3].value&&r[3].value[0]){ c.ipca12=r[3].value[0]; any=true; }
  if(r[4].status==='fulfilled'&&r[4].value&&r[4].value[0]){ c.cdi=r[4].value[0]; any=true; }
  if(r[5].status==='fulfilled'&&r[5].value&&r[5].value.value&&r[5].value.value.length){
    const seen={}, rows=[];
    for(const x of r[5].value.value){ const k=x.Indicador+'|'+x.DataReferencia; if(!seen[k]){ seen[k]=1; rows.push({i:x.Indicador,ref:x.DataReferencia,med:x.Mediana,d:x.Data}); } }
    rows.sort((a,b)=>a.i.localeCompare(b.i)||String(a.ref).localeCompare(String(b.ref)));
    c.focus=rows; any=true;
  }
  if(any){
    LIVE.ok=true; LIVE.at=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    renderTicker();
    if(document.body.dataset.view==='macro') renderMacro();
    if(iovl.classList.contains('on') && modalKind==='info') openInfo(); // atualiza as datas do ⓘ (não mexe no ⚙)
  }
}

// ================= aviso de dado atrasado =================
// Robô que não roda é falha silenciosa: o painel continua no ar mostrando o dado
// da coleta anterior. Em setembro/2026 o branch "quotes" ficou 3 dias parado e
// nada na tela dizia isso. Aqui a própria página mede a idade do que carregou e
// avisa quando passa do prazo esperado de cada conjunto.
function emPregao(){
  try{
    const br = new Date(new Date().toLocaleString('en-US',{timeZone:'America/Sao_Paulo'}));
    const d = br.getDay(), h = br.getHours() + br.getMinutes()/60;
    return d>=1 && d<=5 && h>=10.25 && h<=18.25;
  }catch(e){ return false; }
}
// emPregao() só sabe de dia da semana e hora — não sabe de FERIADO. Em feriado de
// dia útil o robô corretamente não republica (o carimbo do próprio preço não
// avança) e a faixa vermelha passava o dia inteiro acusando o robô de estar
// parado. Em vez de manter uma lista de feriados que envelhece, perguntamos ao
// dado: a API da B3 devolve a data da ÚLTIMA SESSÃO junto do Ibovespa. Se essa
// data não é a de hoje, a bolsa não abriu hoje — e não há atraso a cobrar.
function bolsaAbriuHoje(){
  try{
    const ib = LIVEIDX.IBOV || MACRO.ibov;      // "dd/mm/aaaa" no feed da B3
    if(!ib || !ib.date) return null;            // sem informação: não afirma nada
    const p = String(ib.date).split(/[^\d]/).filter(Boolean);
    if(p.length < 3) return null;
    const dd = p[0].padStart(2,'0'), mm = p[1].padStart(2,'0');
    const aa = p[2].length === 2 ? '20'+p[2] : p[2];
    return (dd+'/'+mm+'/'+aa) === hojeSP();
  }catch(e){ return null; }
}
function idadeProblemas(){
  const out = [];
  const push = (nome, iso, limiteH, comoResolve) => {
    if(!iso) return;
    const h = horasDesde(String(iso).length<=10 ? iso+'T12:00:00Z' : iso);
    if(h==null || h <= limiteH) return;
    out.push({nome, h, limiteH, comoResolve});
  };
  push('painel gerado (CVM, múltiplos, valor de mercado)', META.buildAt || DB.updatedAt, 30);
  if(CANDLES && CANDLES.updatedAt) push('gráficos de preço (candles)', CANDLES.updatedAt, 40);
  if(NEWSD && NEWSD.updatedAt) push('notícias por empresa', NEWSD.updatedAt, 5);
  if(MACRO.noticiasAoVivoEm) push('manchetes gerais', MACRO.noticiasAoVivoEm, 5);
  // O arquivo do robô fica naturalmente parado fora do pregão E em feriado — e
  // `bolsaAbriuHoje() === false` é a prova, vinda do próprio feed da B3.
  if(emPregao() && bolsaAbriuHoje() !== false && QSNAP && QSNAP.updatedAt)
    push('cotações do robô (lista completa da B3 + EUA)', QSNAP.updatedAt, 1.5);
  return out;
}
// "não consegui LER" é diferente de "o robô não publicou", e a faixa dizia sempre a
// segunda coisa. Quando a leitura do arquivo falha no cliente (rede, proxy, cache),
// acusar o robô é acusar o inocente — e esconde o problema real, que é local.
function leituraFalhou(){
  const f = [];
  if(RELAY.erroEm && (!RELAY.at || RELAY.erroEm > RELAY.okEm)) f.push('cotações do robô');
  if(NEWSD && NEWSD.erroEm && !NEWSD.updatedAt) f.push('notícias por empresa');
  if(NEWSMAC === null && newsMacTentou) f.push('manchetes gerais');
  if(CANDLES_ERR && !CANDLES) f.push('gráficos de preço');
  return f;
}
function renderAvisoIdade(){
  const box = document.getElementById('idadeaviso'); if(!box) return;
  const p = idadeProblemas();
  const falhas = leituraFalhou();
  box.textContent = '';
  if(!p.length && !falhas.length) return;
  // abaixo de 3h o arredondamento inteiro fazia "2h (esperado até 2h)"
  const fmtH = h => h < 3 ? nbr2.format(+h.toFixed(1))+'h' : h < 48 ? Math.round(h)+'h' : Math.round(h/24)+' dias';
  if(falhas.length && !p.length){
    box.append(el('b',null,'⚠ Não consegui ler o dado agora — '));
    box.append(document.createTextNode(
      falhas.join(' · ') + '. A falha é na leitura aqui no navegador (rede, proxy ou cache), '
      + 'não na publicação: o robô pode ter publicado normalmente. O que está na tela é o que '
      + 'veio no carregamento.'));
  } else {
    box.append(el('b',null,'⚠ Dado atrasado — '));
    box.append(document.createTextNode(
      p.map(x => x.nome+': '+fmtH(x.h)+' (esperado até '+fmtH(x.limiteH)+')').join(' · ')
      + '. O que está na tela é a última coleta que deu certo, com a data acima.'
      + (falhas.length ? ' Também não consegui ler agora: ' + falhas.join(', ') + '.' : '')));
  }
  const b = el('button','btn','recarregar a página');
  b.onclick = () => location.reload();
  box.append(b);
  const a = el('a',null,'ver a data de cada conjunto');
  a.onclick = openInfo;
  a.style.cssText = 'color:var(--link);cursor:pointer;text-decoration:underline';
  box.append(a);
}

// Data do post mais novo dos fóruns (os itens trazem created_utc em segundos).
// Serve para o cartão dizer de quando é o conteúdo em vez de afirmar "na semana".
function redditMaisNovoUtc(){
  const r = MACRO.reddit || {};
  const todos = [...(r.news||[]), ...(r.disc||[])].map(x=>+x.utc).filter(u=>u>0);
  return todos.length ? Math.max(...todos) : null;
}
function redditIdadeDias(){
  const u = redditMaisNovoUtc();
  return u==null ? null : Math.floor((Date.now()/1000 - u)/86400);
}
function redditMaisNovoTxt(){
  const u = redditMaisNovoUtc();
  if(u==null) return '—';
  try{ return new Date(u*1000).toLocaleDateString('pt-BR',{timeZone:'America/Sao_Paulo',day:'2-digit',month:'2-digit',year:'numeric'}); }
  catch(e){ return '—'; }
}

// De quando são as manchetes que estão na tela: do arquivo ao vivo (robô de 2h em

function noticiaTxt(){

}

async function refreshFast(){

    jj('https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL,GBP-BRL,JPY-BRL,CNY-BRL,ARS-BRL,BTC-BRL'),
    jj('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd,brl&include_24hr_change=true')
  ]);
  const c = MACRO.core = MACRO.core || {}; let any = false;
  if(r[0].status==='fulfilled' && r[0].value && r[0].value.USDBRL){
    c.fx = c.fx || {};
    for(const [k,v] of Object.entries(r[0].value)) c.fx[k] = {bid:+v.bid, pct:+v.pctChange, ts:v.create_date, name:v.name};

  if(any){ LIVE.ok = true; LIVE.at = hhmm(); renderTicker(); if(document.body.dataset.view==='macro') renderMacro(); }
}

function abrePeerDaURL(){
  const p = peerFromHash();
  if(!p) return false;
  cmpSel.emps = p.cvms;
  cmpSel.peerNome = p.nome;
  cmpSel.modo = 'peer';

  // carregamento e sobrescrevia o que o usuário tivesse feito no Comparar desde
  // então — o link continua funcionando para quem o recebe, que é o objetivo.
  try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){}
  return true;
}

// A lista já está montada aqui. Espera dois frames para o navegador pintar antes
// do fade, senão o splash sai enquanto a tela ainda está em branco.
(function fechaBoot(){
  const b = document.getElementById('boot');
  if(!b) return;
  const fim = () => { b.classList.add('off'); setTimeout(() => b.remove(), 420); };
  // requestAnimationFrame não dispara em aba oculta — nesse caso fecha direto.
  if(document.hidden){ fim(); return; }
  requestAnimationFrame(() => requestAnimationFrame(fim));
  setTimeout(fim, 4000);   // rede de segurança: nunca deixa o splash preso
})();

// ---------- app instalável (PWA): service worker + convite de instalação ----------

let deferredPrompt = null;
const btnInstall = document.getElementById('installbtn');
addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e;
  if(btnInstall && !matchMedia('(display-mode: standalone)').matches) btnInstall.style.display = '';
});
if(btnInstall) btnInstall.onclick = async () => {
  if(deferredPrompt){
    deferredPrompt.prompt();
    const r = await deferredPrompt.userChoice.catch(()=>null);
    deferredPrompt = null;
    if(r && r.outcome === 'accepted') btnInstall.style.display = 'none';
    return;
  }
  // iPhone/iPad (Safari não expõe beforeinstallprompt) e demais casos: instrução
  modalKind = 'info';
  ibox.textContent = '';
  const x = el('button','btn x2','✕ fechar'); x.onclick = closeInfo; ibox.append(x);
  ibox.append(el('h2',null,'Instalar o Painel B3 como aplicativo'));
  const ps = [
    ['Android (Chrome)','toque no menu ⋮ e escolha "Instalar aplicativo" ou "Adicionar à tela inicial".'],
    ['iPhone / iPad (Safari)','toque no botão Compartilhar e escolha "Adicionar à Tela de Início".'],
    ['Computador (Chrome/Edge)','clique no ícone de instalar na barra de endereço, ou menu ⋮ → "Instalar Painel B3".'],
    ['Depois de instalado','o painel abre em janela própria, com ícone na tela inicial, e continua abrindo offline com os últimos dados carregados (as cotações precisam de internet).'],
  ];
  for(const [b,t] of ps){ const p = el('p'); p.append(el('b',null,b+' — '), document.createTextNode(t)); ibox.append(p); }
  iovl.classList.add('on');
};
addEventListener('appinstalled', () => { if(btnInstall) btnInstall.style.display = 'none'; });
if(matchMedia('(display-mode: standalone)').matches && btnInstall) btnInstall.style.display = 'none';
// O botão nascia escondido e só aparecia no evento beforeinstallprompt, que o
// Safari (iPhone/iPad) nunca dispara — então a instrução de instalação manual que
// existe no próprio handler ficava inalcançável justamente em quem mais precisa
// dela. Agora, fora do modo aplicativo e sem o evento, o botão aparece de todo
// jeito depois de um instante e leva às instruções por plataforma.
setTimeout(() => {
  if(!btnInstall || deferredPrompt) return;
  if(matchMedia('(display-mode: standalone)').matches) return;
  if(window.navigator.standalone === true) return;   // iOS já instalado
  btnInstall.style.display = '';
}, 1500);
