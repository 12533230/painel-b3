      box.append(tools);
      if(res.length > PEER_MAX)
        box.append(el('div','dim','O peer set leva as '+PEER_MAX+' primeiras (ordenado por '+(cols[0]||CMP_INDS[0])[1]+').'));
    }
    noteEl2.textContent = 'Empresas sem o dado de algum filtro ficam fora do resultado — o screener não presume valor ausente. '
      + 'Múltiplos (P/L, P/VP, EV/EBITDA, DY) vêm do Fundamentus no último fechamento; ROIC, margens e alavancagem são calculados dos 12 meses da CVM. Os filtros ficam salvos neste navegador.';

  } else if(cmpSel.modo==='peer'){
    // ---------- PEER SET: tabela empresas × indicadores + estatísticas ----------
    const nome = cmpSel.peerNome || 'Peer set';
    titulo.textContent = nome + ' — ' + cmpSel.emps.length + ' empresa' + (cmpSel.emps.length===1?'':'s');
    const cands = COS.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'','pt-BR'));
    const addBar = el('div','cmpbar'); addBar.style.margin='0 0 10px';
    addBar.append(mkSel([['','+ adicionar empresa…'], ...cands.filter(c=>!cmpSel.emps.includes(c.cvm)).map(c=>[c.cvm,c.name])],
      '', v => { if(v && cmpSel.emps.length<PEER_MAX) cmpSel.emps.push(v); }, 'Adicionar empresa ao peer set'));
    box.append(addBar);
    // chips para remover
    if(cmpSel.emps.length){
      const chips = el('div','badges'); chips.style.marginBottom='10px';
      for(const cv of cmpSel.emps){
        const c2 = COS.find(x=>x.cvm===cv); if(!c2) continue;
        const b = el('span','badge', c2.name+' ');
        const x = el('button','rmv','✕');
        x.onclick = () => { cmpSel.emps = cmpSel.emps.filter(z=>z!==cv); lsSet('cmp_sel', cmpSel); renderCmp(); };
        b.append(x); chips.append(b);
      }
      box.append(chips);
    }
    const membros = cmpSel.emps.map(cv=>COS.find(c=>c.cvm===cv)).filter(Boolean);
    if(!membros.length){
      box.append(el('div','dim','Monte o peer set adicionando empresas acima, ou rode o screener e clique em "usar como peer set".'));
    } else {
      const cols = ['roic','roe','mgE12','evebitda','pl','pvp','dlEbitda','rev12','mktCap']
        .map(k=>CMP_INDS.find(x=>x[0]===k)).filter(Boolean);
      // setor dominante do peer set → mediana setorial de referência
      const cont = {}; for(const c of membros) cont[c.setor]=(cont[c.setor]||0)+1;
      const setorDom = Object.entries(cont).sort((a,b)=>b[1]-a[1])[0][0];
      const peersSetor = COS.filter(c=>c.setor===setorDom);
      const medSet = {}, medPeer = {};
      for(const k of cols){
        medPeer[k[0]] = med(membros.map(c=>k[2](c)).filter(v=>v!=null && isFinite(v)));
        medSet[k[0]]  = med(peersSetor.map(c=>k[2](c)).filter(v=>v!=null && isFinite(v)));
      }
      const headers = ['Empresa', ...cols.map(k=>k[1])];
      const w = el('div','qtblwrap'); const t = el('table','qtbl');
      const hr = el('tr'); for(const h of headers) hr.append(el('th',null,h));
      const th = el('thead'); th.append(hr); t.append(th);
      const tb = el('tbody');
      for(const c of membros){
        const tr = el('tr'); tr.style.cursor='pointer'; tr.onclick = () => openDetail(c.cvm);
        tr.append(el('td',null,c.name));
        for(const k of cols){
          const v = k[2](c);
          const td = el('td',null, k[3](v));
          const mp = medPeer[k[0]];
          if(v!=null && mp!=null && isFinite(v)){
            // negrito quando está acima da mediana do próprio peer set
            if(v > mp) td.style.fontWeight = '600';
          }
          tr.append(td);
        }
        tb.append(tr);
      }
      const trP = el('tr'); trP.style.background='var(--wash)';
      trP.append(el('td',null,'mediana do peer set'));
      for(const k of cols) trP.append(el('td',null, k[3](medPeer[k[0]])));
      tb.append(trP);
      const trS = el('tr'); trS.style.background='var(--wash)';
      trS.append(el('td',null,'mediana do setor '+setorDom));
      for(const k of cols) trS.append(el('td',null, k[3](medSet[k[0]])));
      tb.append(trS);
      t.append(tb); w.append(t); box.append(w);
      const linhas = [
        ...membros.map(c => [c.name, ...cols.map(k=>k[2](c))]),
        ['mediana do peer set', ...cols.map(k=>medPeer[k[0]])],
        ['mediana do setor '+setorDom, ...cols.map(k=>medSet[k[0]])],
      ];
      const bCopy2 = el('button','btn','⧉ copiar tabela (Excel)');
      bCopy2.onclick = () => copiaTSV(headers, linhas, bCopy2);
      const tb2 = el('div'); tb2.style.cssText='display:flex;gap:8px;margin:8px 0 0;flex-wrap:wrap';
      tb2.append(bCopy2); card.append(tb2);
      noteEl2.textContent = 'Negrito = acima da mediana do próprio peer set. A mediana setorial usa o setor com mais empresas no conjunto ('
        + setorDom + ', ' + peersSetor.length + ' empresas listadas). Clique numa linha para abrir a empresa. '
        + 'Salve o conjunto e copie o link para abrir a mesma comparação em outro computador.';
    }

  } else if(cmpSel.modo==='op'){
    let lista = (OPIDX[cmpSel.opind] || []).filter(x => !cmpSel.setor || x.setor===cmpSel.setor);
    // dentro da família, compara só o grupo de unidade dominante (% com %, R$ com R$…)
    let omitidos = [];
    if(lista.length > 1){
      const cont = {};
      for(const x of lista) cont[x.uc] = (cont[x.uc]||0)+1;
      const ucDom = Object.entries(cont).sort((a,b)=>b[1]-a[1])[0][0];
      omitidos = lista.filter(x => x.uc !== ucDom);
      lista = lista.filter(x => x.uc === ucDom);
    }
    titulo.textContent = cmpSel.opind ? ('KPI operacional — '+cmpSel.opind) : 'KPIs operacionais';
    if(!lista.length){
      box.append(el('div','dim', OPD ? 'nenhuma empresa curada tem este KPI neste filtro' : 'carregando KPIs…'));
      noteEl2.textContent = 'Aparecem aqui os KPIs divulgados por 2 ou mais empresas curadas. Peça "cura o setor X" para ampliar a cobertura.';
    } else {
      const un = lista[0].unidade || '';
      const unsDiferentes = new Set(lista.map(x=>x.unidade||'')).size > 1;
      const fmtOp = v => nbr2.format(v)+(un && un.length<12 && !unsDiferentes ? ' '+un : '');
      const rows = lista.map(x => { const p = ultimoPeriodo(x.valores);
        return {label: x.empresa+' ('+p+')', v: x.valores[p], cvm: x.cvm}; })
        .filter(r => typeof r.v === 'number' && isFinite(r.v))
        .sort((a,b)=>b.v-a.v);
      hbarChart(box, rows, fmtOp, cvm=>openDetail(cvm));
      card.append(chartTools(() => box.querySelector('svg'),
        () => ({headers:['Empresa','Período',cmpSel.opind+(un?' ('+un+')':'')],
                linhas: lista.map(x => { const p = ultimoPeriodo(x.valores); return [x.empresa, p, x.valores[p]]; })}),
        () => 'KPI '+cmpSel.opind));
      // histórico do KPI entre as empresas (quando houver 2+ períodos)
      const series = lista.map(x => ({label:x.empresa,
        rows: Object.keys(x.valores).sort().map(p => ({p, v: x.valores[p]}))})).filter(s=>s.rows.length>1);
      if(series.length){
        const h = el('div'); h.style.marginTop='14px';
        card.append(el('div','ct','Evolução do KPI'), h);
        multiLineChart(h, series.slice(0,4), fmtOp);
      }
      noteEl2.textContent = 'Comparação pelo último período divulgado por cada empresa (o período vai no rótulo). '
        + 'Unidade: '+(un||'ver release')+'. '
        + (omitidos.length ? 'Fora do gráfico por reportarem em outra unidade: '
            + omitidos.map(x=>x.empresa+' ('+(x.unidade||'sem unidade')+')').join(', ')+'. ' : '')
        + (unsDiferentes ? '⚠ Definições podem variar entre empresas: '
            + lista.map(x=>x.empresa+' = "'+(x.nomeOriginal||'')+'"').join(' · ')+'. ' : '')
        + 'Fonte: releases das próprias empresas, curadoria verificada.';
    }
  } else if(cmpSel.modo==='hist'){
    const [hk, hlabel, hfmt] = HIST_INDS.find(x=>x[0]===cmpSel.hind);
    titulo.textContent = 'Histórico — '+hlabel;
    // chips das empresas escolhidas
    const chips = el('div','badges'); chips.style.marginBottom = '8px';
    for(const cv of cmpSel.emps){
      const c2 = COS.find(x=>x.cvm===cv); if(!c2) continue;
      const b = el('span','badge', c2.name+' ');
      const x = el('button','rmv','✕');
      x.onclick = () => { cmpSel.emps = cmpSel.emps.filter(z=>z!==cv); lsSet('cmp_sel', cmpSel); renderCmp(); };
      b.append(x); chips.append(b);
    }
    card.insertBefore(chips, box);
    if(!cmpSel.emps.length){
      box.append(el('div','dim','adicione até 4 empresas no seletor acima para comparar o histórico'));
    } else {
      const series = cmpSel.emps.map(cv => {
        const c2 = COS.find(x=>x.cvm===cv);
        const s = c2 && indSeries(c2, hk);
        return {label: c2? c2.name : cv, rows: (s && s.rows) || []};
      });
      multiLineChart(box, series, hfmt);
      const perAll = [...new Set(series.flatMap(s=>s.rows.filter(r=>r.v!=null).map(r=>r.p)))].sort();
      const linhas = perAll.map(p => [p, ...series.map(s => { const r = s.rows.find(x=>x.p===p); return r? r.v : null; })]);
      card.append(chartTools(() => box.querySelector('svg'),
        () => ({headers: ['Período', ...series.map(s=>s.label)], linhas}),
        () => 'Histórico '+hlabel));
      card.append(tabelaValores(['Período', ...series.map(s=>s.label)],
        linhas.map(l => [l[0], ...l.slice(1).map(v => v==null?null:hfmt(v))])));

      // ---- estatísticas da série: CAGR (quando faz sentido), média, extremos ----
      const podeCagr = CAGR_OK.has(hk);
      const sts = series.map(s => ({label: s.label, e: estat(s.rows, podeCagr)})).filter(x=>x.e);
      if(sts.length){
        const medianaSetor = (() => {
          // mediana do último valor do indicador no setor das empresas escolhidas
          const setores = [...new Set(cmpSel.emps.map(cv => (COS.find(c=>c.cvm===cv)||{}).setor).filter(Boolean))];
          if(setores.length !== 1) return null;   // só faz sentido com peers do mesmo setor
          const vals = COS.filter(c=>c.setor===setores[0]).map(c => {
            const s2 = indSeries(c, hk); if(!s2 || !s2.rows) return null;
            const ok = s2.rows.filter(r=>r.v!=null); return ok.length? ok[ok.length-1].v : null;
          }).filter(v=>v!=null && isFinite(v));
          return vals.length>=3 ? {setor: setores[0], v: med(vals), n: vals.length} : null;
        })();
        const heads = ['Empresa','Período','Último','Média', ...(podeCagr?['CAGR a.a.']:[]), 'Variação no período','Mínimo','Máximo'];
        const lns = sts.map(x => {
          const e = x.e;
          return [x.label,
            e.ini.p+' → '+e.fim.p,
            hfmt(e.fim.v),
            hfmt(+e.media.toFixed(2)),
            ...(podeCagr ? [e.cagr==null? '—' : fmtPct(+e.cagr.toFixed(1))] : []),
            e.varTotal==null? '—' : fmtPct(+e.varTotal.toFixed(1)),
            hfmt(e.min), hfmt(e.max)];
        });
        if(medianaSetor)
          lns.push(['mediana do setor '+medianaSetor.setor, '(último dado)', hfmt(+medianaSetor.v.toFixed(2)), '—',
                    ...(podeCagr?['—']:[]), '—','—','—']);
        card.append(el('div','ct','Estatísticas do período'));
        card.append(tabelaValores(heads, lns));
        const bStat = el('button','btn','⧉ copiar estatísticas (Excel)');
        bStat.onclick = () => copiaTSV(heads, lns, bStat);
        const wrapS = el('div'); wrapS.style.cssText='display:flex;gap:8px;margin:8px 0 0;flex-wrap:wrap';
        wrapS.append(bStat); card.append(wrapS);
      }
    }
    noteEl2.textContent = 'Séries trimestrais da CVM (12m móveis onde indicado). '
      + (CAGR_OK.has(hk)
          ? 'CAGR calculado entre o primeiro e o último trimestre da série, anualizado — só aparece com 1 ano ou mais e valores positivos nas duas pontas. '
          : 'CAGR não se aplica a percentual ou múltiplo, por isso a coluna não aparece neste indicador. ')
      + 'A mediana setorial só entra quando todas as empresas escolhidas são do mesmo setor. '
      + 'Sua seleção fica salva neste navegador. Copie os dados para o Excel ou baixe o gráfico em PNG para usar em slides.';
  } else if(cmpSel.modo==='rank'){
    let rows = escopo.map(c=>({label:c.name, v:getter(c), cvm:c.cvm})).filter(r=>r.v!=null && isFinite(r.v));
    rows.sort((a,b)=>cmpSel.dir==='asc'? a.v-b.v : b.v-a.v);
    titulo.textContent = (cmpSel.dir==='asc'?'Menores':'Maiores')+' — '+label+(cmpSel.setor?' · '+cmpSel.setor:' · todos os setores');
    const mostra20 = rows.slice(0,20);
    hbarChart(box, mostra20, fmt, cvm=>openDetail(cvm));
    card.append(chartTools(() => box.querySelector('svg'),
      () => ({headers: ['Empresa', label], linhas: rows.map(r=>[r.label, r.v])}),
      () => 'Ranking '+label+(cmpSel.setor?' - '+cmpSel.setor:'')));
    noteEl2.textContent = 'Top 20 de '+rows.length+' empresas com o dado disponível (o "copiar dados" leva a lista completa). Clique numa barra para abrir a empresa. Fontes: Fundamentus (múltiplos, último fechamento) e CVM (12 meses).';
  } else {
    const emp = COS.find(c=>c.cvm===cmpSel.emp);
    if(!emp){ box.append(el('div','dim','nenhuma empresa com esse indicador neste filtro')); return; }
    const peers = COS.filter(c=>c.setor===emp.setor);
    let rows = peers.map(c=>({label:c.name, v:getter(c), cvm:c.cvm, hl:c.cvm===emp.cvm})).filter(r=>r.v!=null && isFinite(r.v));
    rows.sort((a,b)=>b.v-a.v);
    const pos = rows.findIndex(r=>r.hl)+1;
    const mediana = med(rows.map(r=>r.v));
    let mostra = rows.slice(0,15);
    if(!mostra.some(r=>r.hl)){ const eu = rows.find(r=>r.hl); if(eu) mostra = mostra.slice(0,14).concat([eu]); }
    if(mediana!=null){
      const ins = mostra.findIndex(r=>r.v<mediana);
      const medRow = {label:'· mediana do setor', v:+mediana.toFixed(2), med:true};
      if(ins<0) mostra.push(medRow); else mostra.splice(ins,0,medRow);
    }
    titulo.textContent = emp.name+' × setor '+emp.setor+' — '+label;
    hbarChart(box, mostra, fmt, cvm=>openDetail(cvm));
    card.append(chartTools(() => box.querySelector('svg'),
      () => ({headers: ['Empresa', label], linhas: rows.map(r=>[r.label, r.v])}),
      () => emp.name+' vs setor - '+label));
    noteEl2.textContent = emp.name+' é '+(pos>0? pos+'ª de '+rows.length : 'sem dado')+' em '+label+' no setor '+emp.setor+'. Barra laranja = empresa selecionada; barra clara = mediana do setor. Clique numa barra para abrir a empresa.';
  }
  m.append(el('div','foot','Comparações com os dados já carregados no painel (CVM 12 meses + Fundamentus no último fechamento). Uso informativo; não é recomendação de investimento.'));
}

// ---- view ETFs (B3) ----
function etfChip(){
  // "● ao vivo" só quando os ETFs listados de fato têm cotação fresca da B3 (não basta o IBOV ter respondido)
  const anyLive = Object.values(etfLists()).some(arr => arr.some(e => freshQ(LIVEB3[e.t])));
  return el('span','livechip', anyLive
    ? '● B3 ao vivo às '+B3LIVE.at+' — feed público com ~15 min de defasagem'
    : (QSNAP.updatedAt ? '◷ snapshot do robô de '+relayLocal()+' — abrindo com internet atualiza sozinho' : '◷ aguardando cotações…'));
}
function renderETF(){
  const m = $('#etfview'); m.textContent = '';
  m.append(noticeEl());
  const st = el('div'); st.style.margin = '4px 0 10px'; st.append(etfChip()); m.append(st);
  for(const [cat, arr] of Object.entries(etfLists())){
    m.append(el('h3','sect', cat+' ('+arr.length+')'));
    const w = el('div','qtblwrap'); const t = el('table','qtbl');
    const hd = el('tr');
    for(const h of ['Ticker','Nome','Cotação','Var. dia','Abertura','Mín · Máx do dia','Negócios','Atualizado','']) hd.append(el('th',null,h));
    const th = el('thead'); th.append(hd); t.append(th);
    const tb = el('tbody');
    for(const e of arr){
      const tk = e.t, q = getQ(tk), L = freshQ(LIVEB3[tk]) ? LIVEB3[tk] : null;
      const tr = el('tr');
      tr.append(el('td',null,tk));
      const nm = e.n || qName(tk) || '—';
      tr.append(el('td',null,nm));
      tr.append(el('td', q?'':'dim', q ? fmtPrice(q.p) : '—'));
      tr.append(el('td', !q||q.pct==null?'dim':(q.pct<0?'neg':'pos'), q?fmtSign(q.pct):'—'));
      tr.append(el('td', L?'':'dim', L&&L.open!=null ? fmtPrice(L.open) : '—'));
      tr.append(el('td', L?'':'dim', L&&L.min!=null ? fmtPrice(L.min)+' · '+fmtPrice(L.max) : '—'));
      tr.append(el('td', L?'':'dim', L&&L.qty!=null ? fmtc0.format(L.qty) : '—'));
      tr.append(el('td','dim', qHora(q) || '—'));
      const tdx = el('td');
      if(cat === 'Meus ETFs'){
        const x = el('button','rmv','✕'); x.title = 'remover da minha lista';
        x.onclick = (ev) => { ev.stopPropagation(); lsSet('meus_etfs', meusEtfs().filter(z=>z!==tk)); renderETF(); };
        tdx.append(x);
      }
      tr.append(tdx);
      tr.classList.add('cndl'); tr.title = 'clique para ver o gráfico de candles';
      tr.onclick = () => openChart(tk, (nm && nm!=='—' ? nm+' · ' : '')+tk);
      tb.append(tr);
    }
    t.append(tb); w.append(t); m.append(w);
  }
  const add = el('button','btn','➕ acompanhar outro ETF da B3');
  add.style.marginTop = '12px';
  add.onclick = () => {
    const v = (prompt('Ticker do ETF na B3 (ex.: BOVA11):')||'').trim().toUpperCase();
    if(!/^[A-Z0-9]{5,7}$/.test(v)) return;
    const mine = meusEtfs(); if(!mine.includes(v)) mine.push(v);
    lsSet('meus_etfs', mine); renderETF(); refreshB3();
  };
  m.append(add);
  m.append(el('div','note','Cotações direto da API pública da B3 (a mesma do site de cotações da bolsa; defasagem ~15 min do pregão), atualizadas a cada 60 s com a página aberta. "Negócios" = contagem informada pela B3 na sessão. A lista padrão vem de data/watchlists.json no repositório; a lista "Meus ETFs" fica só neste navegador.'));
  m.append(el('div','foot','Insignia Partners · painel interno. Nada aqui é recomendação de investimento; verifique taxa, tributação e liquidez de cada fundo nos documentos oficiais do gestor e da B3.'));
}

function renderEUA(){
  const m = $('#euaview'); m.textContent = '';
  m.append(noticeEl());
  const st = el('div'); st.style.margin = '4px 0 10px'; st.append(euaChip()); m.append(st);
  m.append(el('h3','sect','Índices'));
  const t1 = el('div','tiles');
  for(const e of (WL.us_indices || [])){
    const q = getQ(e.t); if(!q){ t1.append(statTile(e.n, '—', e.t)); continue; }
    const val = e.t==='^TNX' ? fmtc2.format(q.p)+'%' : (e.t==='^VIX' ? fmtc2.format(q.p) : fmtc0.format(q.p)+' pts');
    let dtxt = fmtSign(q.pct)+' no dia';
    if(e.t==='^TNX' && q.pct!=null){ // juros: variação em pontos-base, não %
      const bps = (q.p - q.p/(1+q.pct/100))*100;
      dtxt = (bps>0?'+':'')+fmtc2.format(bps)+' bps no dia';
    }

// ---------- atualização ao vivo (APIs com CORS aberto) ----------
async function refreshLive(){
  const tmo=(p,ms)=>Promise.race([p,new Promise((_,rj)=>setTimeout(()=>rj(new Error('timeout')),ms))]);
  const j=u=>tmo(fetch(u).then(r=>r.json()),8000);
  const sgs=id=>j('https://api.bcb.gov.br/dados/serie/bcdata.sgs.'+id+'/dados/ultimos/1?formato=json');
  const dmin=new Date(Date.now()-12*864e5).toISOString().slice(0,10);
  const ffilter=encodeURIComponent("Data gt '"+dmin+"' and (Indicador eq 'IPCA' or Indicador eq 'Selic' or Indicador eq 'PIB Total' or Indicador eq 'Câmbio' or Indicador eq 'IGP-M')");
  const furl='https://olinda.bcb.gov.br/olinda/servico/Expectativas/versao/v1/odata/ExpectativasMercadoAnuais?%24format=json&%24select=Indicador,Data,DataReferencia,Mediana&%24filter='+ffilter+'&%24orderby=Data%20desc&%24top=400';
  const r=await Promise.allSettled([
    j('https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL,GBP-BRL,JPY-BRL,CNY-BRL,ARS-BRL,BTC-BRL'),
    j('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd,brl&include_24hr_change=true'),
    sgs(432), sgs(13522), sgs(4389), j(furl)
  ]);
  const c=MACRO.core=MACRO.core||{}; let any=false;
  if(r[0].status==='fulfilled'&&r[0].value&&r[0].value.USDBRL){ c.fx=c.fx||{}; for(const [k,v] of Object.entries(r[0].value)) c.fx[k]={bid:+v.bid,pct:+v.pctChange,ts:v.create_date,name:v.name}; any=true; }
  if(r[1].status==='fulfilled'&&r[1].value&&r[1].value.bitcoin){ c.cripto=r[1].value; any=true; }
  if(r[2].status==='fulfilled'&&r[2].value&&r[2].value[0]){ c.selic=r[2].value[0]; any=true; }
  if(r[3].status==='fulfilled'&&r[3].value&&r[3].value[0]){ c.ipca12=r[3].value[0]; any=true; }
  if(r[4].status==='fulfilled'&&r[4].value&&r[4].value[0]){ c.cdi=r[4].value[0]; any=true; }
  if(r[5].status==='fulfilled'&&r[5].value&&r[5].value.value&&r[5].value.value.length){
    const seen={}, rows=[];
    for(const x of r[5].value.value){ const k=x.Indicador+'|'+x.DataReferencia; if(!seen[k]){ seen[k]=1; rows.push({i:x.Indicador,ref:x.DataReferencia,med:x.Mediana,d:x.Data}); } }
    rows.sort((a,b)=>a.i.localeCompare(b.i)||String(a.ref).localeCompare(String(b.ref)));
    c.focus=rows; any=true;
  }
  if(any){
    LIVE.ok=true; LIVE.at=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    renderTicker();
    if(document.body.dataset.view==='macro') renderMacro();
    if(iovl.classList.contains('on') && modalKind==='info') openInfo(); // atualiza as datas do ⓘ (não mexe no ⚙)
  }
}

function renderFresh(container){

  t.append(b); w.append(t); container.append(w);
}

// ---------- câmbio e cripto a cada 60 s (mais rápido que o ciclo completo de 5 min) ----------
async function refreshFast(){
  if(document.hidden) return;
  const r = await Promise.allSettled([
    jj('https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL,GBP-BRL,JPY-BRL,CNY-BRL,ARS-BRL,BTC-BRL'),
    jj('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd,brl&include_24hr_change=true')
  ]);
  const c = MACRO.core = MACRO.core || {}; let any = false;
  if(r[0].status==='fulfilled' && r[0].value && r[0].value.USDBRL){
    c.fx = c.fx || {};
    for(const [k,v] of Object.entries(r[0].value)) c.fx[k] = {bid:+v.bid, pct:+v.pctChange, ts:v.create_date, name:v.name};
    any = true;
  }
  if(r[1].status==='fulfilled' && r[1].value && r[1].value.bitcoin){ c.cripto = r[1].value; any = true; }
  if(any){ LIVE.ok = true; LIVE.at = hhmm(); renderTicker(); if(document.body.dataset.view==='macro') renderMacro(); }
}

// ---------- sai da tela de carregamento ----------
// A lista já está montada aqui. Espera dois frames para o navegador pintar antes
// do fade, senão o splash sai enquanto a tela ainda está em branco.
(function fechaBoot(){
  const b = document.getElementById('boot');
  if(!b) return;
  const fim = () => { b.classList.add('off'); setTimeout(() => b.remove(), 420); };
  // requestAnimationFrame não dispara em aba oculta — nesse caso fecha direto.
  if(document.hidden){ fim(); return; }
  requestAnimationFrame(() => requestAnimationFrame(fim));
  setTimeout(fim, 4000);   // rede de segurança: nunca deixa o splash preso
})();

// ---------- app instalável (PWA): service worker + convite de instalação ----------
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
let deferredPrompt = null;
const btnInstall = document.getElementById('installbtn');
addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e;
  if(btnInstall && !matchMedia('(display-mode: standalone)').matches) btnInstall.style.display = '';
});
if(btnInstall) btnInstall.onclick = async () => {
  if(deferredPrompt){
    deferredPrompt.prompt();
    const r = await deferredPrompt.userChoice.catch(()=>null);
    deferredPrompt = null;
    if(r && r.outcome === 'accepted') btnInstall.style.display = 'none';
    return;
  }
  // iPhone/iPad (Safari não expõe beforeinstallprompt) e demais casos: instrução
  modalKind = 'info';
  ibox.textContent = '';
  const x = el('button','btn x2','✕ fechar'); x.onclick = closeInfo; ibox.append(x);
  ibox.append(el('h2',null,'Instalar o Painel B3 como aplicativo'));
  const ps = [
    ['Android (Chrome)','toque no menu ⋮ e escolha "Instalar aplicativo" ou "Adicionar à tela inicial".'],
    ['iPhone / iPad (Safari)','toque no botão Compartilhar e escolha "Adicionar à Tela de Início".'],
    ['Computador (Chrome/Edge)','clique no ícone de instalar na barra de endereço, ou menu ⋮ → "Instalar Painel B3".'],
    ['Depois de instalado','o painel abre em janela própria, com ícone na tela inicial, e continua abrindo offline com os últimos dados carregados (as cotações precisam de internet).'],
  ];
  for(const [b,t] of ps){ const p = el('p'); p.append(el('b',null,b+' — '), document.createTextNode(t)); ibox.append(p); }
  iovl.classList.add('on');
};
