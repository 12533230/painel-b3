<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insignia Partners · Painel B3</title>
<link rel="icon" type="image/png" href="data:image/png;base64,__FAVICON__">
<link rel="manifest" href="app/manifest.json" id="pwa-manifest">
<meta name="theme-color" content="#0c2a2d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Painel B3">
<link rel="apple-touch-icon" href="app/icon-192.png">
<style>
  /* Identidade visual Insignia Partners — paleta do Manual de Marca + tema PPT v4 */
  :root{
    color-scheme: light;
    --page:#f5fcf8; --surface:#ffffff; --ink:#0c2a2d; --ink2:#18494e; --muted:#5e8271;
    --grid:#dfeae2; --axis:#a2b9af; --border:rgba(12,42,45,.13);
    --s1:#18494e; --s2:#dcb604; --s3:#4f47ad;
    --good:#3e6b52; --bad:#92442f; --wash:rgba(99,136,118,.10);
    --link:#18494e; --brandbar:#0c2a2d; --brandink:#f5fcf8;
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --page:#091e20; --surface:#133a3e; --ink:#fafffc; --ink2:#a2b9af; --muted:#8ba79a;
    --grid:#1d575e; --axis:#2b5c60; --border:rgba(245,252,248,.14);
    --s1:#5ba7b6; --s2:#dcb604; --s3:#817adb;
    --good:#b8c666; --bad:#bd7e6f; --wash:rgba(139,167,154,.13);
    --link:#8dc8d4; --brandbar:#0c2a2d; --brandink:#f5fcf8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--page);color:var(--ink);font:13.5px/1.45 Tahoma,Verdana,"Segoe UI",system-ui,sans-serif}
  a{color:inherit}
  .hdr{position:sticky;top:0;z-index:30}
  .top{background:var(--brandbar);border-bottom:1px solid rgba(245,252,248,.12);padding:10px 18px;display:flex;gap:14px;align-items:center;flex-wrap:nowrap;min-width:0}
  /* ---- faixa de cotações (ticker) ---- */
  .ticker{background:var(--brandbar);border-bottom:3px solid #638876;overflow:hidden;cursor:default}
  .tk-track{display:inline-flex;align-items:baseline;gap:36px;padding:6px 0 7px;white-space:nowrap;animation:tkmove 60s linear infinite;will-change:transform}
  .ticker:hover .tk-track{animation-play-state:paused}
  @keyframes tkmove{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @media (prefers-reduced-motion: reduce){.tk-track{animation:none}}
  .tk{display:inline-flex;gap:7px;align-items:baseline;font-size:12.5px}
  .tk .l{color:rgba(245,252,248,.60);font-size:10.5px;letter-spacing:.05em;font-weight:600}
  .tk .v{color:#f5fcf8;font-weight:700;font-variant-numeric:tabular-nums}
  .tk .up{color:#cbdd7f;font-weight:600;font-size:11.5px}
  .tk .dn{color:#e9a08c;font-weight:600;font-size:11.5px}
  .tk .st{color:rgba(245,252,248,.45);font-size:10.5px}
  .nav{display:flex;border:1px solid rgba(245,252,248,.28);border-radius:8px;overflow:hidden;flex-shrink:0}
  .nav button{border:none;background:transparent;color:rgba(245,252,248,.72);padding:7px 12px;cursor:pointer;font:inherit;font-weight:700;white-space:nowrap}
  .nav button.on{background:rgba(245,252,248,.16);color:#fff}
  .top .src{flex-shrink:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .top h1{white-space:nowrap}
  @media(max-width:1100px){.top .src{display:none}}
  @media(max-width:760px){.top h1{display:none}.top .div{display:none}}
  .top .logo{height:20px;display:block}
  .top .div{width:1px;height:24px;background:rgba(245,252,248,.25)}
  .top h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.01em;color:var(--brandink)}
  .top .src{color:rgba(245,252,248,.62);font-size:11.5px}
  .top .sp{flex:1}
  .search{position:relative}
  .search input{width:300px;max-width:60vw;padding:7px 12px;border:1px solid rgba(245,252,248,.28);border-radius:8px;background:rgba(245,252,248,.10);color:#f5fcf8;font:inherit;outline:none}
  .search input::placeholder{color:rgba(245,252,248,.55)}
  .search input:focus{border-color:#cbdd7f;background:rgba(245,252,248,.16)}
  .sugg{position:absolute;top:38px;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:320px;overflow:auto;display:none;z-index:40}
  .sugg div{padding:8px 12px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
  .sugg div:hover{background:var(--wash)}
  .sugg .tk{color:var(--muted);font-size:12px}
  .btn{border:1px solid var(--border);background:var(--surface);color:var(--ink2);border-radius:8px;padding:7px 11px;cursor:pointer;font:inherit}
  .btn:hover{border-color:#638876;color:var(--ink)}
  .top .btn{background:rgba(245,252,248,.10);border-color:rgba(245,252,248,.28);color:#f5fcf8;white-space:nowrap;flex-shrink:0}
  .top .search{flex-shrink:0}
  .top .btn:hover{border-color:#cbdd7f;color:#fff}
  .wrap{display:grid;grid-template-columns:270px 1fr;gap:0;min-height:calc(100vh - 90px)}
  @media(max-width:900px){.wrap{grid-template-columns:1fr}.side{display:none}}
  .side{border-right:1px solid var(--grid);padding:14px 10px 40px;overflow-y:auto;max-height:calc(100vh - 92px);position:sticky;top:92px}
  body[data-view="macro"] .wrap,body[data-view="etf"] .wrap,body[data-view="eua"] .wrap,body[data-view="cmp"] .wrap{display:none}
  #macroview,#etfview,#euaview,#cmpview{display:none;padding:16px 18px 60px;max-width:1280px;margin:0 auto}
  body[data-view="macro"] #macroview{display:block}
  body[data-view="etf"] #etfview{display:block}
  body[data-view="eua"] #euaview{display:block}
  body[data-view="cmp"] #cmpview{display:block}
  .cmpbar{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 12px}
  .cmpbar select{padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;max-width:100%}
  .rmv{border:none;background:transparent;color:var(--bad);cursor:pointer;font:inherit;font-size:12px;padding:0 4px}
  .cndl{cursor:pointer}
  .qtbl tbody tr.cndl:hover{background:var(--wash)}
  .badge.on{background:var(--wash);border-color:var(--muted);color:var(--ink);font-weight:700}
  /* ---- mobile ---- */
  .mobsec{display:none;margin:0 0 10px}
  .mobsec select{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
  @media(max-width:1360px){ /* janelas médias: a busca desce para a 2ª linha do cabeçalho */
    .top{flex-wrap:wrap;row-gap:8px}
    .search{flex:1 1 100%}
    .search input{width:100%;max-width:none}
    .sugg{top:42px}
  }
  @media(max-width:900px){
    .mobsec{display:block}
    .hdr{position:static}
    .top{padding:8px 10px}
    .top h1{display:none}.top .div{display:none}
    .search input{font-size:16px} /* <16px dispara zoom no iOS */
    .mobsec select{font-size:16px}
  }
  @media(max-width:760px){
    .nav button{padding:6px 8px;font-size:12px}
    .top .btn{padding:6px 8px;font-size:12px}
    .main{padding:10px 10px 60px}
    #macroview,#etfview,#euaview{padding:10px 10px 60px}
    .tiles{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
    .tile .v{font-size:17px}
    .ph{padding:10px 12px}
    .pb{padding:12px 12px 50px}
    .m-grid{gap:8px}
  }
  .cfgrow{display:flex;gap:10px;align-items:center;margin:10px 0;flex-wrap:wrap}
  .cfgrow label{min-width:150px;font-weight:600;font-size:12.5px;color:var(--ink2)}
  .cfgrow input{flex:1;min-width:220px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
  .m-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  @media(max-width:980px){.m-grid{grid-template-columns:1fr}}
  .agrow>b,.agrow>span:not(.agdate):not(.agtag):not(.agsuper):not(.agdays){min-width:0;flex:1 1 auto;overflow-wrap:anywhere}
  @media(max-width:640px){
    /* sem isto a linha da agenda empurrava a aba Brasil & Macro para rolar na
       horizontal, e o "em N dias" saía da tela */
    .agrow{flex-wrap:wrap}
    .agdate{min-width:auto}
    .agdays{flex-basis:100%;margin-left:0}
  }
  .agrow{display:flex;gap:12px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--grid)}
  .agrow:last-child{border-bottom:none}
  .agdate{min-width:96px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums;font-size:12.5px}
  .agtag{font-size:10.5px;border:1px solid var(--border);border-radius:999px;padding:2px 8px;color:var(--ink2);flex-shrink:0}
  .agsuper{font-size:10.5px;border-radius:999px;padding:2px 8px;background:rgba(220,182,4,.18);color:var(--ink2);font-weight:700;flex-shrink:0}
  .agnext{background:var(--wash);border-radius:10px}
  .agdays{margin-left:auto;color:var(--muted);font-size:11.5px;white-space:nowrap}
  .newsit{padding:9px 10px;border-bottom:1px solid var(--grid)}
  .newsit:last-child{border-bottom:none}
  .newsit a{color:var(--ink);text-decoration:none;font-weight:600;font-size:13px}
  .newsit a:hover{color:var(--link);text-decoration:underline}
  .newsmeta{color:var(--muted);font-size:11.5px;margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .ncchip{display:inline-block;background:var(--wash);color:var(--ink2);border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700}
  .livechip{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;background:var(--wash);color:var(--ink2)}
  /* ---- disclaimer & frescor dos dados ---- */
  .notice{background:var(--wash);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--ink2);margin:0 0 12px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  /* faixa de "dado atrasado": só existe quando algum conjunto passou do prazo */
  #idadeaviso:empty{display:none}
  #idadeaviso{margin:10px 14px 0;background:var(--wash);border:1px solid var(--bad);border-left:4px solid var(--bad);
    border-radius:10px;padding:9px 12px;font-size:12px;color:var(--ink);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .notice b{color:var(--ink)}
  .notice a{color:var(--link);cursor:pointer;font-weight:700;text-decoration:none;white-space:nowrap}
  .notice a:hover{text-decoration:underline}
  .iovl{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 14px}
  .iovl.on{display:flex}
  .ibox{background:var(--page);border:1px solid var(--border);border-radius:14px;max-width:1020px;width:100%;padding:18px 20px 20px;box-shadow:0 18px 60px rgba(0,0,0,.3);position:relative}
  .ibox h2{margin:0 0 4px;font-size:17px}
  .ibox .x2{position:absolute;top:12px;right:14px}
  .ibox p{font-size:12.5px;color:var(--ink2);line-height:1.55;margin:10px 0}
  .ibox p b{color:var(--ink)}
  .fresh td:first-child{font-weight:600;color:var(--ink)}
  .fresh .live{color:var(--good);font-weight:700}
  .side .all{font-weight:650;padding:7px 10px;border-radius:8px;cursor:pointer}
  .side .all:hover,.side .sec>span:hover,.side .sub>span:hover,.side .seg:hover{background:var(--wash)}
  .side .sec>span,.side .sub>span,.side .seg{display:flex;justify-content:space-between;gap:6px;padding:6px 10px;border-radius:8px;cursor:pointer}
  .side .sec{margin-top:2px}
  .side .sec>span{font-weight:600}
  .side .sub{margin-left:10px}
  .side .sub>span{color:var(--ink2)}
  .side .seg{margin-left:22px;color:var(--ink2);font-size:13px}
  .side .n{color:var(--muted);font-size:12px}
  .side .on{background:var(--wash);color:var(--ink)}
  .side .kids{display:none}
  .side .open>.kids{display:block}
  .main{padding:16px 18px 60px;min-width:0}
  .crumb{color:var(--muted);font-size:12.5px;margin:2px 0 10px}
  .crumb b{color:var(--ink2);font-weight:600}
  .crumb a{cursor:pointer;text-decoration:none}
  .crumb a:hover{color:var(--link);text-decoration:underline}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
  .tile .l{color:var(--muted);font-size:12px}
  .tile .v{font-size:20px;font-weight:650;margin-top:2px}
  .tile .d{font-size:12px;color:var(--muted)}
  table.list{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .listwrap{border-radius:12px;overflow:auto;border:1px solid var(--border)}
  .listwrap table{border:none;min-width:860px}
  table.list th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:right;padding:9px 10px;border-bottom:1px solid var(--grid);cursor:pointer;user-select:none;white-space:nowrap;background:var(--surface);position:sticky;top:0}
  table.list th:first-child{text-align:left}
  table.list td{padding:8px 10px;border-bottom:1px solid var(--grid);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  table.list td:first-child{text-align:left;white-space:normal}
  table.list tr:last-child td{border-bottom:none}
  table.list tbody tr{cursor:pointer}
  table.list tbody tr:hover{background:var(--wash)}
  .nm{font-weight:600}
  .nm .tks{color:var(--muted);font-weight:400;font-size:12px}
  .seglbl{color:var(--muted);font-size:12px}
  .neg{color:var(--bad)} .pos{color:var(--good)}
  .dim{color:var(--muted)}
  /* -------- painel de detalhe -------- */
  .ovl{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:none}
  .ovl.on{display:block}
  .panel{position:fixed;top:0;right:0;bottom:0;width:min(920px,96vw);background:var(--page);z-index:60;transform:translateX(102%);transition:transform .18s ease;overflow-y:auto;border-left:1px solid var(--grid);box-shadow:-12px 0 40px rgba(0,0,0,.18)}
  .panel.on{transform:none}
  .ph{position:sticky;top:0;background:var(--page);border-bottom:1px solid var(--grid);padding:14px 20px;z-index:5}
  .ph .row1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .ph h2{margin:0;font-size:19px;letter-spacing:-.01em}
  .ph .path{color:var(--muted);font-size:12.5px;margin-top:3px}
  .ph .x{position:absolute;top:12px;right:14px}
  .pb{padding:16px 20px 50px}
  .links{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
  .links a{font-size:12.5px;color:var(--link);text-decoration:none;border:1px solid var(--border);padding:5px 10px;border-radius:999px;background:var(--surface);font-weight:600}
  .links a:hover{border-color:#638876;background:var(--wash)}
  .badges{display:flex;gap:6px;flex-wrap:wrap}
  .badge{font-size:11.5px;color:var(--ink2);border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:3px 9px}
  h3.sect{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 8px;font-weight:650}
  .charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px}
  .card .ct{font-size:12.5px;color:var(--ink2);font-weight:600;margin-bottom:6px}
  .qtbl{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;font-size:13px}
  .qtblwrap{border-radius:12px;overflow:auto;border:1px solid var(--border)}
  .qtblwrap table{border:none;min-width:620px}
  .qtbl th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:7px 9px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap}
  .qtbl th:first-child{text-align:left}
  .qtbl td{padding:6px 9px;border-bottom:1px solid var(--grid);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .qtbl td:first-child{text-align:left;color:var(--ink2)}
  .qtbl tr:last-child td{border-bottom:none}
  .note{color:var(--muted);font-size:11.5px;margin-top:8px}
  .tip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.15);padding:7px 10px;font-size:12.5px;z-index:99;display:none}
  .tip b{font-size:13px}
  .tip .k{color:var(--muted)}
  svg text{font:11px system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--muted)}
  svg .val{fill:var(--ink2);font-weight:600}
  .foot{color:var(--muted);font-size:12px;margin-top:26px;border-top:1px solid var(--grid);padding-top:10px}
  .empty{color:var(--muted);padding:30px;text-align:center}

  /* ---- tela de carregamento (identidade do painel) ----
     Cobre o intervalo entre o primeiro pixel e o painel montado. Fica no topo do
     <body> e usa só CSS, para aparecer antes de qualquer script rodar. */
  #boot{position:fixed;inset:0;z-index:9999;background:#0c2a2d;display:flex;
        flex-direction:column;align-items:center;justify-content:center;gap:26px;
        transition:opacity .34s ease}
  #boot.off{opacity:0;pointer-events:none}
  #boot .bl{width:min(66vw,340px);max-width:340px;height:auto;opacity:0;
            animation:blIn .55s ease .05s forwards}
  @keyframes blIn{to{opacity:1}}
  /* candles que sobem em sequência, como o ícone do app */
  #boot .cd{display:flex;align-items:flex-end;gap:9px;height:54px}
  #boot .cd i{display:block;width:9px;border-radius:2px;background:#cbdd7f;
              transform-origin:bottom;animation:cdUp 1.5s ease-in-out infinite}
  #boot .cd i:nth-child(2){background:#dcb604;height:16px;animation-delay:.11s}
  #boot .cd i:nth-child(1){height:22px}
  #boot .cd i:nth-child(3){height:31px;animation-delay:.22s}
  #boot .cd i:nth-child(4){background:#dcb604;height:26px;animation-delay:.33s}
  #boot .cd i:nth-child(5){height:42px;animation-delay:.44s}
  #boot .cd i:nth-child(6){background:#dcb604;height:36px;animation-delay:.55s}
  #boot .cd i:nth-child(7){height:54px;animation-delay:.66s}
  @keyframes cdUp{0%,100%{transform:scaleY(.45);opacity:.45}45%{transform:scaleY(1);opacity:1}}
  #boot .bt{color:#8ba79a;font:500 12.5px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;
            letter-spacing:.09em;text-transform:uppercase}
  @media (prefers-reduced-motion:reduce){
    #boot .cd i{animation:none;transform:none;opacity:.9}
    #boot .bl{animation:none;opacity:1}
  }

  /* ================= ficha A4 (impressão / PDF) =================
     O consultor precisa levar a empresa para dentro de um deck ou de um memo. As
     plataformas pagas chamam isso de tearsheet; nenhuma das gratuitas entrega.
     Em vez de montar uma segunda tela (que envelheceria em paralelo com a
     primeira e acabaria contradizendo-a), a ficha é o PRÓPRIO painel de detalhe
     reformatado para papel: mesmo dado, mesmas guardas, mesma data.
     O navegador gera o PDF; não há dependência externa. */
  /* "?" do glossário: discreto ao lado do rótulo, sem competir com o número */
  .glo{border:1px solid var(--border);background:transparent;color:var(--muted);
       border-radius:50%;width:15px;height:15px;line-height:1;font-size:10px;
       cursor:pointer;padding:0;margin-left:5px;vertical-align:middle;flex-shrink:0}
  .glo:hover{border-color:var(--muted);color:var(--ink)}
  .globox{position:fixed;z-index:120;max-width:min(420px,92vw);background:var(--surface);
          border:1px solid var(--border);border-radius:10px;padding:12px 14px;
          box-shadow:0 10px 34px rgba(0,0,0,.22);font-size:12.5px;line-height:1.5}
  .globox b{display:block;margin-bottom:6px;font-size:13.5px}
  .globox .gl{color:var(--ink2);margin-bottom:5px}
  .globox .btn{margin-top:6px}
  .sinais{display:grid;grid-template-columns:1fr;gap:2px;margin-top:6px}
  .sinal{display:flex;align-items:baseline;gap:8px;padding:5px 8px;border-radius:6px;font-size:12.5px}
  .sinal.ok{background:rgba(62,107,82,.10)} .sinal.nao{background:rgba(146,68,47,.10)}
  .sinal .ic{width:14px;flex-shrink:0;font-weight:700}
  .sinal.ok .ic{color:var(--good)} .sinal.nao .ic{color:var(--bad)}

  textarea.notas{width:100%;box-sizing:border-box;margin-top:6px;padding:8px 10px;border:1px solid var(--border);
    border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:13px;resize:vertical}
  textarea.notas:focus{outline:none;border-color:var(--muted)}
  @media(max-width:640px){ textarea.notas{font-size:16px} }
  .cconta{color:var(--muted);font-size:10.5px;font-variant-numeric:tabular-nums}
  .kbd{display:inline-block;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;
       padding:1px 7px;font:600 12px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--wash)}
  /* modo apresentação: o que é ferramenta sai, o que é resultado cresce */
  body.apres .cmpbar,body.apres .side,body.apres .search,body.apres #idadeaviso,
  body.apres .charttools,body.apres .note,body.apres .foot{display:none !important}
  body.apres{font-size:15.5px}
  body.apres .tile .v{font-size:26px}

  body.apres .wrap{grid-template-columns:1fr}
  .printonly{display:none}
  @media print{
    @page{size:A4 portrait;margin:12mm 10mm 14mm}
    /* cores de verdade no papel: sem isto o navegador imprime tudo em cinza e as
       barras dos gráficos perdem o significado */
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    html,body{background:#fff !important}
    :root{--page:#fff;--surface:#fff}
    /* fora do papel: navegação, faixas, overlays e tudo que é interação */
    .hdr,.ticker,#idadeaviso,.wrap,#macroview,#etfview,#euaview,#cmpview,
    .ovl,.iovl,#boot,.tip,.sugg,.cmpbar,.charttools,.btn,button,select,input{display:none !important}
    /* o painel de detalhe vira o documento */
    .panel{position:static !important;transform:none !important;width:100% !important;
           max-width:none !important;box-shadow:none !important;border:0 !important;
           overflow:visible !important;background:#fff !important}
    .ph{position:static !important;padding:0 0 8px !important;border-bottom:2px solid #0c2a2d !important}
    .pb{padding:0 !important}
    .printonly{display:block}
    .printhdr{display:flex;align-items:center;gap:10px;margin:0 0 10px;padding:0 0 8px;
              border-bottom:1px solid #999}
    .printhdr img{height:16px}
    .printhdr .t{font-weight:700;font-size:13px}
    .printhdr .d{margin-left:auto;font-size:10.5px;color:#555}
    .printfoot{margin-top:10px;padding-top:6px;border-top:1px solid #ccc;
               font-size:9.5px;color:#444;line-height:1.45}
    /* quebras: uma seção não começa no fim da página nem racha ao meio */
    h3.sect{break-before:auto;break-after:avoid;page-break-after:avoid;margin-top:12px}
    .card,.tile,.qtblwrap,table{break-inside:avoid;page-break-inside:avoid}
    .charts{display:grid !important;grid-template-columns:1fr 1fr !important;gap:8px !important}
    .tiles{display:grid !important;grid-template-columns:repeat(4,1fr) !important;gap:6px !important}
    .tile{border:1px solid #ddd !important;padding:6px !important}
    .tile .v{font-size:14px !important}
    body{font-size:10.5px}
    .qtbl th,.qtbl td{padding:3px 5px !important;font-size:9.5px !important}
    a{text-decoration:none;color:#000 !important}
    /* o endereço do link vira texto: no papel, "↗" sem destino não serve de nada */
    .links a::after{content:" (" attr(href) ")";font-size:8.5px;color:#666;word-break:break-all}
    .notice{border:1px solid #999 !important;background:#f4f4f4 !important}
  }
</style>

<script>
"use strict";
const DB = JSON.parse(document.getElementById('dados').textContent);
const COS = DB.companies;
// Preferências do usuário no navegador. Ficam aqui, antes de tudo, porque o tema
// é lido já na primeira linha de render — declarados mais abaixo com `const`,
// cairiam na zona morta temporal e o painel abriria com erro.
const lsGet = k => { try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } };
const lsSet = (k,v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
// Chave de API é gravada como texto puro (não JSON). Em navegador com
// armazenamento bloqueado, localStorage.getItem LANÇA — e a exceção acontecia
// dentro de refreshB3, DEPOIS de já ter preenchido os índices e ANTES de
// afterQuotes(), matando o ciclo de 60 s inteiro.
const lsStr = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsStrSet = (k,v) => { try{ if(v) localStorage.setItem(k,v); else localStorage.removeItem(k); }catch(e){} };
// O painel guarda toda preferência do usuário (chaves ao vivo, período do gráfico,
// peer sets, estado do Comparar) — menos o tema, que voltava ao do sistema a cada
// visita. Agora persiste, e enquanto NÃO houver escolha salva o painel continua
// seguindo o sistema, inclusive quando ele muda com a página aberta.
let themeDark = (() => {
  const salvo = lsGet('tema');
  if(salvo === true || salvo === false) return salvo;
  return !!(matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
})();
function applyTheme(){
  document.documentElement.setAttribute('data-theme', themeDark ? 'dark' : 'light');
  const b = document.getElementById('theme');
  if(b){ b.setAttribute('aria-pressed', themeDark ? 'true' : 'false');
         b.title = themeDark ? 'Tema escuro — clique para o claro' : 'Tema claro — clique para o escuro'; }
}
applyTheme();
document.getElementById('theme').onclick = () => {
  themeDark = !themeDark; lsSet('tema', themeDark);
  applyTheme(); renderAll(); if(openCvm) openDetail(openCvm);
};
if(matchMedia && matchMedia('(prefers-color-scheme: dark)').addEventListener){
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ev => {
    if(lsGet('tema') !== null && lsGet('tema') !== undefined) return;  // escolha do usuário manda
    themeDark = ev.matches; applyTheme(); renderAll(); if(openCvm) openDetail(openCvm);
  });
}

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if(cls) e.className = cls; if(txt != null) e.textContent = txt; return e; };
const norm = s => (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const nbr = new Intl.NumberFormat('pt-BR', {maximumFractionDigits:1});
const nbr2 = new Intl.NumberFormat('pt-BR', {maximumFractionDigits:2});
function fmtMi(v){ // v em R$ milhões
  if(v==null) return '—';
  const a = Math.abs(v);
  if(a >= 1e6) return 'R$ ' + nbr.format(v/1e6) + ' tri';
  if(a >= 1e3) return 'R$ ' + nbr.format(v/1e3) + ' bi';
  return 'R$ ' + nbr.format(v) + ' mi';
}
function fmtNum(v){ if(v==null) return '—'; const a=Math.abs(v); if(a>=1e6) return nbr.format(v/1e6)+' tri'; if(a>=1e3) return nbr.format(v/1e3)+' bi'; return nbr.format(v)+' mi'; }
const fmtX = v => v==null ? '—' : nbr.format(v).replace(/ /g,'') + 'x';
const fmtPct = v => v==null ? '—' : nbr.format(v) + '%';
const nbrP = new Intl.NumberFormat('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
const fmtPrice = v => v==null ? '—' : 'R$ ' + nbrP.format(v);
function cls(v){ return v==null ? 'dim' : (v<0 ? 'neg' : ''); }
// Endereço vindo de arquivo externo (news.json, news_macro.json) só entra na página
// se for http/https. Estava definido dentro de openDetail e por isso valia apenas
// para as notícias por empresa: as manchetes, os fóruns e os cards de veículo da
// aba Brasil & Macro montavam o link sem filtro nenhum. Agora é um só, no escopo
// do módulo, usado em todos os pontos que consomem link de fora.
function safeU(u){
  try{ const x = new URL(u); return ['https:','http:'].includes(x.protocol) ? x.href : null; }
  catch(e){ return null; }
}
function med(arr){ const a = arr.filter(x=>x!=null).sort((x,y)=>x-y); if(!a.length) return null; const m = a.length>>1; return a.length%2 ? a[m] : (a[m-1]+a[m])/2; }
function mainTicker(c){ let best=null, bl=-1; for(const t of c.tickers){ const l=t.liq2m||0; if(l>bl){bl=l;best=t;} } return best; }
// Um trimestre pode chegar da CVM inconsistente e contaminar os 12 meses. Caso
// medido nesta base: EQTL PARA com lucro de R$ 18,1 bi em 2025T4, contra ~R$ 390
// mi nos outros trimestres, e patrimônio líquido que passa de 5.073 para 5.179
// no mesmo período — lucro dessa ordem não pode deixar o patrimônio parado. O
// resultado era "ROE 366,8%" no topo do ranking. Regra (só com evidência interna):
// se UM trimestre responde por mais de 80% do lucro absoluto dos 12 meses E é
// maior que todo o patrimônio da empresa, a série está inconsistente e os
// indicadores que dependem do lucro somado não são publicados.
function niSuspeito(c){
  if(c._niSusp !== undefined) return c._niSusp;
  c._niSusp = false; c._niSuspQ = null;
  const q = (c.q||[]).filter(x => x.ni != null);
  if(q.length >= 4){
    const ult = q.slice(-4);
    const soma = ult.reduce((a,x)=>a+Math.abs(x.ni),0);
    let pior = null;
    for(const x of ult) if(!pior || Math.abs(x.ni) > Math.abs(pior.ni)) pior = x;
    if(soma && pior && Math.abs(pior.ni)/soma > 0.8){
      // O teste que decide: resultado dessa ordem tem de aparecer no patrimônio
      // líquido do trimestre. Prejuízo de R$ 620 mi com o PL caindo exatamente
      // R$ 620 mi é dado consistente, ainda que concentrado num trimestre (era o
      // caso de AZEVEDO, B100, HAGA e ALLIAR, que esta regra deixa em paz). O que
      // não fecha é a EQTL PARA: +R$ 18,1 bi com o PL subindo R$ 105 mi.
      // Só marca quando o resultado é GRANDE demais para o que o patrimônio
      // confirma — patrimônio que cai mais que o prejuízo (dividendo, redução de
      // capital) não é sinal de dado errado, e valor pequeno não vale o aviso.
      const dpl = deltaPl(c, pior.p);
      const ni = Math.abs(pior.ni);
      if(dpl != null && ni >= 50 && ni > 2*Math.abs(dpl) + 50){
        c._niSusp = true; c._niSuspQ = {p: pior.p, ni: pior.ni, dpl};
      }
    }
  }
  return c._niSusp;
}
// variação do PL no trimestre p, lida do histórico de balanço (bh)
function deltaPl(c, p){
  const bh = c.bh || [];
  if(!bh.length || !p) return null;
  const alvo = p.slice(0,4)+'-'+QE_MAP[p.slice(5)];
  const i = bh.findIndex(b => b.dt === alvo);
  if(i <= 0) return null;
  const a = bh[i-1], b = bh[i];
  if(!a || !b || a.pl == null || b.pl == null) return null;
  return +(b.pl - a.pl).toFixed(1);
}
const ni12De = c => niSuspeito(c) ? null : (c.ind ? c.ind.ni12 : null);

// ROE com patrimônio líquido negativo é armadilha aritmética: prejuízo ÷ PL
// negativo devolve ROE POSITIVO. Medido nesta base: 42 empresas com PL ≤ 0, e 32
// delas exibiam ROE positivo — a PORTOBELLO aparecia com "ROE 306,6%" tendo
// perdido R$ 318,6 mi no ano, e ficava no topo do ranking de maior ROE. Sem PL
// positivo o indicador não existe, então não se exibe número.
// Patrimônio de R$ 0,2 mi transforma qualquer resultado em percentual absurdo:
// a SUDESTE S/A publicava ROE de −43.150% e sozinha destruía a média do setor.
const PISO_PL = 20;   // R$ milhões
function roeDe(c){
  // patrimônio que virou de negativo para positivo dentro da janela: o
  // denominador não existiu durante o período do numerador
  if(plVirou(c)) return null;
  const pl = (c.bal||{}).pl;
  if(pl != null && pl < PISO_PL) return null;
  if(niSuspeito(c)) return null;
  const t = mainTicker(c);
  return c.ind.roe != null ? c.ind.roe : (t ? t.roe : null);
}
// Alavancagem exige EBITDA positivo: com EBITDA negativo a razão fica NEGATIVA e
// passa por "empresa sem dívida" no filtro. São 42 empresas com EBITDA ≤ 0, 26
// delas exibindo alavancagem negativa (AERIS: R$ 1,9 bi de dívida, EBITDA −402,
// aparecia como −4,81).
function dlEbitdaDe(c){
  const e = c.ind.ebitda12, r = c.ind.rev12;
  if(e == null || e <= 0) return null;
  // EBITDA de 0,34% da receita (MELHOR SP: R$ 0,6 mi) produzia "alavancagem
  // 316,5x". Denominador nessa ordem é ruído, não capacidade de pagamento.
  if(r != null && r > 0 && e < 0.02*r) return null;
  return c.ind.dlEbitda != null ? c.ind.dlEbitda : null;
}
// PATRIMÔNIO QUE VIROU DE SINAL DENTRO DA JANELA.
// A HAGA S/A fechou 2026T2 com lucro de R$ 83,7 mi (os outros nove trimestres
// ficam entre −1,1 e +1,1) e o patrimônio líquido saiu de −48,2 para +35,5 no
// MESMO trimestre — variação de exatamente 83,7. Ou seja: o resultado não foi
// retorno sobre um patrimônio, foi o evento que CRIOU o patrimônio (renegociação
// de dívida ou reavaliação). Dividir um pelo outro dá "ROE 238%", que encabeçava
// o ranking. A guarda do niSuspeito não pega este caso — e não deve: ela existe
// para achar dado INCOERENTE, e aqui o dado é coerente. O problema é outro: não
// havia patrimônio durante o período que o numerador cobre.
// Medido na base de 10/09/2026: 2 empresas (HAGA 238% e INFRACOMM −237,7%).
function plVirou(c){
  if(c._plVirou !== undefined) return c._plVirou;
  const bh = (c.bh || []).filter(b => b.pl != null);
  let r = null;
  if(bh.length >= 5){
    const ini = bh[bh.length - 5], fim = bh[bh.length - 1];
    if(ini.pl <= 0 && fim.pl > 0) r = {de: ini.pl, para: fim.pl, dt: ini.dt};
  }
  c._plVirou = r;
  return r;
}
// P/L com a mesma guarda do tile: trimestre inconsistente contamina o lucro de 12
// meses, e P/L calculado sobre lucro contaminado é número errado.
function plDe(c){
  if(niSuspeito(c)) return null;
  const t = mainTicker(c);
  return t && t.pl != null ? t.pl : null;
}
// Motivo em UMA frase, reutilizado em tile, célula da tabela e title — para o "—"
// nunca aparecer sem explicação, e a explicação ser a mesma em toda a tela.
function motivoSemRoe(c){
  const pl = (c.bal || {}).pl;
  const vir = plVirou(c);
  if(vir) return 'o patrimônio líquido saiu de ' + fmtMi(vir.de) + ' para ' + fmtMi(vir.para)
    + ' dentro dos 12 meses — o resultado do período criou o patrimônio em vez de render sobre ele';
  if(niSuspeito(c)) return 'trimestre inconsistente na CVM — lucro de 12 meses não publicado';
  if(pl != null && pl <= 0) return 'patrimônio líquido negativo — ROE não se aplica';
  if(pl != null && pl < PISO_PL) return 'patrimônio líquido abaixo de R$ '+PISO_PL+' mi — o percentual não teria significado';
  return 'sem lucro de 12 meses ou sem patrimônio líquido na base';
}
function motivoSemAlavancagem(c){
  const e = c.ind.ebitda12, r = c.ind.rev12;
  if(c.fin) return 'banco/seguradora — dívida líquida e EBITDA não se aplicam';
  if(e == null) return 'sem EBITDA de 12 meses na base';
  if(e <= 0) return 'EBITDA negativo — a razão não se aplica';
  if(r != null && r > 0 && e < 0.02*r) return 'EBITDA abaixo de 2% da receita — a razão não se sustenta';
  return 'sem dívida líquida na base';
}

// ---------- estado ----------
let selSetor=null, selSub=null, selSeg=null, sortKey='mktCap', sortDir=-1, openCvm=null;

// ---------- árvore de setores ----------
function buildTree(){
  const side = $('#side'); side.textContent='';
  const all = el('div','all'); all.append(el('span',null,'Todos os setores'), el('span','n', String(COS.length)));
  all.style.display='flex'; all.style.justifyContent='space-between';
  all.onclick = () => { selSetor=selSub=selSeg=null; renderAll(); };
  side.append(all);
  const tree = {};
  for(const c of COS){
    tree[c.setor] = tree[c.setor] || {n:0, subs:{}};
    tree[c.setor].n++;
    const su = tree[c.setor].subs[c.subsetor] = tree[c.setor].subs[c.subsetor] || {n:0, segs:{}};
    su.n++; su.segs[c.segmento] = (su.segs[c.segmento]||0)+1;
  }
  for(const [setor, s] of Object.entries(tree).sort()){
    const sec = el('div','sec');
    const head = el('span'); head.append(el('span',null,setor), el('span','n',String(s.n)));
    if(selSetor===setor && !selSub) head.classList.add('on');
    head.onclick = () => { selSetor = setor; selSub=selSeg=null; sec.classList.toggle('open', true); renderAll(); };
    const kids = el('div','kids');
    if(selSetor===setor) sec.classList.add('open');
    for(const [sub, su] of Object.entries(s.subs).sort()){
      const subd = el('div','sub');
      const sh = el('span'); sh.append(el('span',null,sub), el('span','n',String(su.n)));
      if(selSub===sub && !selSeg) sh.classList.add('on');
      sh.onclick = (e) => { e.stopPropagation(); selSetor=setor; selSub=sub; selSeg=null; subd.classList.add('open'); renderAll(); };
      const skids = el('div','kids');
      if(selSub===sub) subd.classList.add('open');
      const segs = Object.entries(su.segs).sort();
      if(segs.length>1 || segs[0][0]!==sub){
        for(const [seg, n] of segs){
          const sg = el('div','seg'); sg.append(el('span',null,seg), el('span','n',String(n)));
          if(selSeg===seg && selSub===sub) sg.classList.add('on');
          sg.onclick = (e) => { e.stopPropagation(); selSetor=setor; selSub=sub; selSeg=seg; renderAll(); };
          skids.append(sg);
        }
      }
      subd.append(sh, skids); kids.append(subd);
    }
    sec.append(head, kids); side.append(sec);
  }
}

// ---------- filtro ----------
function filtered(){
  return COS.filter(c =>
    (!selSetor || c.setor===selSetor) &&
    (!selSub || c.subsetor===selSub) &&
    (!selSeg || c.segmento===selSeg));
}

// ---------- tiles agregados ----------
function renderTiles(list){
  const t = $('#tiles'); t.textContent='';
  const mk = list.map(c=>c.ind.mktCap).filter(Boolean);
  // O ano era fixo ("2026") no código e no rótulo: em janeiro/2027 o tile passaria
  // a contar zero e a dizer "Com resultado 2026" para sempre. Agora o ano vem do
  // trimestre mais recente que EXISTE na base.
  const anoBase = String(Math.max(...list.flatMap(c => (c.q||[]).map(q => +String(q.p).slice(0,4)))
                                       .filter(n => n > 2000), 0)) || '';
  const triAno = anoBase ? list.filter(c=>c.q.some(q=>String(q.p).startsWith(anoBase))).length : 0;
  // Um tile por EMPRESA, não por ticker: com todos os tickers, ON e PN da mesma
  // empresa entravam duas vezes na mediana. E EV/EBITDA de banco/seguradora sai
  // fora, como já sai na lista e no detalhe.
  const um = list.map(mainTicker).filter(Boolean);

// ---------- busca ----------
const qin = $('#q'), sugg = $('#sugg');
// A busca do topo aceita duas coisas: nome/ticker de empresa (abre o detalhe) e
// perguntas com critério ("varejo com ROIC acima de 15"), que caem no screener.
// Sem isso a busca por critério ficava escondida dentro de Comparar → Screener.
// Aplica a consulta: com valor vira filtro (screener); sem valor vira ranking.
function abreConsulta(consulta){
  const r = buscaInterpreta(consulta);
  if(!r || !r.intencao) return false;
  // KPI + empresa: o dado vive no detalhe da empresa (curadoria dos releases)
  if(r.intencao === 'kpiEmpresa'){
    sugg.style.display='none'; qin.value='';
    openDetail(r.empresa.cvm);
    // rola até a tabela de indicadores operacionais quando ela terminar de montar
    let tentativas = 0;
    const rolar = () => {
      const h3 = [...document.querySelectorAll('#panel h3')].find(e=>/Indicadores operacionais|Segmentos —/i.test(e.textContent));
      if(h3){ h3.scrollIntoView({block:'start', behavior:'smooth'}); return; }
      if(++tentativas < 20) setTimeout(rolar, 200);
    };
    setTimeout(rolar, 250);
    return true;
  }
  // KPI sem empresa: compara o indicador entre as empresas que o divulgam
  if(r.intencao === 'kpi'){
    cmpSel.modo = 'op';
    cmpSel.opind = r.kpi;
    cmpSel.setor = r.escopo || '';
    cmpSel.busca = consulta;
    cmpSel.filtros = []; cmpSel.setFiltros = [];   // não deixa filtro da busca anterior de pé
    cmpSel.buscaLida = {escopo:r.escopo, n:0, naoEntendi:r.naoEntendi, intencao:'kpi', avisoGrupo:r.avisoGrupo||''};
    lsSet('cmp_sel', cmpSel);
    sugg.style.display='none'; qin.value='';
    setView('cmp');
    $('#cmpview').scrollIntoView({block:'start'});
    return true;
  }
  cmpSel.busca = consulta;
  // Busca nova define o escopo por completo: sem setor na frase, o filtro anterior
  // e limpo — senao o resultado sairia restrito a algo que o usuario nao pediu.
  cmpSel.setor = r.escopo || '';
  if(r.intencao === 'setores'){
    // comparar os grupos entre si (setor / subsetor / segmento)
    cmpSel.modo = 'set';
    cmpSel.ind = r.ind; cmpSel.dir = r.dir;
    cmpSel.setNivel = r.nivel || 'set';
    if(r.setStat) cmpSel.setStat = r.setStat;
    cmpSel.setFiltros = r.setFiltros || [];
    cmpSel.filtros = [];
  } else if(r.intencao === 'scr'){
    cmpSel.modo = 'scr';
    cmpSel.filtros = r.filtros;
    cmpSel.setFiltros = [];
  } else {
    cmpSel.modo = 'rank';
    cmpSel.ind = r.ind;
    cmpSel.dir = r.dir;
    cmpSel.setFiltros = [];
    cmpSel.filtros = [];      // senão o filtro da busca anterior fica no Screener
  }
  cmpSel.buscaLida = {escopo:r.escopo, n:r.filtros.length, naoEntendi:r.naoEntendi, intencao:r.intencao,
                      avisoGrupo:r.avisoGrupo||''};
  lsSet('cmp_sel', cmpSel);
  sugg.style.display='none'; qin.value='';
  setView('cmp');
  $('#cmpview').scrollIntoView({block:'start'});
  return true;
}
function resumoConsulta(r){
  const p = [];
  if(r.intencao==='kpiEmpresa' && r.empresa) return r.kpi+' de '+r.empresa.nome;
  if(r.intencao==='kpi') return 'KPI: '+r.kpi+(r.escopo? ' · '+escopoRotulo(r.escopo):'');
  if(r.intencao==='setores'){
    const g = CMP_INDS.find(x=>x[0]===r.ind);
    let t = (r.dir==='asc' ? 'menores ' : 'maiores ') + nivelPlural(r.nivel||'set')
      + ' por ' + (g ? g[1] : 'valor de mercado') + ' (' + setStatRotulo(r.setStat||'med') + ' do grupo)';
    if(r.escopo) t += ' · dentro de ' + escopoRotulo(r.escopo);
    for(const f of (r.setFiltros||[])){
      const nm = (CMP_INDS.find(x=>x[0]===f.ind)||[])[1] || f.ind;
      t += ' · ' + nm + ' ' + (f.op==='gt'?'>':f.op==='lt'?'<':'entre') + ' ' + (f.op==='bt'?(f.v1+'–'+f.v2):f.v1);
    }
    return t;
  }
  if(r.escopo) p.push(escopoRotulo(r.escopo));
  if(r.intencao === 'rank'){
    const g = CMP_INDS.find(x=>x[0]===r.ind);
    if(g) p.push((r.dir==='asc' ? 'menores' : 'maiores') + ' ' + g[1]);
  }
  for(const f of r.filtros){
    const nome = f.kpi ? f.ind : ((CMP_INDS.find(x=>x[0]===f.ind)||[])[1]);
    if(!nome) continue;
    p.push(nome + ' ' + (f.op==='gt'?'>':f.op==='lt'?'<':'entre') + ' ' + (f.op==='bt' ? (f.v1+'–'+f.v2) : f.v1));
  }
  return p.join(' · ');
}
// Ação da primeira linha do dropdown. O Enter executa ESTA ação, e não uma
// reinterpretação do texto — era por isso que "ver o ranking · Enter" não
// respondia ao Enter em nenhuma das quatro linhas de atalho.
let suggAcao = null;
qin.addEventListener('input', () => {
  const bruto = qin.value.trim();
  const v = norm(bruto);
  sugg.textContent=''; suggAcao = null; if(v.length<2){ sugg.style.display='none'; return; }

  // pergunta com critério? só oferece quando há indicador com valor, para não
  // atrapalhar quem está só digitando o nome de uma empresa
  const q = buscaInterpreta(bruto);
  const temCriterio = q && !!q.intencao;
  if(temCriterio){
    const d = el('div');
    // Se sobrou termo que não entendi, isso aparece no próprio rótulo — o usuário
    // vê que parte da frase será ignorada antes de rodar a busca.
    const ignora = (q.naoEntendi||[]).length ? ' · IGNORA: '+q.naoEntendi.join(', ') : '';
    d.append(el('span','nm','🔍 '+resumoConsulta(q)+ignora),
             el('span','tk', (q.intencao==='rank' ? 'ver o ranking' : q.intencao==='setores' ? 'comparar os setores entre si' : q.intencao==='kpiEmpresa' ? 'abrir a empresa nos indicadores operacionais' : q.intencao==='kpi' ? 'comparar esse KPI entre empresas' : 'buscar empresas com esses critérios')+' · Enter'));
    d.onclick = () => abreConsulta(bruto);
    if(!suggAcao) suggAcao = d.onclick;
    sugg.append(d);
  }

  let hits = COS.filter(c => norm(c.name).includes(v) || norm(c.fullName).includes(v) ||
    c.root.toLowerCase().includes(v) || c.tickers.some(t=>t.t.toLowerCase().includes(v))).slice(0,12);
  // Nada pelo nome literal: tenta apelido ("magalu") e nome aproximado. NÃO tenta
  // quando a frase já produziu critério — aí a busca aproximada só produzia ruído
  // ("margem EBITDA entre 20 e 30" sugeria TIME FOR FUN por causa de "entre").
  if(!hits.length && !temCriterio){
    const alt = achaEmpresaNaFrase(bruto);
    if(alt && alt.ambiguo) hits = alt.ambiguo.map(a=>COS.find(x=>x.cvm===a.cvm)).filter(Boolean);
    else if(alt){ const c = COS.find(x=>x.cvm===alt.cvm); if(c) hits = [c]; }
  }
  for(const c of hits){
    const d = el('div'); d.append(el('span','nm',c.name), el('span','tk', c.tickers.map(t=>t.t).join(' ')+' · '+c.setor));
    d.onclick = () => { sugg.style.display='none'; qin.value=''; openDetail(c.cvm); };
    if(!suggAcao) suggAcao = d.onclick;
    sugg.append(d);
  }

  // Nada reconhecido e nenhuma empresa: em vez de dropdown vazio (que parece que
  // a busca nem rodou), diz que não entendeu e oferece os termos mais próximos.
  let ajudou = false;
  if(!temCriterio && !hits.length && bruto.split(/\s+/).length >= 2){
    const sug = sugereTermos(q ? (q.naoEntendi.length ? q.naoEntendi : bruto.split(/\s+/)) : bruto.split(/\s+/), 5);
    const achouEscopo = q && q.escopo;
    const d0 = el('div');
    d0.append(el('span','nm','❓ Não encontrei nada para "'+bruto.slice(0,38)+'"'),
              el('span','tk', achouEscopo ? ('reconheci só '+escopoRotulo(q.escopo)+' — falta dizer o indicador')
                : (sug.length ? 'veja abaixo o que existe com nome parecido' : 'clique para ver o que dá para pesquisar')));
    d0.onclick = () => { qin.value=''; sugg.style.display='none'; abreAjudaBusca(bruto); };
    sugg.append(d0);
    // Entendeu o setor mas não o indicador: aproveita a metade que deu certo
    if(achouEscopo){
      for(const [ik, ilabel] of [['mktCap','Valor de mercado'],['roe','ROE'],['roic','ROIC'],['dy','Div. Yield']]){
        const d = el('div');
        d.append(el('span','nm','→ maiores '+ilabel+' em '+escopoRotulo(q.escopo)),
                 el('span','tk','ver o ranking · Enter'));
        d.onclick = () => {
          cmpSel.setor = q.escopo; cmpSel.modo='rank'; cmpSel.ind=ik; cmpSel.dir='desc';
          cmpSel.filtros=[]; cmpSel.busca=''; cmpSel.buscaLida=null;
          lsSet('cmp_sel', cmpSel);
          sugg.style.display='none'; qin.value='';
          setView('cmp'); $('#cmpview').scrollIntoView({block:'start'});
        };
        if(!suggAcao) suggAcao = d.onclick;
        sugg.append(d);
      }
    }
    for(const s of sug){
      const d = el('div');
      d.append(el('span','nm','→ '+s.termo), el('span','tk', s.tipo + ' · usar este'));
      d.onclick = () => {
        // monta uma consulta válida com o termo que existe de verdade
        const nova = s.tipo==='indicador' ? ('maior '+s.termo) : (s.termo+' com maior ROE');
        qin.value = nova;
        qin.dispatchEvent(new Event('input',{bubbles:true}));
        qin.focus();
      };
      sugg.append(d);
    }
    ajudou = true;
  }
  sugg.style.display = (temCriterio || hits.length || ajudou) ? 'block' : 'none';
});
// painel de ajuda: o que dá para pesquisar, com exemplos clicáveis
function abreAjudaBusca(consulta){
  cmpSel.modo = 'scr';
  cmpSel.busca = consulta || '';
  cmpSel.filtros = [];
  const r = consulta ? buscaInterpreta(consulta) : null;
  // Quando o escopo foi reconhecido, ele é APLICADO e a mensagem passa a ser
  // parcial ("reconheci o subsetor X, falta o indicador"). Antes o painel dizia
  // "Não consegui interpretar" para uma consulta cujo setor havia sido entendido,
  // e ainda descartava o escopo — o usuário perdia a metade que deu certo.
  if(r && r.escopo) cmpSel.setor = r.escopo;
  cmpSel.buscaLida = {escopo:(r&&r.escopo)||'', n:0, naoEntendi:(r&&r.naoEntendi)||[],
                      intencao:null, falhou: !(r && r.escopo), parcial: !!(r && r.escopo)};
  lsSet('cmp_sel', cmpSel);
  setView('cmp');
  $('#cmpview').scrollIntoView({block:'start'});
}
// Enter: pergunta com critério vai para o screener; senão abre a primeira empresa
qin.addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  const bruto = qin.value.trim();
  if(bruto.length < 2) return;
  e.preventDefault();
  const q = buscaInterpreta(bruto);
  if(q && q.intencao){ abreConsulta(bruto); return; }
  // O dropdown pode ter montado um atalho pronto (ex.: "→ maiores ROE em subsetor
  // Comércio · ver o ranking · Enter"). O rótulo prometia o Enter e o Enter não
  // fazia nada, porque reinterpretava o texto — que é exatamente o que não tem
  // indicador. Executa a primeira linha oferecida.
  if(suggAcao && sugg.style.display !== 'none'){ suggAcao(); return; }
  // nem empresa nem critério: leva ao painel de ajuda em vez de não fazer nada
  const vv = norm(bruto);
  const achouEmpresa = COS.some(c => norm(c.name).includes(vv) || norm(c.fullName).includes(vv) ||
    c.root.toLowerCase().includes(vv) || c.tickers.some(t=>t.t.toLowerCase().includes(vv)));
  // /\s+/ e não /s+/: com a letra "s" literal, uma frase sem "s" nunca chegava ao
  // painel de ajuda e o Enter simplesmente não fazia nada ("compare petr4 e vale3").
  if(!achouEmpresa && bruto.split(/\s+/).length >= 2){ abreAjudaBusca(bruto); return; }
  const v = norm(bruto);
  const c = COS.find(c => norm(c.name).includes(v) || norm(c.fullName).includes(v) ||
    c.root.toLowerCase().includes(v) || c.tickers.some(t=>t.t.toLowerCase().includes(v)));
  if(c){ sugg.style.display='none'; qin.value=''; openDetail(c.cvm); }
});

function colChart(container, data, color, fmt){
  // data: [{p, v}] — colunas finas, base única, cantos 4px no topo, gap ≥2px
  container.textContent='';
  const vals = data.map(d=>d.v).filter(v=>v!=null);
  if(!vals.length){ container.append(el('div','dim','sem dados')); return; }
  const W = Math.max(container.clientWidth||280, 240), H = 150, padL=8, padR=8, padT=14, padB=20;
  const iw = W-padL-padR, ih = H-padT-padB;
  let mx = Math.max(0,...vals), mn = Math.min(0,...vals);
  if(mx===mn){ mx = mx||1; }
  const y = v => padT + ih*(mx-v)/(mx-mn);
  const y0 = y(0);
  const n = data.length;
  const slot = iw/n, bw = Math.min(24, Math.max(6, slot-6));
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.setAttribute('width','100%'); svg.style.display='block';
  const line = (x1,y1,x2,y2,st,swidth) => { const l=document.createElementNS(svg.namespaceURI,'line'); l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);l.setAttribute('stroke',st);l.setAttribute('stroke-width',swidth||1); return l; };
  // gridline no zero (baseline) — recessiva
  svg.append(line(padL, y0, W-padR, y0, 'var(--axis)', 1));
  for(let i=0;i<n;i++){
    const d = data[i];
    const cx = padL + slot*i + slot/2;
    if(d.v!=null){
      const h = Math.abs(y(d.v)-y0);
      const top = d.v>=0 ? y(d.v) : y0;
      const r = Math.min(4, bw/2, h);
      const path = document.createElementNS(svg.namespaceURI,'path');
      const x0 = cx-bw/2, x1b = cx+bw/2;
      let dd;
      if(d.v>=0) dd = `M${x0},${top+h}L${x0},${top+r}Q${x0},${top} ${x0+r},${top}L${x1b-r},${top}Q${x1b},${top} ${x1b},${top+r}L${x1b},${top+h}Z`;
      else dd = `M${x0},${top}L${x1b},${top}L${x1b},${top+h-r}Q${x1b},${top+h} ${x1b-r},${top+h}L${x0+r},${top+h}Q${x0},${top+h} ${x0},${top+h-r}Z`;
      path.setAttribute('d',dd); path.setAttribute('fill',color);
      svg.append(path);
    }
    // hit target maior que a marca
    const hit = document.createElementNS(svg.namespaceURI,'rect');
    hit.setAttribute('x', padL+slot*i); hit.setAttribute('y', 0); hit.setAttribute('width', slot); hit.setAttribute('height', H);
    hit.setAttribute('fill','transparent');
    hit.addEventListener('pointermove', e=>{ showTip(e.clientX,e.clientY, [[d.p, d.v==null?'—':fmt(d.v)]]); });
    hit.addEventListener('pointerleave', hideTip);
    svg.append(hit);
    // rótulos de eixo: só T1 de cada ano p/ respirar
    if(d.p.endsWith('T1') || n<=4){
      const t = document.createElementNS(svg.namespaceURI,'text');
      t.setAttribute('x',cx); t.setAttribute('y',H-5); t.setAttribute('text-anchor','middle');
      t.textContent = d.p.slice(0,4); svg.append(t);
    }
  }
  // rótulo direto: último ponto
  const last = [...data].reverse().find(d=>d.v!=null);
  if(last){
    const cx = padL + slot*data.indexOf(last) + slot/2;
    const t = document.createElementNS(svg.namespaceURI,'text');
    t.setAttribute('class','val');
    t.setAttribute('y', Math.max(10,(last.v>=0? y(last.v)-4 : y(last.v)+12)));
    t.setAttribute('x', Math.min(cx, W-padR-4)); t.setAttribute('text-anchor','middle');
    t.textContent = fmt(last.v); svg.append(t);
  }
  container.append(svg);
}

const ovl = $('#ovl'), panel = $('#panel');
ovl.onclick = closeDetail;
function closeDetail(){
  ovl.classList.remove('on'); panel.classList.remove('on'); openCvm=null;
  // se a camada foi aberta empilhando estado, desempilha para o histórico não
  // acumular entradas mortas
  if(history.state && history.state.pb3 === 'detalhe'){ try{ history.back(); }catch(e){} }
}
// O app Android é um TWA: sem histórico próprio, o botão Voltar do sistema fecha o
// APLICATIVO em vez de fechar o painel aberto — que é o que qualquer um espera.
// Cada camada (detalhe da empresa, modal) empilha uma entrada; o Voltar a remove.
function empilha(tipo){
  try{ history.pushState({pb3: tipo}, ''); }catch(e){}
}
addEventListener('popstate', () => {
  const modal = document.getElementById('iovl');
  if(modal && modal.classList.contains('on')){ if(typeof closeInfo==='function') closeInfo(); return; }
  if(openCvm){ ovl.classList.remove('on'); panel.classList.remove('on'); openCvm=null; }
});
// Esc fecha só o TOPO da pilha. Antes fechava os dois níveis de uma vez: abrir o
// histórico de um indicador por cima do detalhe da empresa e apertar Esc jogava o
// usuário para a lista, perdendo a empresa que ele estava lendo.
document.addEventListener('keydown', e=>{
  if(e.key !== 'Escape') return;
  const modal = document.getElementById('iovl');
  if(modal && modal.classList.contains('on')){
    if(typeof closeInfo === 'function') closeInfo();
    return;
  }
  closeDetail();
});

// glosKey liga o tile ao glossário: o '?' aparece só onde há explicação escrita,
// e a explicação é a MESMA que a tabela e o modal ⓘ mostram — uma fonte só.
function statTile(label, value, extra, valueCls, glosKey){
  const c = el('div','tile');
  const lab = el('div','l', label);
  const aj = glosKey && ajudaInd(glosKey);
  if(aj){ lab.style.display='flex'; lab.style.alignItems='center'; lab.append(aj); }
  c.append(lab);
  const v = el('div','v',value); if(valueCls) v.classList.add(valueCls); c.append(v);
  if(extra) c.append(el('div','d',extra)); return c;
}

const jj = (u,ms,opts) => Promise.race([fetch(u,opts).then(r=>{ if(!r.ok) throw new Error('http '+r.status); return r.json(); }),
                                        new Promise((_,rj)=>setTimeout(()=>rj(new Error('timeout')), ms||9000))]);
const FRESH_MS = 5*60*1000; // entrada "ao vivo" mais velha que isso volta a cair no snapshot do robô
const freshQ = e => !!(e && e.p!=null && e.ts && (Date.now()-e.ts) < FRESH_MS);
function getQ(k){ // melhor cotação disponível para um símbolo (prioridade: B3 ao vivo > Finnhub > robô)
  const b = LIVEB3[k];
  if(freshQ(b)) return {p:b.p, pct:b.pct, cur:'BRL', live:'b3', at:b.at};
  const f = LIVEUS[k];
  if(freshQ(f)) return {p:f.p, pct:f.pct, cur:'USD', live:'finnhub', at:f.at};
  const s = QSNAP.q && QSNAP.q[k];
  // p > 0 e não p != null: o quotes.json guarda o último valor bom de cada papel,
  // e entradas legadas ficaram com p = 0 (papel suspenso). Zero passava por "tenho
  // cotação" e sobrepunha o preço do Fundamentus: a ALIPERTI aparecia como R$ 0,00
  // na lista e R$ 3.500,00 no detalhe, na mesma tela. O collect_quotes.py já aplica
  // esta mesma regra na coleta.
  if(s && s.p > 0){
    const pct = (s.pv!=null && s.pv!==0) ? (s.p/s.pv-1)*100 : null;
    return {p:s.p, pct, cur:s.cur, live:null, t:s.t, n:s.n};
  }
  return null;
}
const qName = k => { const s=QSNAP.q && QSNAP.q[k]; return (s && s.n) || ''; };
// Mostra a DATA quando o carimbo do dado não é de hoje. Só com HH:MM, um
// fechamento de dias atrás (ou de 2024, no caso de papel suspenso) aparecia com

const hojeSP = () => new Date().toLocaleDateString('pt-BR',{timeZone:'America/Sao_Paulo'});
const qHora = q => {
  if(!q) return '';
  if(q.at) return q.at;
  if(q.t) try{
    const d = new Date(q.t*1000);
    const dia = d.toLocaleDateString('pt-BR',{timeZone:'America/Sao_Paulo'});
    const hm = d.toLocaleTimeString('pt-BR',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit'});
    return dia === hojeSP() ? hm : (dia.slice(0,5)+' '+hm);
  }catch(e){}
  return '';
};
// true quando o carimbo do próprio dado é de hoje (fuso de São Paulo)
const qDeHoje = q => {
  if(!q || !q.t) return false;
  try{ return new Date(q.t*1000).toLocaleDateString('pt-BR',{timeZone:'America/Sao_Paulo'}) === hojeSP(); }
  catch(e){ return false; }
};

async function pool(items, n, fn){ // concorrência limitada
  let i = 0;
  await Promise.all(Array.from({length: Math.min(n, items.length)}, async () => {
    while(i < items.length){ const k = i++; try{ await fn(items[k]); }catch(e){} }
  }));
}

// ---- B3: API pública do site de cotações (CORS aberto; defasagem ~15 min do pregão)
async function b3quote(t){
  const d = await jj('https://cotacao.b3.com.br/mds/api/v1/instrumentQuotation/'+encodeURIComponent(t));
  const tr = d && d.Trad && d.Trad[0];
  const q = tr && tr.scty && tr.scty.SctyQtn;
  if(!q || q.curPrc==null) return null;
  return {p:q.curPrc, pct:q.prcFlcn, open:q.opngPric, min:q.minPric, max:q.maxPric,
          qty:tr.ttlQty, at:((d.Msg&&d.Msg.dtTm)||'').slice(11,16)};
}
async function b3index(sym){
  const d = await jj('https://cotacao.b3.com.br/mds/api/v1/DailyFluctuationHistory/'+sym);
  const l = d.TradgFlr.scty.lstQtn; const last = l[l.length-1];
  return {pontos:+last.closPric, varDia:+(+last.prcFlcn).toFixed(2), date:d.TradgFlr.date, hora:(last.dtTm||'').slice(0,5)};
}

function b3Needed(){ // tickers B3 que precisam de cotação ao vivo agora

async function refreshB3(){
  if(document.hidden) return;
  let any = false;
  const [ib, ifx] = await Promise.all([b3index('IBOV').catch(()=>null), b3index('IFIX').catch(()=>null)]);
  if(ib){ LIVEIDX.IBOV = ib; any = true; }
  if(ifx){ LIVEIDX.IFIX = ifx; any = true; }
  const need = b3Needed();
  if(need.length){
    const tok = lsStr('tok_brapi');
    if(tok){
      try{
        const d = await jj('https://brapi.dev/api/quote/'+need.join(',')+'?token='+encodeURIComponent(tok), 12000);
        for(const r of (d.results||[])){
          if(r.regularMarketPrice==null) continue;
          LIVEB3[r.symbol] = {p:r.regularMarketPrice, pct:r.regularMarketChangePercent,
            open:r.regularMarketOpen, min:r.regularMarketDayLow, max:r.regularMarketDayHigh,
            qty:r.regularMarketVolume, at:hhmm(), ts:Date.now()};
          any = true;
        }
      }catch(e){}
    } else {
      await pool(need, 6, async t => { const q = await b3quote(t); if(q){ LIVEB3[t] = {...q, ts:Date.now()}; any = true; } });
    }
  }
  if(any){ B3LIVE.ok = true; B3LIVE.at = hhmm(); afterQuotes(); }

let CANDLES = null, CANDLES_ERR = false, chartSym = null, chartBox = null, chartNote = null, chartDraw = null;
const PERIODS = [['1M',31],['3M',93],['6M',186]];
let chartPrefs = lsGet('chart_prefs') || {p:93, tipo:'candle'};
if(!PERIODS.some(x=>x[1]===chartPrefs.p)) chartPrefs.p = 93;
// TTL de 3 horas. Sem ele, o arquivo lido no primeiro gráfico ficava na memória
// para sempre: em aba (ou app) aberta por dias o gráfico perdia os dias novos e a
// faixa vermelha passava a acusar o robô de não ter publicado — quando o robô
// havia publicado e era a página que não relia. Mesmo padrão do NEWS_TTL_MS.
const CANDLES_TTL_MS = 3*60*60*1000;
let CANDLES_EM = 0;
async function loadCandles(){
  if(CANDLES && (Date.now() - CANDLES_EM) < CANDLES_TTL_MS) return CANDLES;
  try{
    const d = await jj('https://raw.githubusercontent.com/'+REPO+'/main/data/candles.json?v='+Math.floor(Date.now()/36e5), 25000);
    if(!d || !d.c) throw new Error('formato');
    CANDLES = d; CANDLES_EM = Date.now();
    CANDLES_ERR = false;   // sucesso posterior tem de apagar o erro anterior, senão
                           // "histórico indisponível" ficava na tela para sempre
  }catch(e){
    // falha NÃO apaga o que já havia: melhor o gráfico de 3 horas atrás do que nenhum
    if(!CANDLES) CANDLES = null;
    CANDLES_ERR = true;
  }
  return CANDLES;
}
function todayCandle(sym){
  const L = LIVEB3[sym];
  if(freshQ(L) && L.open!=null && L.min!=null && L.max!=null)
    return {t:Math.floor(Date.now()/864e5), o:L.open, h:L.max, l:L.min, c:L.p, parcial:true};
  const q = getQ(sym);
  if(q && q.p!=null && q.pct!=null){
    const pv = q.p/(1+q.pct/100);
    return {t:Math.floor(Date.now()/864e5), o:pv, h:Math.max(q.p,pv), l:Math.min(q.p,pv), c:q.p, parcial:true, aprox:true};
  }
  return null;
}
function candleSeries(sym){
  const hist = (CANDLES && CANDLES.c && CANDLES.c[sym])
    ? CANDLES.c[sym].map(r=>({t:r[0], o:r[1], h:r[2], l:r[3], c:r[4]})) : [];
  const hoje = todayCandle(sym);
  if(hoje){
    const last = hist[hist.length-1];
    if(last && last.t >= hoje.t){ // o histórico já tem o dia: completa com o ao vivo
      last.c = hoje.c; last.h = Math.max(last.h, hoje.h); last.l = Math.min(last.l, hoje.l);
      last.parcial = true; last.aprox = hoje.aprox;
    } else hist.push(hoje);
  }
  return hist;
}
function candleChart(container, rows, tipo){
  container.textContent = '';
  if(!rows || rows.length < 2){ container.append(el('div','dim','sem histórico para este ativo')); return; }
  const W = Math.max(container.clientWidth||600, 320), H = 250, padL=6, padR=52, padT=10, padB=18;
  const iw = W-padL-padR, ih = H-padT-padB;
  let mn = Infinity, mx = -Infinity;
  for(const r of rows){ if(r.l<mn) mn=r.l; if(r.h>mx) mx=r.h; }
  if(!(mx>mn)) mx = mn+1;
  const y = v => padT + ih*(mx-v)/(mx-mn);
  const n = rows.length, slot = iw/n, bw = Math.max(2, Math.min(9, slot*0.65));
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+H); svg.setAttribute('width','100%'); svg.style.display='block';
  const fmtP = v => fmtc2.format(v);
  for(let g=0; g<=3; g++){ // linhas de referência com rótulo à direita
    const v = mn + (mx-mn)*g/3, gy = y(v);
    const l = document.createElementNS(svg.namespaceURI,'line');
    l.setAttribute('x1',padL); l.setAttribute('x2',W-padR); l.setAttribute('y1',gy); l.setAttribute('y2',gy);
    l.setAttribute('stroke','var(--grid)'); svg.append(l);
    const tx = document.createElementNS(svg.namespaceURI,'text');
    tx.setAttribute('x',W-padR+4); tx.setAttribute('y',gy+4); tx.textContent = fmtP(v); svg.append(tx);
  }
  const dtBR = d => new Date(d*864e5).toLocaleDateString('pt-BR',{timeZone:'UTC',day:'2-digit',month:'2-digit'});
  if(tipo === 'linha'){ // visão em linha: fechamento diário
    const path = document.createElementNS(svg.namespaceURI,'path');
    let dd = '';
    for(let i=0; i<n; i++){ const cx = padL + slot*i + slot/2; dd += (i?'L':'M')+cx.toFixed(1)+','+y(rows[i].c).toFixed(1); }
    path.setAttribute('d',dd); path.setAttribute('fill','none');
    path.setAttribute('stroke','var(--s1)'); path.setAttribute('stroke-width','1.8');
    path.setAttribute('stroke-linejoin','round'); svg.append(path);
  }
  let mesAnt = new Date(rows[0].t*864e5).getUTCMonth();
  for(let i=0; i<n; i++){
    const r = rows[i], cx = padL + slot*i + slot/2;
    if(tipo !== 'linha'){
      const cor = r.c >= r.o ? 'var(--good)' : 'var(--bad)';
      const wick = document.createElementNS(svg.namespaceURI,'line');
      wick.setAttribute('x1',cx); wick.setAttribute('x2',cx);
      wick.setAttribute('y1',y(r.h)); wick.setAttribute('y2',y(r.l));
      wick.setAttribute('stroke',cor); svg.append(wick);
      const bt = y(Math.max(r.o,r.c)), bb = y(Math.min(r.o,r.c));
      const body = document.createElementNS(svg.namespaceURI,'rect');
      body.setAttribute('x',cx-bw/2); body.setAttribute('y',bt);
      body.setAttribute('width',bw); body.setAttribute('height',Math.max(1, bb-bt));
      body.setAttribute('fill',cor); body.setAttribute('rx',1);
      if(r.parcial) body.setAttribute('opacity','.75');
      svg.append(body);
    }
    const mes = new Date(r.t*864e5).getUTCMonth();
    if(i>0 && mes!==mesAnt){ mesAnt = mes;
      const tx = document.createElementNS(svg.namespaceURI,'text');
      tx.setAttribute('x',cx); tx.setAttribute('y',H-4); tx.setAttribute('text-anchor','middle');
      tx.textContent = new Date(r.t*864e5).toLocaleDateString('pt-BR',{timeZone:'UTC',month:'short'});
      svg.append(tx);
    }
    const hit = document.createElementNS(svg.namespaceURI,'rect');
    hit.setAttribute('x',padL+slot*i); hit.setAttribute('y',0);
    hit.setAttribute('width',slot); hit.setAttribute('height',H);
    hit.setAttribute('fill','transparent');
    // pointerdown junto de pointermove: no celular e no app não existe hover, e
    // abertura, máxima e mínima do dia só existiam no tooltip — a informação era
    // inalcançável por toque.
    const mostra = e => showTip(e.clientX, e.clientY, [
      [dtBR(r.t)+(r.parcial ? (r.aprox?' · hoje (aprox.)':' · hoje ao vivo') : ''), fmtP(r.c)],
      ['abre '+fmtP(r.o)+' · máx '+fmtP(r.h)+' · mín '+fmtP(r.l), (r.c>=r.o?'▲ ':'▼ ')+fmtc2.format(Math.abs(r.c/r.o-1)*100)+'%'],
    ]);
    hit.addEventListener('pointermove', mostra);
    hit.addEventListener('pointerdown', mostra);
    hit.addEventListener('pointerleave', hideTip);
    svg.append(hit);
  }
  const last = rows[n-1];
  const tx = document.createElementNS(svg.namespaceURI,'text');
  tx.setAttribute('class','val'); tx.setAttribute('x',W-padR+4);
  tx.setAttribute('y', Math.max(12, Math.min(H-6, y(last.c)-6)));
  tx.textContent = '● '+fmtP(last.c); svg.append(tx);
  container.append(svg);
}
function chartNoteTxt(rows){
  const ult = rows[rows.length-1];
  return 'Diário · histórico do robô'
    + (CANDLES && CANDLES.updatedAt ? ' ('+dmy(CANDLES.updatedAt)+')' : '')
    + (ult && ult.parcial ? (ult.aprox ? ' · hoje ao vivo (abertura aproximada)' : ' · hoje ao vivo com abertura/mín/máx da B3') : '');
}
function chartUI(sym, mount, noteEl){ // controles de visão (período + candles/linha) + gráfico
  mount.textContent = '';
  if(!candleSeries(sym).length){
    const msg = CANDLES_ERR ? 'histórico indisponível no momento — tente de novo em instantes'
                            : 'sem histórico para '+sym+' — o robô de candles (1x/dia) ainda não coletou este ativo';
    if(noteEl) noteEl.textContent = msg; else mount.append(el('div','dim',msg));
    return null;
  }
  const bar = el('div','badges'); bar.style.margin = '0 0 8px';
  const box = el('div');
  const mk = (lbl, key, apply) => {
    const b = el('span','badge cndl',lbl); b.dataset.k = key;
    b.onclick = () => { apply(); lsSet('chart_prefs', chartPrefs); draw(); };
    bar.append(b);
  };
  for(const [lbl,days] of PERIODS) mk(lbl, 'p'+days, () => { chartPrefs.p = days; });
  mk('Candles','tcandle', () => { chartPrefs.tipo = 'candle'; });
  mk('Linha','tlinha', () => { chartPrefs.tipo = 'linha'; });
  const draw = () => {
    const all = candleSeries(sym);
    const corte = Math.floor(Date.now()/864e5) - chartPrefs.p;
    let rows = all.filter(r => r.t >= corte);
    if(rows.length < 2) rows = all;
    if(noteEl) noteEl.textContent = chartNoteTxt(rows);
    candleChart(box, rows, chartPrefs.tipo);
    for(const b of bar.children)
      b.classList.toggle('on', b.dataset.k === 'p'+chartPrefs.p || b.dataset.k === 't'+chartPrefs.tipo);
  };
  mount.append(bar, box);
  draw();
  return draw;
}
async function openChart(sym, titulo){
  modalKind = 'chart'; chartSym = sym;
  ibox.textContent = '';
  const x = el('button','btn x2','✕ fechar'); x.onclick = closeInfo; ibox.append(x);
  ibox.append(el('h2',null,titulo));
  chartNote = el('div','note','carregando histórico…'); ibox.append(chartNote);
  chartBox = el('div'); chartBox.style.marginTop = '8px'; ibox.append(chartBox);
  iovl.classList.add('on');
  await loadCandles();
  if(modalKind !== 'chart' || chartSym !== sym) return; // usuário fechou/trocou
  refreshB3charts(sym); // busca o ao vivo deste símbolo se for B3
  chartDraw = chartUI(sym, chartBox, chartNote); // desenho direto: rAF não dispara com a aba em 2º plano
}
async function refreshB3charts(sym){ // candle de hoje mais rico p/ ativos B3 abertos no gráfico
  // freshQ e não !LIVEB3[sym]: com entrada de 6 minutos atrás (fora da janela de
  // 5 min) o resto do painel já a considera velha, mas aqui ela bloqueava a busca
  // de cotação nova e o candle de hoje ficava preso na aproximação.
  if(/^[A-Z]{4}[0-9]{1,2}$/.test(sym) && !freshQ(LIVEB3[sym])){
    try{ const q = await b3quote(sym); if(q){ LIVEB3[sym] = {...q, ts:Date.now()}; redrawChart(); } }catch(e){}
  }
}
function redrawChart(){
  if(modalKind === 'chart' && typeof chartDraw === 'function') chartDraw();
}

// ================= VALOR DA FIRMA, HISTÓRICO DE INDICADORES, NOTÍCIAS, COMPARAR =================
function evOf(c){ // valor da firma = valor de mercado + dívida líquida (R$ mi)
  if(c.ind && c.ind.ev != null) return c.ind.ev;
  if(c.ind && c.ind.mktCap != null && c.bal && c.bal.divL != null) return +(c.ind.mktCap + c.bal.divL).toFixed(1);
  return null;
}

// ---- séries históricas de indicadores (CVM trimestral + histórico de balanço "bh")
const QE_MAP = {'1':'03-31','2':'06-30','3':'09-30','4':'12-31'};
const MES_Q = {'03':'1','06':'2','09':'3','12':'4'};
function indSeries(c, key){
  // séries direto do histórico de balanço (não dependem de DRE)
  const bhRows = f => (c.bh||[]).map(b => ({p: b.dt.slice(0,4)+'T'+MES_Q[b.dt.slice(5,7)], v: b[f]!=null? b[f] : null}));
  if(key==='plBal')   return {rows:bhRows('pl'),   fmt:fmtNum, titulo:'Patrimônio líquido por trimestre (R$)', nota:'CVM (balanços)'};
  if(key==='divLBal') return {rows:bhRows('divL'), fmt:fmtNum, titulo:'Dívida líquida por trimestre (R$)', nota:'CVM (balanços)'};
  if(key==='ativoBal')return {rows:bhRows('ativo'),fmt:fmtNum, titulo:'Ativo total por trimestre (R$)', nota:'CVM (balanços)'};
  const q = c.q || [];
  if(!q.length) return null;
  const pn = p => (+p.slice(0,4))*4 + (+p.slice(5)); // 2026T2 -> posição sequencial
  const byP = {}; for(const x of q) byP[pn(x.p)] = x;
  const roll = f => q.map(x => { // soma móvel de 4 TRIMESTRES CONSECUTIVOS (lacuna de entrega => null)
    const n0 = pn(x.p); let s = 0;
    for(let k = n0-3; k <= n0; k++){
      const it = byP[k];
      if(!it || it[f]==null) return null;
      s += it[f];
    }
    return +s.toFixed(1);
  });
  const balAt = p => {
    if(!c.bh || !c.bh.length) return null;
    return c.bh.find(b => b.dt === p.slice(0,4)+'-'+QE_MAP[p.slice(5)]) || null;
  };
  const mk = f => q.map(x=>({p:x.p, v:x[f]!=null?x[f]:null}));
  const rows12 = arr => q.map((x,i)=>({p:x.p, v:arr[i]}));
  const p1 = v => v==null?null:+v.toFixed(1);
  // indSeries é o ponto ÚNICO por onde passam o tile clicável, o modal de
  // histórico, o modo Histórico do Comparar e o "copiar dados (Excel)". As guardas
  // tinham de estar aqui: sem elas o modal publicava o ROE de 366,8% (EQTL PARA) e
  // de −43.150% (SUDESTE, PL de R$ 0,2 mi) que o tile ao lado dizia não publicar,
  // e o Excel exportava esses mesmos números.
  const susp = niSuspeito(c);
  // trimestre marcado pelo process.py (aritmética da entrega não fecha) sai da série
  const marcado = new Set((q||[]).filter(x=>x.sus).map(x=>x.p));
  const semSus = rows => rows.map(r => marcado.has(r.p) ? {p:r.p, v:null} : r);
  switch(key){
    case 'mgE':  return {rows:semSus(mk('mgE')),  fmt:fmtPct, titulo:'Margem EBITDA por trimestre', nota:'CVM (ITR/DFP)'};
    case 'mgL':  return susp ? null : {rows:semSus(mk('mgL')), fmt:fmtPct, titulo:'Margem líquida por trimestre', nota:'CVM (ITR/DFP)'};
    case 'rev12':{ return {rows:semSus(rows12(roll('rev'))), fmt:fmtNum, titulo:'Receita acumulada 12 meses (R$)', nota:'CVM · soma móvel de 4 trimestres'}; }
    case 'ebitda12':{ return {rows:semSus(rows12(roll('ebitda'))), fmt:fmtNum, titulo:'EBITDA acumulado 12 meses (R$)', nota:'CVM · soma móvel de 4 trimestres'}; }
    case 'ni12': { return susp ? null : {rows:semSus(rows12(roll('ni'))),  fmt:fmtNum, titulo:'Lucro líquido acumulado 12 meses (R$)', nota:'CVM · soma móvel de 4 trimestres'}; }
    case 'roe':  { if(susp || plVirou(c)) return null; const r=roll('ni');
      // PISO_PL e não pl>0: com PL de R$ 0,2 mi o percentual chega a −43.150%
      return {rows:semSus(q.map((x,i)=>{ const b=balAt(x.p); return {p:x.p, v:(b&&b.pl>=PISO_PL&&r[i]!=null)? p1(100*r[i]/b.pl):null}; })),
              fmt:fmtPct, titulo:'ROE — lucro 12m ÷ PL do trimestre',
              nota:'CVM · precisa do histórico de balanço · exige PL ≥ R$ '+PISO_PL+' mi'}; }
    case 'roic': { if(plVirou(c)) return null; const r=roll('ebit');
      // usa a alíquota efetiva da empresa quando o process.py conseguiu calculá-la
      const tx = (c.ind && c.ind.roicT != null) ? c.ind.roicT/100 : 0.34;
      return {rows:semSus(q.map((x,i)=>{ const b=balAt(x.p);
        if(!b||b.pl==null||r[i]==null) return {p:x.p,v:null};
        const inv=b.pl+Math.max(b.divL||0,0);
        return {p:x.p, v:inv>0? p1(100*(r[i]*(1-tx))/inv):null}; })),
              fmt:fmtPct, titulo:'ROIC — EBIT 12m × (1−'+nbr.format(+(100*tx).toFixed(1))+'%) ÷ (PL + máx(dívida líq., 0))',
              nota:'CVM · aproximação'+(c.ind && c.ind.roicT!=null ? ' com a alíquota efetiva da própria empresa' : ' com alíquota de 34%')+'; o tile usa o ROIC do Fundamentus quando existe'}; }
    case 'dlEbitda': { const r=roll('ebitda'), rv=roll('rev');
      // mesma regra do dlEbitdaDe: EBITDA abaixo de 2% da receita é ruído, e a
      // razão viraria alavancagem de centenas de vezes
      return {rows:semSus(q.map((x,i)=>{ const b=balAt(x.p);
        const ok = b && b.divL!=null && r[i]>0 && !(rv[i]>0 && r[i] < 0.02*rv[i]);
        return {p:x.p, v: ok ? +(b.divL/r[i]).toFixed(2) : null}; })),
              fmt:fmtX, titulo:'Dívida líquida ÷ EBITDA 12m',
              nota:'CVM · exige EBITDA positivo e de pelo menos 2% da receita'}; }
  }
  return null;
}
