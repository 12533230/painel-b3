<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insignia Partners · Painel B3</title>
<link rel="icon" type="image/png" href="data:image/png;base64,__FAVICON__">
<link rel="manifest" href="app/manifest.json" id="pwa-manifest">
<meta name="theme-color" content="#0c2a2d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Painel B3">
<link rel="apple-touch-icon" href="app/icon-192.png">
<style>
  /* Identidade visual Insignia Partners — paleta do Manual de Marca + tema PPT v4 */
  :root{
    color-scheme: light;
    --page:#f5fcf8; --surface:#ffffff; --ink:#0c2a2d; --ink2:#18494e; --muted:#5e8271;
    --grid:#dfeae2; --axis:#a2b9af; --border:rgba(12,42,45,.13);
    --s1:#18494e; --s2:#dcb604; --s3:#4f47ad;
    --good:#3e6b52; --bad:#92442f; --wash:rgba(99,136,118,.10);
    --link:#18494e; --brandbar:#0c2a2d; --brandink:#f5fcf8;
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --page:#091e20; --surface:#133a3e; --ink:#fafffc; --ink2:#a2b9af; --muted:#8ba79a;
    --grid:#1d575e; --axis:#2b5c60; --border:rgba(245,252,248,.14);
    --s1:#5ba7b6; --s2:#dcb604; --s3:#817adb;
    --good:#b8c666; --bad:#bd7e6f; --wash:rgba(139,167,154,.13);
    --link:#8dc8d4; --brandbar:#0c2a2d; --brandink:#f5fcf8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--page);color:var(--ink);font:13.5px/1.45 Tahoma,Verdana,"Segoe UI",system-ui,sans-serif}
  a{color:inherit}
  .hdr{position:sticky;top:0;z-index:30}
  .top{background:var(--brandbar);border-bottom:1px solid rgba(245,252,248,.12);padding:10px 18px;display:flex;gap:14px;align-items:center;flex-wrap:nowrap;min-width:0}
  /* ---- faixa de cotações (ticker) ---- */
  .ticker{background:var(--brandbar);border-bottom:3px solid #638876;overflow:hidden;cursor:default}
  .tk-track{display:inline-flex;align-items:baseline;gap:36px;padding:6px 0 7px;white-space:nowrap;animation:tkmove 60s linear infinite;will-change:transform}
  .ticker:hover .tk-track{animation-play-state:paused}
  @keyframes tkmove{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @media (prefers-reduced-motion: reduce){.tk-track{animation:none}}
  .tk{display:inline-flex;gap:7px;align-items:baseline;font-size:12.5px}
  .tk .l{color:rgba(245,252,248,.60);font-size:10.5px;letter-spacing:.05em;font-weight:600}
  .tk .v{color:#f5fcf8;font-weight:700;font-variant-numeric:tabular-nums}
  .tk .up{color:#cbdd7f;font-weight:600;font-size:11.5px}
  .tk .dn{color:#e9a08c;font-weight:600;font-size:11.5px}
  .tk .st{color:rgba(245,252,248,.45);font-size:10.5px}
  .nav{display:flex;border:1px solid rgba(245,252,248,.28);border-radius:8px;overflow:hidden;flex-shrink:0}
  .nav button{border:none;background:transparent;color:rgba(245,252,248,.72);padding:7px 12px;cursor:pointer;font:inherit;font-weight:700;white-space:nowrap}
  .nav button.on{background:rgba(245,252,248,.16);color:#fff}
  .top .src{flex-shrink:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .top h1{white-space:nowrap}
  @media(max-width:1100px){.top .src{display:none}}
  @media(max-width:760px){.top h1{display:none}.top .div{display:none}}
  .top .logo{height:20px;display:block}
  .top .div{width:1px;height:24px;background:rgba(245,252,248,.25)}
  .top h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.01em;color:var(--brandink)}
  .top .src{color:rgba(245,252,248,.62);font-size:11.5px}
  .top .sp{flex:1}
  .search{position:relative}
  .search input{width:300px;max-width:60vw;padding:7px 12px;border:1px solid rgba(245,252,248,.28);border-radius:8px;background:rgba(245,252,248,.10);color:#f5fcf8;font:inherit;outline:none}
  .search input::placeholder{color:rgba(245,252,248,.55)}
  .search input:focus{border-color:#cbdd7f;background:rgba(245,252,248,.16)}
  .sugg{position:absolute;top:38px;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:320px;overflow:auto;display:none;z-index:40}
  .sugg div{padding:8px 12px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
  .sugg div:hover{background:var(--wash)}
  .sugg .tk{color:var(--muted);font-size:12px}
  .btn{border:1px solid var(--border);background:var(--surface);color:var(--ink2);border-radius:8px;padding:7px 11px;cursor:pointer;font:inherit}
  .btn:hover{border-color:#638876;color:var(--ink)}
  .top .btn{background:rgba(245,252,248,.10);border-color:rgba(245,252,248,.28);color:#f5fcf8;white-space:nowrap;flex-shrink:0}
  .top .search{flex-shrink:0}
  .top .btn:hover{border-color:#cbdd7f;color:#fff}
  .wrap{display:grid;grid-template-columns:270px 1fr;gap:0;min-height:calc(100vh - 90px)}
  @media(max-width:900px){.wrap{grid-template-columns:1fr}.side{display:none}}
  .side{border-right:1px solid var(--grid);padding:14px 10px 40px;overflow-y:auto;max-height:calc(100vh - 92px);position:sticky;top:92px}
  body[data-view="macro"] .wrap,body[data-view="etf"] .wrap,body[data-view="eua"] .wrap,body[data-view="cmp"] .wrap{display:none}
  #macroview,#etfview,#euaview,#cmpview{display:none;padding:16px 18px 60px;max-width:1280px;margin:0 auto}
  body[data-view="macro"] #macroview{display:block}
  body[data-view="etf"] #etfview{display:block}
  body[data-view="eua"] #euaview{display:block}
  body[data-view="cmp"] #cmpview{display:block}
  .cmpbar{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 12px}
  .cmpbar select{padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;max-width:100%}
  .rmv{border:none;background:transparent;color:var(--bad);cursor:pointer;font:inherit;font-size:12px;padding:0 4px}
  .cndl{cursor:pointer}
  .qtbl tbody tr.cndl:hover{background:var(--wash)}
  .badge.on{background:var(--wash);border-color:var(--muted);color:var(--ink);font-weight:700}
  /* ---- mobile ---- */
  .mobsec{display:none;margin:0 0 10px}
  .mobsec select{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
  @media(max-width:1360px){ /* janelas médias: a busca desce para a 2ª linha do cabeçalho */
    .top{flex-wrap:wrap;row-gap:8px}
    .search{flex:1 1 100%}
    .search input{width:100%;max-width:none}
    .sugg{top:42px}
  }
  @media(max-width:900px){
    .mobsec{display:block}
    .hdr{position:static}
    .top{padding:8px 10px}
    .top h1{display:none}.top .div{display:none}
    .search input{font-size:16px} /* <16px dispara zoom no iOS */
    .mobsec select{font-size:16px}
  }
  @media(max-width:760px){
    .nav button{padding:6px 8px;font-size:12px}
    .top .btn{padding:6px 8px;font-size:12px}
    .main{padding:10px 10px 60px}
    #macroview,#etfview,#euaview{padding:10px 10px 60px}
    .tiles{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
    .tile .v{font-size:17px}
    .ph{padding:10px 12px}
    .pb{padding:12px 12px 50px}
    .m-grid{gap:8px}
  }
  .cfgrow{display:flex;gap:10px;align-items:center;margin:10px 0;flex-wrap:wrap}
  .cfgrow label{min-width:150px;font-weight:600;font-size:12.5px;color:var(--ink2)}
  .cfgrow input{flex:1;min-width:220px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
  .m-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  @media(max-width:980px){.m-grid{grid-template-columns:1fr}}
  .agrow{display:flex;gap:12px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--grid)}
  .agrow:last-child{border-bottom:none}
  .agdate{min-width:96px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums;font-size:12.5px}
  .agtag{font-size:10.5px;border:1px solid var(--border);border-radius:999px;padding:2px 8px;color:var(--ink2);flex-shrink:0}
  .agsuper{font-size:10.5px;border-radius:999px;padding:2px 8px;background:rgba(220,182,4,.18);color:var(--ink2);font-weight:700;flex-shrink:0}
  .agnext{background:var(--wash);border-radius:10px}
  .agdays{margin-left:auto;color:var(--muted);font-size:11.5px;white-space:nowrap}
  .newsit{padding:9px 10px;border-bottom:1px solid var(--grid)}
  .newsit:last-child{border-bottom:none}
  .newsit a{color:var(--ink);text-decoration:none;font-weight:600;font-size:13px}
  .newsit a:hover{color:var(--link);text-decoration:underline}
  .newsmeta{color:var(--muted);font-size:11.5px;margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .ncchip{display:inline-block;background:var(--wash);color:var(--ink2);border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700}
  .livechip{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;background:var(--wash);color:var(--ink2)}
  /* ---- disclaimer & frescor dos dados ---- */
  .notice{background:var(--wash);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--ink2);margin:0 0 12px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .notice b{color:var(--ink)}
  .notice a{color:var(--link);cursor:pointer;font-weight:700;text-decoration:none;white-space:nowrap}
  .notice a:hover{text-decoration:underline}
  .iovl{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 14px}
  .iovl.on{display:flex}
  .ibox{background:var(--page);border:1px solid var(--border);border-radius:14px;max-width:1020px;width:100%;padding:18px 20px 20px;box-shadow:0 18px 60px rgba(0,0,0,.3);position:relative}
  .ibox h2{margin:0 0 4px;font-size:17px}
  .ibox .x2{position:absolute;top:12px;right:14px}
  .ibox p{font-size:12.5px;color:var(--ink2);line-height:1.55;margin:10px 0}
  .ibox p b{color:var(--ink)}
  .fresh td:first-child{font-weight:600;color:var(--ink)}
  .fresh .live{color:var(--good);font-weight:700}
  .side .all{font-weight:650;padding:7px 10px;border-radius:8px;cursor:pointer}
  .side .all:hover,.side .sec>span:hover,.side .sub>span:hover,.side .seg:hover{background:var(--wash)}
  .side .sec>span,.side .sub>span,.side .seg{display:flex;justify-content:space-between;gap:6px;padding:6px 10px;border-radius:8px;cursor:pointer}
  .side .sec{margin-top:2px}
  .side .sec>span{font-weight:600}
  .side .sub{margin-left:10px}
  .side .sub>span{color:var(--ink2)}
  .side .seg{margin-left:22px;color:var(--ink2);font-size:13px}
  .side .n{color:var(--muted);font-size:12px}
  .side .on{background:var(--wash);color:var(--ink)}
  .side .kids{display:none}
  .side .open>.kids{display:block}
  .main{padding:16px 18px 60px;min-width:0}
  .crumb{color:var(--muted);font-size:12.5px;margin:2px 0 10px}
  .crumb b{color:var(--ink2);font-weight:600}
  .crumb a{cursor:pointer;text-decoration:none}
  .crumb a:hover{color:var(--link);text-decoration:underline}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
  .tile .l{color:var(--muted);font-size:12px}
  .tile .v{font-size:20px;font-weight:650;margin-top:2px}
  .tile .d{font-size:12px;color:var(--muted)}
  table.list{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .listwrap{border-radius:12px;overflow:auto;border:1px solid var(--border)}
  .listwrap table{border:none;min-width:860px}
  table.list th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:right;padding:9px 10px;border-bottom:1px solid var(--grid);cursor:pointer;user-select:none;white-space:nowrap;background:var(--surface);position:sticky;top:0}
  table.list th:first-child{text-align:left}
  table.list td{padding:8px 10px;border-bottom:1px solid var(--grid);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  table.list td:first-child{text-align:left;white-space:normal}
  table.list tr:last-child td{border-bottom:none}
  table.list tbody tr{cursor:pointer}
  table.list tbody tr:hover{background:var(--wash)}
  .nm{font-weight:600}
  .nm .tks{color:var(--muted);font-weight:400;font-size:12px}
  .seglbl{color:var(--muted);font-size:12px}
  .neg{color:var(--bad)} .pos{color:var(--good)}
  .dim{color:var(--muted)}
  /* -------- painel de detalhe -------- */
  .ovl{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:none}
  .ovl.on{display:block}
  .panel{position:fixed;top:0;right:0;bottom:0;width:min(920px,96vw);background:var(--page);z-index:60;transform:translateX(102%);transition:transform .18s ease;overflow-y:auto;border-left:1px solid var(--grid);box-shadow:-12px 0 40px rgba(0,0,0,.18)}
  .panel.on{transform:none}
  .ph{position:sticky;top:0;background:var(--page);border-bottom:1px solid var(--grid);padding:14px 20px;z-index:5}
  .ph .row1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .ph h2{margin:0;font-size:19px;letter-spacing:-.01em}
  .ph .path{color:var(--muted);font-size:12.5px;margin-top:3px}
  .ph .x{position:absolute;top:12px;right:14px}
  .pb{padding:16px 20px 50px}
  .links{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
  .links a{font-size:12.5px;color:var(--link);text-decoration:none;border:1px solid var(--border);padding:5px 10px;border-radius:999px;background:var(--surface);font-weight:600}
  .links a:hover{border-color:#638876;background:var(--wash)}
  .badges{display:flex;gap:6px;flex-wrap:wrap}
  .badge{font-size:11.5px;color:var(--ink2);border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:3px 9px}
  h3.sect{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 8px;font-weight:650}
  .charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px}
  .card .ct{font-size:12.5px;color:var(--ink2);font-weight:600;margin-bottom:6px}
  .qtbl{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;font-size:13px}
  .qtblwrap{border-radius:12px;overflow:auto;border:1px solid var(--border)}
  .qtblwrap table{border:none;min-width:620px}
  .qtbl th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:7px 9px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap}
  .qtbl th:first-child{text-align:left}
  .qtbl td{padding:6px 9px;border-bottom:1px solid var(--grid);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .qtbl td:first-child{text-align:left;color:var(--ink2)}
  .qtbl tr:last-child td{border-bottom:none}
  .note{color:var(--muted);font-size:11.5px;margin-top:8px}
  .tip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.15);padding:7px 10px;font-size:12.5px;z-index:99;display:none}
  .tip b{font-size:13px}
  .tip .k{color:var(--muted)}
  svg text{font:11px system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--muted)}
  svg .val{fill:var(--ink2);font-weight:600}
  .foot{color:var(--muted);font-size:12px;margin-top:26px;border-top:1px solid var(--grid);padding-top:10px}
  .empty{color:var(--muted);padding:30px;text-align:center}

  /* ---- tela de carregamento (identidade do painel) ----
     Cobre o intervalo entre o primeiro pixel e o painel montado. Fica no topo do
     <body> e usa só CSS, para aparecer antes de qualquer script rodar. */
  #boot{position:fixed;inset:0;z-index:9999;background:#0c2a2d;display:flex;
        flex-direction:column;align-items:center;justify-content:center;gap:26px;
        transition:opacity .34s ease}
  #boot.off{opacity:0;pointer-events:none}
  #boot .bl{width:min(66vw,340px);max-width:340px;height:auto;opacity:0;
            animation:blIn .55s ease .05s forwards}
  @keyframes blIn{to{opacity:1}}
  /* candles que sobem em sequência, como o ícone do app */
  #boot .cd{display:flex;align-items:flex-end;gap:9px;height:54px}
  #boot .cd i{display:block;width:9px;border-radius:2px;background:#cbdd7f;
              transform-origin:bottom;animation:cdUp 1.5s ease-in-out infinite}
  #boot .cd i:nth-child(2){background:#dcb604;height:16px;animation-delay:.11s}
  #boot .cd i:nth-child(1){height:22px}
  #boot .cd i:nth-child(3){height:31px;animation-delay:.22s}
  #boot .cd i:nth-child(4){background:#dcb604;height:26px;animation-delay:.33s}
  #boot .cd i:nth-child(5){height:42px;animation-delay:.44s}
  #boot .cd i:nth-child(6){background:#dcb604;height:36px;animation-delay:.55s}
  #boot .cd i:nth-child(7){height:54px;animation-delay:.66s}
  @keyframes cdUp{0%,100%{transform:scaleY(.45);opacity:.45}45%{transform:scaleY(1);opacity:1}}
  #boot .bt{color:#8ba79a;font:500 12.5px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;
            letter-spacing:.09em;text-transform:uppercase}
  @media (prefers-reduced-motion:reduce){
    #boot .cd i{animation:none;transform:none;opacity:.9}
    #boot .bl{animation:none;opacity:1}
  }
</style>
</head>
<body>
<div id="boot" role="status" aria-label="Carregando o Painel B3">
  <img class="bl" alt="Insignia Partners" src="data:image/png;base64,__LOGOBOOT__">
  <div class="cd" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="bt">Painel B3 · carregando</div>
</div>
<script id="dados" type="application/json">__DATA__</script>

<div class="hdr">
<div class="top">
  <img class="logo" alt="Insignia Partners" src="data:image/png;base64,__LOGO__">
  <span class="div"></span>
  <h1>Painel B3</h1>
  <div class="nav"><button id="nav-emp" class="on">Empresas</button><button id="nav-cmp">Comparar</button><button id="nav-etf">ETFs</button><button id="nav-eua">EUA</button><button id="nav-mac">Brasil &amp; Macro</button></div>
  <span class="src" id="srcline"></span>
  <span class="sp"></span>
  <div class="search">
    <input id="q" type="text" placeholder="Buscar empresa ou ticker… (ex.: WEGE3, Sabesp)" autocomplete="off">
    <div class="sugg" id="sugg"></div>
  </div>
  <button class="btn" id="infobtn" title="Fontes, datas de atualização e avisos">ⓘ Dados</button>
  <button class="btn" id="cfgbtn" title="Cotações ao vivo — fontes e chaves opcionais">⚙ Ao vivo</button>
  <button class="btn" id="installbtn" title="Instalar como aplicativo" style="display:none">⬇ Instalar app</button>
  <button class="btn" id="theme" title="Alternar tema">◐ Tema</button>
</div>
<div class="ticker" id="ticker" title="Cotações — passe o mouse para pausar"><div class="tk-track" id="tkt"></div></div>
</div>
<script id="macrodados" type="application/json">__MACRO__</script>
<script id="quotesdados" type="application/json">__QUOTES__</script>
<script id="watchlists" type="application/json">__WATCHLISTS__</script>

<div class="wrap">
  <nav class="side" id="side"></nav>
  <main class="main">
    <div class="crumb" id="crumb"></div>
    <div class="mobsec" id="mobsec"></div>
    <div class="tiles" id="tiles"></div>
    <div class="listwrap"><table class="list" id="list"></table></div>
  </main>
</div>

<main id="macroview"></main>
<main id="etfview"></main>
<main id="euaview"></main>
<main id="cmpview"></main>

<div class="iovl" id="iovl"><div class="ibox" id="ibox" role="dialog" aria-label="Dados, fontes e atualizações"></div></div>

<div class="ovl" id="ovl"></div>
<aside class="panel" id="panel" aria-label="Detalhe da empresa"></aside>
<div class="tip" id="tip"></div>

<script>
"use strict";
const DB = JSON.parse(document.getElementById('dados').textContent);
const COS = DB.companies;
let themeDark = matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
function applyTheme(){ document.documentElement.setAttribute('data-theme', themeDark ? 'dark' : 'light'); }
applyTheme();
document.getElementById('theme').onclick = () => { themeDark = !themeDark; applyTheme(); renderAll(); if(openCvm) openDetail(openCvm); };

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if(cls) e.className = cls; if(txt != null) e.textContent = txt; return e; };
const norm = s => (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const nbr = new Intl.NumberFormat('pt-BR', {maximumFractionDigits:1});
const nbr2 = new Intl.NumberFormat('pt-BR', {maximumFractionDigits:2});
function fmtMi(v){ // v em R$ milhões
  if(v==null) return '—';
  const a = Math.abs(v);
  if(a >= 1e6) return 'R$ ' + nbr.format(v/1e6) + ' tri';
  if(a >= 1e3) return 'R$ ' + nbr.format(v/1e3) + ' bi';
  return 'R$ ' + nbr.format(v) + ' mi';
}
function fmtNum(v){ if(v==null) return '—'; const a=Math.abs(v); if(a>=1e6) return nbr.format(v/1e6)+' tri'; if(a>=1e3) return nbr.format(v/1e3)+' bi'; return nbr.format(v)+' mi'; }
const fmtX = v => v==null ? '—' : nbr.format(v).replace(/ /g,'') + 'x';
const fmtPct = v => v==null ? '—' : nbr.format(v) + '%';
const nbrP = new Intl.NumberFormat('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
const fmtPrice = v => v==null ? '—' : 'R$ ' + nbrP.format(v);
function cls(v){ return v==null ? 'dim' : (v<0 ? 'neg' : ''); }
function med(arr){ const a = arr.filter(x=>x!=null).sort((x,y)=>x-y); if(!a.length) return null; const m = a.length>>1; return a.length%2 ? a[m] : (a[m-1]+a[m])/2; }
function mainTicker(c){ let best=null, bl=-1; for(const t of c.tickers){ const l=t.liq2m||0; if(l>bl){bl=l;best=t;} } return best; }

// ---------- estado ----------
let selSetor=null, selSub=null, selSeg=null, sortKey='mktCap', sortDir=-1, openCvm=null;

// ---------- árvore de setores ----------
function buildTree(){
  const side = $('#side'); side.textContent='';
  const all = el('div','all'); all.append(el('span',null,'Todos os setores'), el('span','n', String(COS.length)));
  all.style.display='flex'; all.style.justifyContent='space-between';
  all.onclick = () => { selSetor=selSub=selSeg=null; renderAll(); };
  side.append(all);
  const tree = {};
  for(const c of COS){
    tree[c.setor] = tree[c.setor] || {n:0, subs:{}};
    tree[c.setor].n++;
    const su = tree[c.setor].subs[c.subsetor] = tree[c.setor].subs[c.subsetor] || {n:0, segs:{}};
    su.n++; su.segs[c.segmento] = (su.segs[c.segmento]||0)+1;
  }
  for(const [setor, s] of Object.entries(tree).sort()){
    const sec = el('div','sec');
    const head = el('span'); head.append(el('span',null,setor), el('span','n',String(s.n)));
    if(selSetor===setor && !selSub) head.classList.add('on');
    head.onclick = () => { selSetor = setor; selSub=selSeg=null; sec.classList.toggle('open', true); renderAll(); };
    const kids = el('div','kids');
    if(selSetor===setor) sec.classList.add('open');
    for(const [sub, su] of Object.entries(s.subs).sort()){
      const subd = el('div','sub');
      const sh = el('span'); sh.append(el('span',null,sub), el('span','n',String(su.n)));
      if(selSub===sub && !selSeg) sh.classList.add('on');
      sh.onclick = (e) => { e.stopPropagation(); selSetor=setor; selSub=sub; selSeg=null; subd.classList.add('open'); renderAll(); };
      const skids = el('div','kids');
      if(selSub===sub) subd.classList.add('open');
      const segs = Object.entries(su.segs).sort();
      if(segs.length>1 || segs[0][0]!==sub){
        for(const [seg, n] of segs){
          const sg = el('div','seg'); sg.append(el('span',null,seg), el('span','n',String(n)));
          if(selSeg===seg && selSub===sub) sg.classList.add('on');
          sg.onclick = (e) => { e.stopPropagation(); selSetor=setor; selSub=sub; selSeg=seg; renderAll(); };
          skids.append(sg);
        }
      }
      subd.append(sh, skids); kids.append(subd);
    }
    sec.append(head, kids); side.append(sec);
  }
}

// ---------- filtro ----------
function filtered(){
  return COS.filter(c =>
    (!selSetor || c.setor===selSetor) &&
    (!selSub || c.subsetor===selSub) &&
    (!selSeg || c.segmento===selSeg));
}

// ---------- tiles agregados ----------
function renderTiles(list){
  const t = $('#tiles'); t.textContent='';
  const mk = list.map(c=>c.ind.mktCap).filter(Boolean);
  const tri26 = list.filter(c=>c.q.some(q=>q.p.startsWith('2026'))).length;
  const tk = list.flatMap(c=>c.tickers);
  const tiles = [
    ['Empresas', String(list.length), selSetor? 'no filtro atual' : 'listadas na B3'],
    ['Com resultado 2026', String(tri26), 'ITR entregue à CVM'],
    ['Valor de mercado', fmtMi(mk.reduce((a,b)=>a+b,0)||null), 'soma das calculáveis'],
    ['P/L mediano', fmtX(med(tk.map(x=>x.pl>0?x.pl:null))), 'tickers com lucro'],
    ['EV/EBITDA mediano', fmtX(med(tk.map(x=>x.evebitda>0?x.evebitda:null))), 'Fundamentus'],
    ['ROE mediano', fmtPct(med(tk.map(x=>x.roe))), 'Fundamentus'],
    ['Div. Yield mediano', fmtPct(med(tk.map(x=>x.dy))), 'Fundamentus'],
  ];
  for(const [l,v,d] of tiles){
    const c = el('div','tile'); c.append(el('div','l',l), el('div','v',v), el('div','d',d)); t.append(c);
  }
}

// ---------- lista ----------
const COLS = [
  ['name','Empresa', c=>null],
  ['cot','Cotação', c=>{const t=mainTicker(c); if(!t) return null; const q=getQ(t.t); return q&&q.p!=null?q.p:t.cot;}],
  ['var','Var. dia', c=>{const t=mainTicker(c); if(!t) return null; const q=getQ(t.t); return q?q.pct:null;}],
  ['mktCap','Valor mercado', c=>c.ind.mktCap],
  ['ev','Valor firma (EV)', c=>evOf(c)],
  ['pl','P/L', c=>{const t=mainTicker(c); return t?t.pl:null;}],
  ['pvp','P/VP', c=>{const t=mainTicker(c); return t?t.pvp:null;}],
  ['evebitda','EV/EBITDA', c=>{const t=mainTicker(c); return t?t.evebitda:null;}],
  ['dy','Div.Yield', c=>{const t=mainTicker(c); return t?t.dy:null;}],
  ['roe','ROE', c=>{const t=mainTicker(c); return t?t.roe:null;}],
  ['roic','ROIC', c=>{const t=mainTicker(c); return t?t.roic:null;}],
  ['dlEbitda','DívLíq/EBITDA', c=>c.ind.dlEbitda],
];
function renderList(list){
  const tbl = $('#list'); tbl.textContent='';
  LISTROWS = [];
  const thead = el('thead'); const hr = el('tr');
  for(const [k,label] of COLS.map(c=>[c[0],c[1]])){
    const th = el('th',null,label + (sortKey===k ? (sortDir<0?' ↓':' ↑') : ''));
    th.onclick = () => { if(sortKey===k) sortDir*=-1; else {sortKey=k; sortDir = k==='name'?1:-1;} renderList(filtered()); };
    hr.append(th);
  }
  thead.append(hr); tbl.append(thead);
  const getter = Object.fromEntries(COLS.map(c=>[c[0],c[2]]));
  const sorted = [...list].sort((a,b)=>{
    if(sortKey==='name') return sortDir * (a.name||'').localeCompare(b.name||'', 'pt-BR');
    const va = getter[sortKey](a), vb = getter[sortKey](b);
    if(va==null && vb==null) return 0; if(va==null) return 1; if(vb==null) return -1;
    return sortDir*(va-vb);
  });
  const tb = el('tbody');
  for(const c of sorted){
    const tr = el('tr');
    const t = mainTicker(c);
    const td0 = el('td');
    const nm = el('div','nm', c.name); nm.append(el('span','tks','  '+c.tickers.map(x=>x.t).join(' · ')));
    td0.append(nm, el('div','seglbl', c.segmento + (c.fin?' · financeiro':'')));
    tr.append(td0);
    const q = t && getQ(t.t);
    const cot = q&&q.p!=null ? q.p : (t&&t.cot);
    const tdc = el('td', cot!=null?'':'dim', fmtPrice(cot));
    const vd = q ? q.pct : null;
    const tdv = el('td', vd==null?'dim':(vd<0?'neg':'pos'), fmtSign(vd));
    tr.append(tdc, tdv);
    if(t) LISTROWS.push({tk:t.t, tdc, tdv});
    tr.append(el('td', c.ind.mktCap?'':'dim', fmtMi(c.ind.mktCap)));
    tr.append(el('td', evOf(c)!=null?'':'dim', fmtMi(evOf(c))));
    tr.append(el('td', cls(t&&t.pl), fmtX(t&&t.pl)));
    tr.append(el('td', cls(t&&t.pvp), fmtX(t&&t.pvp)));
    tr.append(el('td', cls(t&&t.evebitda), c.fin?'—':fmtX(t&&t.evebitda)));
    tr.append(el('td', 'pos', fmtPct(t&&t.dy)));
    tr.append(el('td', cls(t&&t.roe), fmtPct(t&&t.roe)));
    tr.append(el('td', cls(t&&t.roic), c.fin?'—':fmtPct(t&&t.roic)));
    tr.append(el('td', (c.ind.dlEbitda!=null&&c.ind.dlEbitda<0)?'pos':'', c.fin?'—':fmtX(c.ind.dlEbitda)));
    tr.onclick = () => openDetail(c.cvm);
    tb.append(tr);
  }
  if(!sorted.length){ const tr = el('tr'); const td = el('td','empty','Nenhuma empresa neste filtro.'); td.colSpan = COLS.length; tr.append(td); tb.append(tr); }
  tbl.append(tb);
}

// ---------- crumb ----------
function renderCrumb(){
  const c = $('#crumb'); c.textContent='';
  const mk = (label, fn) => { const a = el('a',null,label); a.onclick=fn; return a; };
  c.append(mk('Todos os setores', ()=>{selSetor=selSub=selSeg=null; renderAll();}));
  if(selSetor){ c.append(document.createTextNode('  ›  ')); c.append(mk(selSetor, ()=>{selSub=selSeg=null; renderAll();})); }
  if(selSub){ c.append(document.createTextNode('  ›  ')); c.append(mk(selSub, ()=>{selSeg=null; renderAll();})); }
  if(selSeg){ c.append(document.createTextNode('  ›  ')); const b = el('b',null,selSeg); c.append(b); }
}

function buildMobSec(){ // filtro de setor para telas pequenas (a árvore lateral some < 900px)
  const box = $('#mobsec'); if(!box) return;
  box.textContent='';
  const counts = {};
  for(const c of COS) counts[c.setor] = (counts[c.setor]||0)+1;
  const sel = document.createElement('select');
  sel.setAttribute('aria-label','Filtrar por setor');
  const o0 = el('option',null,'Todos os setores ('+COS.length+')'); o0.value='';
  sel.append(o0);
  for(const s of Object.keys(counts).sort()){
    const o = el('option',null,s+' ('+counts[s]+')'); o.value = s;
    if(selSetor===s) o.selected = true;
    sel.append(o);
  }
  sel.onchange = () => { selSetor = sel.value || null; selSub = selSeg = null; renderAll(); };
  box.append(sel);
}
function renderAll(){ buildTree(); buildMobSec(); renderCrumb(); const f = filtered(); renderTiles(f); renderList(f); }

// ---------- busca ----------
const qin = $('#q'), sugg = $('#sugg');
qin.addEventListener('input', () => {
  const v = norm(qin.value.trim());
  sugg.textContent=''; if(v.length<2){ sugg.style.display='none'; return; }
  const hits = COS.filter(c => norm(c.name).includes(v) || norm(c.fullName).includes(v) ||
    c.root.toLowerCase().includes(v) || c.tickers.some(t=>t.t.toLowerCase().includes(v))).slice(0,12);
  for(const c of hits){
    const d = el('div'); d.append(el('span','nm',c.name), el('span','tk', c.tickers.map(t=>t.t).join(' ')+' · '+c.setor));
    d.onclick = () => { sugg.style.display='none'; qin.value=''; openDetail(c.cvm); };
    sugg.append(d);
  }
  sugg.style.display = hits.length ? 'block' : 'none';
});
document.addEventListener('click', e => { if(!e.target.closest('.search')) sugg.style.display='none'; });

// ---------- gráficos ----------
const tip = $('#tip');
function showTip(x,y,rows){
  tip.textContent='';
  for(const [k,v] of rows){ const d = el('div'); d.append(el('b',null,v), document.createTextNode(' ')); d.append(el('span','k',k)); tip.append(d); }
  tip.style.display='block';
  const w = tip.offsetWidth||120;
  tip.style.left = Math.min(innerWidth-w-12, x+14)+'px'; tip.style.top = (y+14)+'px';
}
function hideTip(){ tip.style.display='none'; }

function colChart(container, data, color, fmt){
  // data: [{p, v}] — colunas finas, base única, cantos 4px no topo, gap ≥2px
  container.textContent='';
  const vals = data.map(d=>d.v).filter(v=>v!=null);
  if(!vals.length){ container.append(el('div','dim','sem dados')); return; }
  const W = Math.max(container.clientWidth||280, 240), H = 150, padL=8, padR=8, padT=14, padB=20;
  const iw = W-padL-padR, ih = H-padT-padB;
  let mx = Math.max(0,...vals), mn = Math.min(0,...vals);
  if(mx===mn){ mx = mx||1; }
  const y = v => padT + ih*(mx-v)/(mx-mn);
  const y0 = y(0);
  const n = data.length;
  const slot = iw/n, bw = Math.min(24, Math.max(6, slot-6));
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.setAttribute('width','100%'); svg.style.display='block';
  const line = (x1,y1,x2,y2,st,swidth) => { const l=document.createElementNS(svg.namespaceURI,'line'); l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);l.setAttribute('stroke',st);l.setAttribute('stroke-width',swidth||1); return l; };
  // gridline no zero (baseline) — recessiva
  svg.append(line(padL, y0, W-padR, y0, 'var(--axis)', 1));
  for(let i=0;i<n;i++){
    const d = data[i];
    const cx = padL + slot*i + slot/2;
    if(d.v!=null){
      const h = Math.abs(y(d.v)-y0);
      const top = d.v>=0 ? y(d.v) : y0;
      const r = Math.min(4, bw/2, h);
      const path = document.createElementNS(svg.namespaceURI,'path');
      const x0 = cx-bw/2, x1b = cx+bw/2;
      let dd;
      if(d.v>=0) dd = `M${x0},${top+h}L${x0},${top+r}Q${x0},${top} ${x0+r},${top}L${x1b-r},${top}Q${x1b},${top} ${x1b},${top+r}L${x1b},${top+h}Z`;
      else dd = `M${x0},${top}L${x1b},${top}L${x1b},${top+h-r}Q${x1b},${top+h} ${x1b-r},${top+h}L${x0+r},${top+h}Q${x0},${top+h} ${x0},${top+h-r}Z`;
      path.setAttribute('d',dd); path.setAttribute('fill',color);
      svg.append(path);
    }
    // hit target maior que a marca
    const hit = document.createElementNS(svg.namespaceURI,'rect');
    hit.setAttribute('x', padL+slot*i); hit.setAttribute('y', 0); hit.setAttribute('width', slot); hit.setAttribute('height', H);
    hit.setAttribute('fill','transparent');
    hit.addEventListener('pointermove', e=>{ showTip(e.clientX,e.clientY, [[d.p, d.v==null?'—':fmt(d.v)]]); });
    hit.addEventListener('pointerleave', hideTip);
    svg.append(hit);
    // rótulos de eixo: só T1 de cada ano p/ respirar
    if(d.p.endsWith('T1') || n<=4){
      const t = document.createElementNS(svg.namespaceURI,'text');
      t.setAttribute('x',cx); t.setAttribute('y',H-5); t.setAttribute('text-anchor','middle');
      t.textContent = d.p.slice(0,4); svg.append(t);
    }
  }
  // rótulo direto: último ponto
  const last = [...data].reverse().find(d=>d.v!=null);
  if(last){
    const cx = padL + slot*data.indexOf(last) + slot/2;
    const t = document.createElementNS(svg.namespaceURI,'text');
    t.setAttribute('class','val');
    t.setAttribute('y', Math.max(10,(last.v>=0? y(last.v)-4 : y(last.v)+12)));
    t.setAttribute('x', Math.min(cx, W-padR-4)); t.setAttribute('text-anchor','middle');
    t.textContent = fmt(last.v); svg.append(t);
  }
  container.append(svg);
}

// ---------- detalhe ----------
const ovl = $('#ovl'), panel = $('#panel');
ovl.onclick = closeDetail;
function closeDetail(){ ovl.classList.remove('on'); panel.classList.remove('on'); openCvm=null; }
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeDetail(); if(typeof closeInfo==='function') closeInfo(); } });

function statTile(label, value, extra, valueCls){
  const c = el('div','tile'); c.append(el('div','l',label));
  const v = el('div','v',value); if(valueCls) v.classList.add(valueCls); c.append(v);
  if(extra) c.append(el('div','d',extra)); return c;
}

function openDetail(cvm){
  const c = COS.find(x=>x.cvm===cvm); if(!c) return;
  openCvm = cvm;
  panel.textContent='';
  // header
  const ph = el('div','ph');
  const x = el('button','btn x','✕ fechar'); x.onclick=closeDetail; ph.append(x);
  const r1 = el('div','row1'); r1.append(el('h2',null,c.name));
  const bd = el('div','badges');
  for(const t of c.tickers){ const bq = el('span','badge', t.t + (t.cot!=null? ' · '+fmtPrice(t.cot):'')); bq.id = 'bq-'+t.t; bd.append(bq); }
  bd.append(el('span','badge', c.listagem));
  r1.append(bd); ph.append(r1);
  ph.append(el('div','path', c.setor+' › '+c.subsetor+' › '+c.segmento+'  ·  '+c.fullName+'  ·  CNPJ '+c.cnpj.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5')));
  const lk = el('div','links');
  const mklink=(href,txt)=>{const a=el('a',null,txt); a.href=href; a.target='_blank'; a.rel='noopener'; return a;};
  lk.append(mklink(c.links.cvm,'Documentos CVM (ITR/DFP/release) ↗'));
  lk.append(mklink('https://www.google.com/search?q='+encodeURIComponent(c.name+' relações com investidores central de resultados'),'Central de resultados / RI ↗'));
  if(c.links.fund) lk.append(mklink(c.links.fund,'Fundamentus ↗'));
  if(c.links.ri) lk.append(mklink(c.links.ri,'Site ↗'));
  ph.append(lk);
  panel.append(ph);

  const pb = el('div','pb');
  // ---- indicadores-chave (12m / balanço)
  pb.append(el('h3','sect','Indicadores — últimos 12 meses e balanço mais recente'));
  const tiles = el('div','tiles');
  const i = c.ind, t = mainTicker(c);
  // tiles com histórico ganham clique (série trimestral no modal)
  const hz = (key, tile) => {
    const s = indSeries(c, key);
    if(s && s.rows.some(r=>r.v!=null)){
      tile.classList.add('cndl'); tile.title = 'clique para ver o histórico por trimestre';
      tile.onclick = () => openIndChart(c, key);
    }
    return tile;
  };
  tiles.append(statTile('Valor de mercado', fmtMi(i.mktCap), i.mktCap?'calculado (ações × cotação)':'sem dado'));
  tiles.append(statTile('Valor da firma (EV)', fmtMi(evOf(c)), evOf(c)!=null?'mercado + dívida líquida':'precisa de mktcap e dívida'));
  tiles.append(statTile('P/L', fmtX(t&&t.pl), 'Fundamentus · '+(t?t.t:'—'), cls(t&&t.pl)));
  tiles.append(statTile('P/VP', fmtX(t&&t.pvp), 'Fundamentus'));
  if(!c.fin){
    tiles.append(statTile('EV/EBITDA', fmtX(t&&t.evebitda), 'Fundamentus · 12m', cls(t&&t.evebitda)));
    tiles.append(statTile('EV/EBIT', fmtX(t&&t.evebit), 'Fundamentus'));
  }
  tiles.append(statTile('Div. Yield', fmtPct(t&&t.dy), 'Fundamentus', 'pos'));
  tiles.append(hz('roe', statTile('ROE', fmtPct(i.roe!=null?i.roe:(t&&t.roe)), i.roe!=null?'CVM · lucro 12m / PL':'Fundamentus', cls(i.roe!=null?i.roe:(t&&t.roe)))));
  if(!c.fin){
    tiles.append(hz('roic', statTile('ROIC', fmtPct(t&&t.roic!=null?t.roic:i.roic), t&&t.roic!=null?'Fundamentus':'CVM (aprox.)', cls(t&&t.roic!=null?t.roic:i.roic))));
    tiles.append(hz('dlEbitda', statTile('Dív. líq./EBITDA', fmtX(i.dlEbitda), 'CVM · 12m', i.dlEbitda!=null&&i.dlEbitda>3?'neg':null)));
    tiles.append(statTile('Dív. líq./Patrimônio', i.dlPl==null?'—':nbr2.format(i.dlPl), 'CVM'));
    tiles.append(hz('mgE', statTile('Margem EBITDA 12m', fmtPct(i.mgE12), 'CVM')));
  }
  tiles.append(hz('mgL', statTile('Margem líquida 12m', fmtPct(i.mgL12), 'CVM', cls(i.mgL12))));
  tiles.append(hz('rev12', statTile('Receita 12m', fmtMi(i.rev12), 'CVM')));
  tiles.append(hz('ni12', statTile('Lucro líquido 12m', fmtMi(i.ni12), 'CVM', cls(i.ni12))));
  pb.append(tiles);

  // ---- candles diários do ticker principal (troca de ticker quando houver mais de um)
  pb.append(el('h3','sect','Cotação — gráfico diário'));
  const cndCard = el('div','card');
  const cndBox = el('div');
  let curTk = t ? t.t : (c.tickers[0] && c.tickers[0].t);
  const drawCnd = () => loadCandles().then(() => {
    if(openCvm !== cvm) return;
    chartUI(curTk, cndBox, null);
  });
  if(c.tickers.length > 1){
    const selrow = el('div','badges'); selrow.style.marginBottom = '8px';
    for(const k of c.tickers){
      const b = el('span','badge cndl', k.t);
      b.onclick = () => { curTk = k.t; drawCnd(); };

function getQ(k){ // melhor cotação disponível para um símbolo (prioridade: B3 ao vivo > Finnhub > robô)
  const b = LIVEB3[k];
  if(freshQ(b)) return {p:b.p, pct:b.pct, cur:'BRL', live:'b3', at:b.at};

  if(freshQ(f)) return {p:f.p, pct:f.pct, cur:'USD', live:'finnhub', at:f.at};
  const s = QSNAP.q && QSNAP.q[k];
  if(s && s.p!=null){
    const pct = (s.pv!=null && s.pv!==0) ? (s.p/s.pv-1)*100 : null;
    return {p:s.p, pct, cur:s.cur, live:null, t:s.t, n:s.n};
  }
  return null;
}

async function pool(items, n, fn){ // concorrência limitada
  let i = 0;
  await Promise.all(Array.from({length: Math.min(n, items.length)}, async () => {
    while(i < items.length){ const k = i++; try{ await fn(items[k]); }catch(e){} }
  }));
}

// ---- B3: API pública do site de cotações (CORS aberto; defasagem ~15 min do pregão)
async function b3quote(t){
  const d = await jj('https://cotacao.b3.com.br/mds/api/v1/instrumentQuotation/'+encodeURIComponent(t));
  const tr = d && d.Trad && d.Trad[0];
  const q = tr && tr.scty && tr.scty.SctyQtn;
  if(!q || q.curPrc==null) return null;
  return {p:q.curPrc, pct:q.prcFlcn, open:q.opngPric, min:q.minPric, max:q.maxPric,
          qty:tr.ttlQty, at:((d.Msg&&d.Msg.dtTm)||'').slice(11,16)};
}
async function b3index(sym){
  const d = await jj('https://cotacao.b3.com.br/mds/api/v1/DailyFluctuationHistory/'+sym);
  const l = d.TradgFlr.scty.lstQtn; const last = l[l.length-1];
  return {pontos:+last.closPric, varDia:+(+last.prcFlcn).toFixed(2), date:d.TradgFlr.date, hora:(last.dtTm||'').slice(0,5)};
}
function meusEtfs(){ return lsGet('meus_etfs') || []; }
function meusUS(){ return lsGet('meus_us') || []; }
function etfLists(){
  const out = {};
  for(const [cat, arr] of Object.entries(WL.etfs_b3 || {})) out[cat] = arr;
  const mine = meusEtfs();
  if(mine.length) out['Meus ETFs'] = mine.map(t => ({t, n:qName(t)}));
  return out;
}
function b3Needed(){ // tickers B3 que precisam de cotação ao vivo agora
  const set = new Set();
  if(document.body.dataset.view === 'etf')
    for(const arr of Object.values(etfLists())) for(const e of arr) set.add(e.t);
  if(openCvm){ const c = COS.find(x=>x.cvm===openCvm); if(c) for(const t of c.tickers) set.add(t.t); }
  return [...set];
}
async function refreshB3(){
  if(document.hidden) return;
  let any = false;
  const [ib, ifx] = await Promise.all([b3index('IBOV').catch(()=>null), b3index('IFIX').catch(()=>null)]);
  if(ib){ LIVEIDX.IBOV = ib; any = true; }
  if(ifx){ LIVEIDX.IFIX = ifx; any = true; }
  const need = b3Needed();
  if(need.length){
    const tok = localStorage.getItem('tok_brapi');
    if(tok){
      try{
        const d = await jj('https://brapi.dev/api/quote/'+need.join(',')+'?token='+encodeURIComponent(tok), 12000);
        for(const r of (d.results||[])){
          if(r.regularMarketPrice==null) continue;
          LIVEB3[r.symbol] = {p:r.regularMarketPrice, pct:r.regularMarketChangePercent,
            open:r.regularMarketOpen, min:r.regularMarketDayLow, max:r.regularMarketDayHigh,
            qty:r.regularMarketVolume, at:hhmm(), ts:Date.now()};
          any = true;
        }
      }catch(e){}
    } else {
      await pool(need, 6, async t => { const q = await b3quote(t); if(q){ LIVEB3[t] = {...q, ts:Date.now()}; any = true; } });
    }
  }
  if(any){ B3LIVE.ok = true; B3LIVE.at = hhmm(); afterQuotes(); }
}

// ---- candles: histórico diário do robô + candle de hoje ao vivo ----
let CANDLES = null, CANDLES_ERR = false, chartSym = null, chartBox = null, chartNote = null, chartDraw = null;
const PERIODS = [['1M',31],['3M',93],['6M',186]];
let chartPrefs = lsGet('chart_prefs') || {p:93, tipo:'candle'};
if(!PERIODS.some(x=>x[1]===chartPrefs.p)) chartPrefs.p = 93;
async function loadCandles(){
  if(CANDLES) return CANDLES;
  try{
    CANDLES = await jj('https://raw.githubusercontent.com/'+REPO+'/main/data/candles.json?v='+Math.floor(Date.now()/36e5), 25000);
    if(!CANDLES || !CANDLES.c) throw new Error('formato');
  }catch(e){ CANDLES = null; CANDLES_ERR = true; }
  return CANDLES;
}
function todayCandle(sym){
  const L = LIVEB3[sym];
  if(freshQ(L) && L.open!=null && L.min!=null && L.max!=null)
    return {t:Math.floor(Date.now()/864e5), o:L.open, h:L.max, l:L.min, c:L.p, parcial:true};
  const q = getQ(sym);
  if(q && q.p!=null && q.pct!=null){
    const pv = q.p/(1+q.pct/100);
    return {t:Math.floor(Date.now()/864e5), o:pv, h:Math.max(q.p,pv), l:Math.min(q.p,pv), c:q.p, parcial:true, aprox:true};
  }
  return null;
}
function candleSeries(sym){
  const hist = (CANDLES && CANDLES.c && CANDLES.c[sym])
    ? CANDLES.c[sym].map(r=>({t:r[0], o:r[1], h:r[2], l:r[3], c:r[4]})) : [];
  const hoje = todayCandle(sym);
  if(hoje){
    const last = hist[hist.length-1];
    if(last && last.t >= hoje.t){ // o histórico já tem o dia: completa com o ao vivo
      last.c = hoje.c; last.h = Math.max(last.h, hoje.h); last.l = Math.min(last.l, hoje.l);
      last.parcial = true; last.aprox = hoje.aprox;
    } else hist.push(hoje);
  }
  return hist;
}
function candleChart(container, rows, tipo){
  container.textContent = '';
  if(!rows || rows.length < 2){ container.append(el('div','dim','sem histórico para este ativo')); return; }
  const W = Math.max(container.clientWidth||600, 320), H = 250, padL=6, padR=52, padT=10, padB=18;
  const iw = W-padL-padR, ih = H-padT-padB;
  let mn = Infinity, mx = -Infinity;
  for(const r of rows){ if(r.l<mn) mn=r.l; if(r.h>mx) mx=r.h; }
  if(!(mx>mn)) mx = mn+1;
  const y = v => padT + ih*(mx-v)/(mx-mn);
  const n = rows.length, slot = iw/n, bw = Math.max(2, Math.min(9, slot*0.65));
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+H); svg.setAttribute('width','100%'); svg.style.display='block';
  const fmtP = v => fmtc2.format(v);
  for(let g=0; g<=3; g++){ // linhas de referência com rótulo à direita
    const v = mn + (mx-mn)*g/3, gy = y(v);
    const l = document.createElementNS(svg.namespaceURI,'line');
    l.setAttribute('x1',padL); l.setAttribute('x2',W-padR); l.setAttribute('y1',gy); l.setAttribute('y2',gy);
    l.setAttribute('stroke','var(--grid)'); svg.append(l);
    const tx = document.createElementNS(svg.namespaceURI,'text');
    tx.setAttribute('x',W-padR+4); tx.setAttribute('y',gy+4); tx.textContent = fmtP(v); svg.append(tx);
  }
  const dtBR = d => new Date(d*864e5).toLocaleDateString('pt-BR',{timeZone:'UTC',day:'2-digit',month:'2-digit'});
  if(tipo === 'linha'){ // visão em linha: fechamento diário
    const path = document.createElementNS(svg.namespaceURI,'path');
    let dd = '';
    for(let i=0; i<n; i++){ const cx = padL + slot*i + slot/2; dd += (i?'L':'M')+cx.toFixed(1)+','+y(rows[i].c).toFixed(1); }
    path.setAttribute('d',dd); path.setAttribute('fill','none');
    path.setAttribute('stroke','var(--s1)'); path.setAttribute('stroke-width','1.8');
    path.setAttribute('stroke-linejoin','round'); svg.append(path);
  }
  let mesAnt = new Date(rows[0].t*864e5).getUTCMonth();
  for(let i=0; i<n; i++){
    const r = rows[i], cx = padL + slot*i + slot/2;
    if(tipo !== 'linha'){
      const cor = r.c >= r.o ? 'var(--good)' : 'var(--bad)';
      const wick = document.createElementNS(svg.namespaceURI,'line');
      wick.setAttribute('x1',cx); wick.setAttribute('x2',cx);
      wick.setAttribute('y1',y(r.h)); wick.setAttribute('y2',y(r.l));
      wick.setAttribute('stroke',cor); svg.append(wick);
      const bt = y(Math.max(r.o,r.c)), bb = y(Math.min(r.o,r.c));
      const body = document.createElementNS(svg.namespaceURI,'rect');
      body.setAttribute('x',cx-bw/2); body.setAttribute('y',bt);
      body.setAttribute('width',bw); body.setAttribute('height',Math.max(1, bb-bt));
      body.setAttribute('fill',cor); body.setAttribute('rx',1);
      if(r.parcial) body.setAttribute('opacity','.75');
      svg.append(body);
    }
    const mes = new Date(r.t*864e5).getUTCMonth();
    if(i>0 && mes!==mesAnt){ mesAnt = mes;
      const tx = document.createElementNS(svg.namespaceURI,'text');
      tx.setAttribute('x',cx); tx.setAttribute('y',H-4); tx.setAttribute('text-anchor','middle');
      tx.textContent = new Date(r.t*864e5).toLocaleDateString('pt-BR',{timeZone:'UTC',month:'short'});
      svg.append(tx);
    }
    const hit = document.createElementNS(svg.namespaceURI,'rect');
    hit.setAttribute('x',padL+slot*i); hit.setAttribute('y',0);
    hit.setAttribute('width',slot); hit.setAttribute('height',H);
    hit.setAttribute('fill','transparent');
    hit.addEventListener('pointermove', e => showTip(e.clientX, e.clientY, [
      [dtBR(r.t)+(r.parcial ? (r.aprox?' · hoje (aprox.)':' · hoje ao vivo') : ''), fmtP(r.c)],
      ['abre '+fmtP(r.o)+' · máx '+fmtP(r.h)+' · mín '+fmtP(r.l), (r.c>=r.o?'▲ ':'▼ ')+fmtc2.format(Math.abs(r.c/r.o-1)*100)+'%'],
    ]));
    hit.addEventListener('pointerleave', hideTip);
    svg.append(hit);
  }
  const last = rows[n-1];
  const tx = document.createElementNS(svg.namespaceURI,'text');
  tx.setAttribute('class','val'); tx.setAttribute('x',W-padR+4);
  tx.setAttribute('y', Math.max(12, Math.min(H-6, y(last.c)-6)));
  tx.textContent = '● '+fmtP(last.c); svg.append(tx);
  container.append(svg);
}
function chartNoteTxt(rows){
  const ult = rows[rows.length-1];
  return 'Diário · histórico do robô'
    + (CANDLES && CANDLES.updatedAt ? ' ('+dmy(CANDLES.updatedAt)+')' : '')
    + (ult && ult.parcial ? (ult.aprox ? ' · hoje ao vivo (abertura aproximada)' : ' · hoje ao vivo com abertura/mín/máx da B3') : '');
}
function chartUI(sym, mount, noteEl){ // controles de visão (período + candles/linha) + gráfico
  mount.textContent = '';
  if(!candleSeries(sym).length){
    const msg = CANDLES_ERR ? 'histórico indisponível no momento — tente de novo em instantes'
                            : 'sem histórico para '+sym+' — o robô diário ainda não coletou este ativo';
    if(noteEl) noteEl.textContent = msg; else mount.append(el('div','dim',msg));
    return null;
  }
  const bar = el('div','badges'); bar.style.margin = '0 0 8px';
  const box = el('div');
  const mk = (lbl, key, apply) => {
    const b = el('span','badge cndl',lbl); b.dataset.k = key;
    b.onclick = () => { apply(); lsSet('chart_prefs', chartPrefs); draw(); };
    bar.append(b);
  };
  for(const [lbl,days] of PERIODS) mk(lbl, 'p'+days, () => { chartPrefs.p = days; });
  mk('Candles','tcandle', () => { chartPrefs.tipo = 'candle'; });
  mk('Linha','tlinha', () => { chartPrefs.tipo = 'linha'; });
  const draw = () => {
    const all = candleSeries(sym);
    const corte = Math.floor(Date.now()/864e5) - chartPrefs.p;
    let rows = all.filter(r => r.t >= corte);
    if(rows.length < 2) rows = all;
    if(noteEl) noteEl.textContent = chartNoteTxt(rows);
    candleChart(box, rows, chartPrefs.tipo);
    for(const b of bar.children)
      b.classList.toggle('on', b.dataset.k === 'p'+chartPrefs.p || b.dataset.k === 't'+chartPrefs.tipo);
  };
  mount.append(bar, box);
  draw();
  return draw;
}
async function openChart(sym, titulo){
  modalKind = 'chart'; chartSym = sym;
  ibox.textContent = '';
  const x = el('button','btn x2','✕ fechar'); x.onclick = closeInfo; ibox.append(x);
  ibox.append(el('h2',null,titulo));
  chartNote = el('div','note','carregando histórico…'); ibox.append(chartNote);
  chartBox = el('div'); chartBox.style.marginTop = '8px'; ibox.append(chartBox);
  iovl.classList.add('on');
  await loadCandles();
  if(modalKind !== 'chart' || chartSym !== sym) return; // usuário fechou/trocou
  refreshB3charts(sym); // busca o ao vivo deste símbolo se for B3
  chartDraw = chartUI(sym, chartBox, chartNote); // desenho direto: rAF não dispara com a aba em 2º plano
}
async function refreshB3charts(sym){ // candle de hoje mais rico p/ ativos B3 abertos no gráfico
  if(/^[A-Z]{4}[0-9]{1,2}$/.test(sym) && !LIVEB3[sym]){
    try{ const q = await b3quote(sym); if(q){ LIVEB3[sym] = {...q, ts:Date.now()}; redrawChart(); } }catch(e){}
  }
}
function redrawChart(){
  if(modalKind === 'chart' && typeof chartDraw === 'function') chartDraw();
}

// ================= VALOR DA FIRMA, HISTÓRICO DE INDICADORES, NOTÍCIAS, COMPARAR =================
function evOf(c){ // valor da firma = valor de mercado + dívida líquida (R$ mi)
  if(c.ind && c.ind.ev != null) return c.ind.ev;
  if(c.ind && c.ind.mktCap != null && c.bal && c.bal.divL != null) return +(c.ind.mktCap + c.bal.divL).toFixed(1);
  return null;
}

// ---- séries históricas de indicadores (CVM trimestral + histórico de balanço "bh")
const QE_MAP = {'1':'03-31','2':'06-30','3':'09-30','4':'12-31'};
const MES_Q = {'03':'1','06':'2','09':'3','12':'4'};
function indSeries(c, key){
  // séries direto do histórico de balanço (não dependem de DRE)
  const bhRows = f => (c.bh||[]).map(b => ({p: b.dt.slice(0,4)+'T'+MES_Q[b.dt.slice(5,7)], v: b[f]!=null? b[f] : null}));
  if(key==='plBal')   return {rows:bhRows('pl'),   fmt:fmtNum, titulo:'Patrimônio líquido por trimestre (R$)', nota:'CVM (balanços)'};
  if(key==='divLBal') return {rows:bhRows('divL'), fmt:fmtNum, titulo:'Dívida líquida por trimestre (R$)', nota:'CVM (balanços)'};
  if(key==='ativoBal')return {rows:bhRows('ativo'),fmt:fmtNum, titulo:'Ativo total por trimestre (R$)', nota:'CVM (balanços)'};
  const q = c.q || [];
  if(!q.length) return null;
  const pn = p => (+p.slice(0,4))*4 + (+p.slice(5)); // 2026T2 -> posição sequencial
  const byP = {}; for(const x of q) byP[pn(x.p)] = x;
  const roll = f => q.map(x => { // soma móvel de 4 TRIMESTRES CONSECUTIVOS (lacuna de entrega => null)
    const n0 = pn(x.p); let s = 0;
    for(let k = n0-3; k <= n0; k++){
      const it = byP[k];
      if(!it || it[f]==null) return null;
      s += it[f];
    }
    return +s.toFixed(1);
  });
  const balAt = p => {
    if(!c.bh || !c.bh.length) return null;
    return c.bh.find(b => b.dt === p.slice(0,4)+'-'+QE_MAP[p.slice(5)]) || null;
  };
  const mk = f => q.map(x=>({p:x.p, v:x[f]!=null?x[f]:null}));
  const rows12 = arr => q.map((x,i)=>({p:x.p, v:arr[i]}));
  const p1 = v => v==null?null:+v.toFixed(1);
  switch(key){
    case 'mgE':  return {rows:mk('mgE'),  fmt:fmtPct, titulo:'Margem EBITDA por trimestre', nota:'CVM (ITR/DFP)'};
    case 'mgL':  return {rows:mk('mgL'),  fmt:fmtPct, titulo:'Margem líquida por trimestre', nota:'CVM (ITR/DFP)'};
    case 'rev12':{ return {rows:rows12(roll('rev')), fmt:fmtNum, titulo:'Receita acumulada 12 meses (R$)', nota:'CVM · soma móvel de 4 trimestres'}; }
    case 'ebitda12':{ return {rows:rows12(roll('ebitda')), fmt:fmtNum, titulo:'EBITDA acumulado 12 meses (R$)', nota:'CVM · soma móvel de 4 trimestres'}; }
    case 'ni12': { return {rows:rows12(roll('ni')),  fmt:fmtNum, titulo:'Lucro líquido acumulado 12 meses (R$)', nota:'CVM · soma móvel de 4 trimestres'}; }
    case 'roe':  { const r=roll('ni');
      return {rows:q.map((x,i)=>{ const b=balAt(x.p); return {p:x.p, v:(b&&b.pl&&r[i]!=null)? p1(100*r[i]/b.pl):null}; }),
              fmt:fmtPct, titulo:'ROE — lucro 12m ÷ PL do trimestre', nota:'CVM · precisa do histórico de balanço'}; }
    case 'roic': { const r=roll('ebit');
      return {rows:q.map((x,i)=>{ const b=balAt(x.p);
        if(!b||b.pl==null||r[i]==null) return {p:x.p,v:null};
        const inv=b.pl+Math.max(b.divL||0,0);
        return {p:x.p, v:inv? p1(100*(r[i]*0.66)/inv):null}; }),
              fmt:fmtPct, titulo:'ROIC — EBIT 12m × (1−34%) ÷ capital investido', nota:'CVM · aproximação'}; }
    case 'dlEbitda': { const r=roll('ebitda');
      return {rows:q.map((x,i)=>{ const b=balAt(x.p); return {p:x.p, v:(b&&b.divL!=null&&r[i])? +(b.divL/r[i]).toFixed(2):null}; }),
              fmt:fmtX, titulo:'Dívida líquida ÷ EBITDA 12m', nota:'CVM'}; }
  }
  return null;
}
function openIndChart(c, key){
  const s = indSeries(c, key);
  if(!s || !s.rows.some(r=>r.v!=null)) return;
  modalKind = 'chart'; chartDraw = null; chartSym = null;
  ibox.textContent = '';
  const x = el('button','btn x2','✕ fechar'); x.onclick = closeInfo; ibox.append(x);

  ibox.append(el('div','note','Fonte: '+s.nota+' · série disponível desde que a empresa entrega ITR/DFP no período coberto pelo painel.'));
  const box = el('div'); box.style.marginTop = '10px'; ibox.append(box);
  iovl.classList.add('on');

}

// ---- ferramentas de consultor: copiar dados (Excel) e baixar gráfico em PNG ----
const numBR = v => v==null ? '' : String(v).replace('.', ','); // decimal pt-BR p/ colar no Excel
async function copiaTSV(headers, linhas, btn){
  const tsv = headers.join('\t')+'\n'+linhas.map(l => l.map(numBR).join('\t')).join('\n');
  try{ await navigator.clipboard.writeText(tsv); if(btn){ const o = btn.textContent; btn.textContent = '✓ copiado'; setTimeout(()=>btn.textContent = o, 1600); } }
  catch(e){ if(btn) btn.textContent = 'falhou — permita a área de transferência'; }
}
function svgToPng(svgEl, nome){
  const clone = svgEl.cloneNode(true);
  const orig = svgEl.querySelectorAll('*'), cl = clone.querySelectorAll('*');
  for(let i=0; i<orig.length; i++){ // resolve cores var(--x) para valores concretos
    const cs = getComputedStyle(orig[i]);
    for(const a of ['fill','stroke']){
      const v = orig[i].getAttribute(a);
      if(v && v.indexOf('var(') === 0) cl[i].setAttribute(a, cs[a==='fill'?'fill':'stroke']);
    }
    if(orig[i].tagName === 'text'){
      cl[i].setAttribute('fill', cs.fill);
      cl[i].setAttribute('font-family', 'Arial, sans-serif');
      cl[i].setAttribute('font-size', cs.fontSize);
      if(cs.fontWeight && +cs.fontWeight >= 600) cl[i].setAttribute('font-weight', '700');
    }
  }
  const vb = svgEl.viewBox.baseVal, scale = 2;
  clone.setAttribute('width', vb.width); clone.setAttribute('height', vb.height);
  const bg = document.createElementNS(svgEl.namespaceURI,'rect');
  bg.setAttribute('x',0); bg.setAttribute('y',0); bg.setAttribute('width',vb.width); bg.setAttribute('height',vb.height);
  bg.setAttribute('fill', getComputedStyle(document.body).backgroundColor);
  clone.insertBefore(bg, clone.firstChild);
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement('canvas');
    cv.width = vb.width*scale; cv.height = vb.height*scale;
    const ctx = cv.getContext('2d'); ctx.scale(scale,scale); ctx.drawImage(img,0,0);
    cv.toBlob(bl => { const a = document.createElement('a'); a.href = URL.createObjectURL(bl);
      a.download = nome.replace(/[^\wÀ-ú .-]+/g,'_')+'.png'; a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href), 5000); });
  };
  img.src = 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(clone));
}
function chartTools(getSvg, getTabela, nome){ // barra com "copiar p/ Excel" e "baixar PNG"
  const bar = el('div'); bar.style.cssText = 'display:flex;gap:8px;margin:8px 0 0;flex-wrap:wrap';
  const b1 = el('button','btn','⧉ copiar dados (Excel)');
  b1.onclick = () => { const t = getTabela(); if(t) copiaTSV(t.headers, t.linhas, b1); };
  const b2 = el('button','btn','⬇ baixar gráfico (PNG)');
  b2.onclick = () => { const s = getSvg(); if(s) svgToPng(s, nome()); };
  bar.append(b1, b2);
  return bar;
}
function tabelaValores(headers, linhas){ // tabela de números junto do gráfico
  const w = el('div','qtblwrap'); w.style.marginTop = '10px';
  const t = el('table','qtbl');
  const hr = el('tr'); for(const h of headers) hr.append(el('th',null,h));
  const th = el('thead'); th.append(hr); t.append(th);
  const tb = el('tbody');
  for(const ln of linhas){ const tr = el('tr'); for(const v of ln) tr.append(el('td',null, v==null?'—':String(v))); tb.append(tr); }
  t.append(tb); w.append(t);
  return w;
}

// ---- gráfico de linhas multi-empresa (comparar históricos) ----
const SERIE_CORES = ['var(--s1)','var(--s2)','var(--s3)','var(--good)'];
function multiLineChart(container, series, fmt){
  container.textContent = '';
  const ok = series.filter(s => s.rows.some(r => r.v!=null));
  if(!ok.length){ container.append(el('div','dim','sem dados para as empresas escolhidas')); return; }
  const perAll = [...new Set(ok.flatMap(s => s.rows.filter(r=>r.v!=null).map(r => r.p)))].sort();
  const leg = el('div'); leg.style.cssText = 'display:flex;gap:14px;flex-wrap:wrap;margin:0 0 6px;font-size:12px';
  ok.forEach((s,i) => { const it = el('span'); it.style.fontWeight = '600';
    const dot = el('span','', '● '); dot.style.color = ''; it.append(dot, document.createTextNode(s.label));
    dot.style.cssText = 'color:'+SERIE_CORES[i%SERIE_CORES.length]; leg.append(it); });
  container.append(leg);
  const W = Math.max(container.clientWidth||760, 320), H = 260, padL = 8, padR = 56, padT = 10, padB = 20;
  const iw = W-padL-padR, ih = H-padT-padB;
  let mn = Infinity, mx = -Infinity;
  for(const s of ok) for(const r of s.rows) if(r.v!=null){ if(r.v<mn) mn=r.v; if(r.v>mx) mx=r.v; }
  if(!(mx>mn)){ mx = mn+1; }
  const y = v => padT + ih*(mx-v)/(mx-mn);
  const xOf = p => padL + iw*(perAll.indexOf(p)+0.5)/perAll.length;
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+H); svg.setAttribute('width','100%'); svg.style.display='block';
  for(let g=0; g<=3; g++){
    const v = mn+(mx-mn)*g/3, gy = y(v);
    const l = document.createElementNS(svg.namespaceURI,'line');
    l.setAttribute('x1',padL); l.setAttribute('x2',W-padR); l.setAttribute('y1',gy); l.setAttribute('y2',gy);
    l.setAttribute('stroke','var(--grid)'); svg.append(l);
    const tx = document.createElementNS(svg.namespaceURI,'text');
    tx.setAttribute('x',W-padR+4); tx.setAttribute('y',gy+4); tx.textContent = fmt(v); svg.append(tx);
  }
  for(const p of perAll){ if(p.endsWith('T1') || perAll.length<=5){
    const tx = document.createElementNS(svg.namespaceURI,'text');
    tx.setAttribute('x',xOf(p)); tx.setAttribute('y',H-4); tx.setAttribute('text-anchor','middle');
    tx.textContent = p; svg.append(tx); } }
  ok.forEach((s,i) => {
    let dd = '', pen = false;
    for(const p of perAll){
      const r = s.rows.find(x => x.p===p);
      if(!r || r.v==null){ pen = false; continue; }
      dd += (pen?'L':'M')+xOf(p).toFixed(1)+','+y(r.v).toFixed(1); pen = true;
    }
    const path = document.createElementNS(svg.namespaceURI,'path');
    path.setAttribute('d',dd); path.setAttribute('fill','none');
    path.setAttribute('stroke',SERIE_CORES[i%SERIE_CORES.length]); path.setAttribute('stroke-width','2');
    path.setAttribute('stroke-linejoin','round'); svg.append(path);
  });
  for(const p of perAll){ // tooltip por período com todas as séries
    const hit = document.createElementNS(svg.namespaceURI,'rect');
    hit.setAttribute('x',xOf(p)-iw/perAll.length/2); hit.setAttribute('y',0);
    hit.setAttribute('width',iw/perAll.length); hit.setAttribute('height',H);
    hit.setAttribute('fill','transparent');
    hit.addEventListener('pointermove', e => showTip(e.clientX, e.clientY,
      [[p,'']].concat(ok.map(s => { const r = s.rows.find(x=>x.p===p); return [s.label, r&&r.v!=null? fmt(r.v):'—']; }))));
    hit.addEventListener('pointerleave', hideTip);
    svg.append(hit);
  }
  container.append(svg);
}

// ---- gráfico de barras horizontais (comparações) ----
function hbarChart(container, rows, fmt, onclickRow){
  container.textContent = '';
  if(!rows.length){ container.append(el('div','dim','sem dados para este filtro')); return; }
  const W = Math.max(container.clientWidth||760, 320);
  const rowH = 26, padT = 4, padB = 4;
  const labelW = Math.min(230, Math.round(W*0.34)), valW = 90;
  const H = padT + padB + rows.length*rowH;
  const iw = Math.max(40, W - labelW - valW - 14);
  const maxV = Math.max(...rows.map(r=>Math.abs(r.v))) || 1;
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+H); svg.setAttribute('width','100%'); svg.style.display='block';
  rows.forEach((r,i)=>{
    const y = padT + i*rowH;
    const t = document.createElementNS(svg.namespaceURI,'text');

    bar.setAttribute('x',labelW); bar.setAttribute('y',y+4);

    v.setAttribute('x',labelW+bw+6); v.setAttribute('y',y+17); v.setAttribute('class','val');

      hit.setAttribute('fill','transparent'); hit.style.cursor='pointer';
      hit.addEventListener('click', ()=>onclickRow(r.cvm));
      svg.append(hit);
    }
  });
  container.append(svg);
}

function peersAll(){ const p = lsGet('peer_sets'); return (p && typeof p === 'object' && !Array.isArray(p)) ? p : {}; }
function peersSave(nome, cvms){

function peerLink(nome, cvms){

// lê o peer set da URL — usado no init e quando o usuário cola um link
function peerFromHash(){
  const h = location.hash || '';
  const m = h.match(/^#peer=([^|]*)\|(.+)$/);
  if(!m) return null;
  let nome; try{ nome = decodeURIComponent(m[1]); }catch(e){ nome = m[1]; }
  const cvms = m[2].split(',').map(s=>s.trim()).filter(s=>/^[0-9]+$/.test(s) && COS.some(c=>c.cvm===s)).slice(0,PEER_MAX);
  return cvms.length ? {nome: nome.slice(0,40), cvms} : null;
}

// ================= estatísticas de série (CAGR, média, extremos) =================
// CAGR só faz sentido em série de nível positivo (receita, EBITDA). Em indicador
// que já é percentual ou múltiplo, ou que tenha valor <= 0, devolve null em vez de
// um número sem significado.
function estat(rows, permiteCagr){
  const vs = (rows||[]).filter(r=>r && r.v!=null && isFinite(r.v));
  if(!vs.length) return null;
  const nums = vs.map(r=>r.v);
  const ini = vs[0], fim = vs[vs.length-1];
  const anos = vs.length>1 ? (pNum(fim.p) - pNum(ini.p))/4 : 0;
  let cagr = null;
  if(permiteCagr && anos >= 0.9 && ini.v > 0 && fim.v > 0)
    cagr = (Math.pow(fim.v/ini.v, 1/anos) - 1) * 100;
  return {
    n: vs.length, ini, fim, anos,
    cagr,
    media: nums.reduce((a,b)=>a+b,0)/nums.length,
    mediana: med(nums),
    min: Math.min(...nums), max: Math.max(...nums),
    varTotal: (ini.v !== 0 && ini.v != null) ? (fim.v/ini.v - 1)*100 : null,
  };
}
const pNum = p => (+String(p).slice(0,4))*4 + (+String(p).slice(5) || 0);

// unidade canônica: impede comparar % com valor absoluto na mesma barra
function unidadeCanon(u){
  const s = (u||'').toLowerCase();
  if(!s) return '(sem unidade)';
  if(s.includes('%') || s.includes('p.p')) return '%';
  if(s.includes('r$')) return 'R$';
  if(s.includes('us$') || s.includes('usd')) return 'US$';
  if(/\bx\b|vezes/.test(s)) return 'x (múltiplo)';
  if(s.includes('ton')) return 'toneladas';
  if(s.includes('m³') || s.includes('m3')) return 'm³';
  if(s.includes('gwh') || s.includes('mwh') || s.includes('mw')) return 'energia';
  if(s.includes('milh') || s.includes('mil ') || s.includes('unidades')) return 'quantidade';
  return s.slice(0,18);
}
function opsIndex(){
  const idx = {};   // família -> [{cvm, empresa, setor, nomeOriginal, unidade, valores}]
  if(!OPD) return idx;
  for(const [cvm, o] of Object.entries(OPD)){
    if(cvm.startsWith('_') || !o || !Array.isArray(o.indicadores)) continue;
    const emp = COS.find(c=>c.cvm===cvm); if(!emp) continue;
    for(const ind of o.indicadores){
      if(!ind || !ind.nome || !ind.valores) continue;
      const fam = kpiFamilia(ind.nome);
      (idx[fam] = idx[fam] || []).push({cvm, empresa:emp.name, setor:emp.setor,
        nomeOriginal:ind.nome, unidade:ind.unidade||'', uc:unidadeCanon(ind.unidade), valores:ind.valores});
    }
  }
  return idx;
}
