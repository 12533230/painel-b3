// ---- ferramentas de consultor: copiar dados (Excel) e baixar gráfico em PNG ----
// Só NÚMERO recebe vírgula decimal. Aplicado a todas as células, o conversor
// corrompia nome de empresa com ponto: "SUZANO S.A." saía "SUZANO S,A." e
// "Petróleo. Gás e Biocombustíveis" virava "Petróleo, Gás e Biocombustíveis".
const numBR = v => v==null ? '' : (typeof v === 'number' ? String(v).replace('.', ',') : String(v));
async function copiaTSV(headers, linhas, btn){
  const tsv = headers.join('\t')+'\n'+linhas.map(l => l.map(numBR).join('\t')).join('\n');
  // O rótulo original é guardado no próprio elemento na PRIMEIRA vez. Lendo-o do
  // textContent a cada clique, dois cliques em menos de 1,6 s faziam o botão
  // guardar "✓ copiado" como se fosse o rótulo e ficar preso nele para sempre —
  // e no caminho de erro o rótulo nunca voltava.
  if(btn && !btn.dataset.lbl) btn.dataset.lbl = btn.textContent;
  const volta = () => { if(btn) btn.textContent = btn.dataset.lbl; };
  if(btn && btn._tmr) clearTimeout(btn._tmr);
  try{
    await navigator.clipboard.writeText(tsv);
    if(btn){ btn.textContent = '✓ copiado'; btn._tmr = setTimeout(volta, 1600); }
  }
  catch(e){
    if(btn){ btn.textContent = 'falhou — permita a área de transferência';
             btn._tmr = setTimeout(volta, 4000); }
  }
}
function svgToPng(svgEl, nome){
  const clone = svgEl.cloneNode(true);
  const orig = svgEl.querySelectorAll('*'), cl = clone.querySelectorAll('*');
  for(let i=0; i<orig.length; i++){ // resolve cores var(--x) para valores concretos
    const cs = getComputedStyle(orig[i]);
    for(const a of ['fill','stroke']){
      const v = orig[i].getAttribute(a);
      if(v && v.indexOf('var(') === 0) cl[i].setAttribute(a, cs[a==='fill'?'fill':'stroke']);
    }
    if(orig[i].tagName === 'text'){
      cl[i].setAttribute('fill', cs.fill);
      cl[i].setAttribute('font-family', 'Arial, sans-serif');
      cl[i].setAttribute('font-size', cs.fontSize);
      if(cs.fontWeight && +cs.fontWeight >= 600) cl[i].setAttribute('font-weight', '700');
    }
  }
  const vb = svgEl.viewBox.baseVal, scale = 2;
  clone.setAttribute('width', vb.width); clone.setAttribute('height', vb.height);
  const bg = document.createElementNS(svgEl.namespaceURI,'rect');
  bg.setAttribute('x',0); bg.setAttribute('y',0); bg.setAttribute('width',vb.width); bg.setAttribute('height',vb.height);
  bg.setAttribute('fill', getComputedStyle(document.body).backgroundColor);
  clone.insertBefore(bg, clone.firstChild);
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement('canvas');
    cv.width = vb.width*scale; cv.height = vb.height*scale;
    const ctx = cv.getContext('2d'); ctx.scale(scale,scale); ctx.drawImage(img,0,0);
    cv.toBlob(bl => { const a = document.createElement('a'); a.href = URL.createObjectURL(bl);
      a.download = nome.replace(/[^\wÀ-ú .-]+/g,' ').replace(/\s+/g,' ').trim().replace(/ /g,'_')+'.png'; a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href), 5000); });
  };
  img.src = 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(clone));
}
function chartTools(getSvg, getTabela, nome){ // barra com "copiar p/ Excel" e "baixar PNG"
  const bar = el('div'); bar.style.cssText = 'display:flex;gap:8px;margin:8px 0 0;flex-wrap:wrap';
  const b1 = el('button','btn','⧉ copiar dados (Excel)');
  b1.onclick = () => { const t = getTabela(); if(t) copiaTSV(t.headers, t.linhas, b1); };
  const b2 = el('button','btn','⬇ baixar gráfico (PNG)');
  b2.onclick = () => { const s = getSvg(); if(s) svgToPng(s, nome()); };
  bar.append(b1, b2);
  return bar;
}
function tabelaValores(headers, linhas){ // tabela de números junto do gráfico
  const w = el('div','qtblwrap'); w.style.marginTop = '10px';
  const t = el('table','qtbl');
  const hr = el('tr'); for(const h of headers) hr.append(el('th',null,h));
  const th = el('thead'); th.append(hr); t.append(th);
  const tb = el('tbody');
  for(const ln of linhas){ const tr = el('tr'); for(const v of ln) tr.append(el('td',null, v==null?'—':String(v))); tb.append(tr); }
  t.append(tb); w.append(t);
  return w;
}

// ---- gráfico de linhas multi-empresa (comparar históricos) ----
const SERIE_CORES = ['var(--s1)','var(--s2)','var(--s3)','var(--good)'];
function multiLineChart(container, series, fmt){
  container.textContent = '';
  const ok = series.filter(s => s.rows.some(r => r.v!=null));
  if(!ok.length){ container.append(el('div','dim','sem dados para as empresas escolhidas')); return; }
  const perAll = [...new Set(ok.flatMap(s => s.rows.filter(r=>r.v!=null).map(r => r.p)))].sort();
  const leg = el('div'); leg.style.cssText = 'display:flex;gap:14px;flex-wrap:wrap;margin:0 0 6px;font-size:12px';
  ok.forEach((s,i) => { const it = el('span'); it.style.fontWeight = '600';
    const dot = el('span','', '● '); dot.style.color = ''; it.append(dot, document.createTextNode(s.label));
    dot.style.cssText = 'color:'+SERIE_CORES[i%SERIE_CORES.length]; leg.append(it); });
  container.append(leg);
  const W = Math.max(container.clientWidth||760, 320), H = 260, padL = 8, padR = 56, padT = 10, padB = 20;
  const iw = W-padL-padR, ih = H-padT-padB;
  let mn = Infinity, mx = -Infinity;
  for(const s of ok) for(const r of s.rows) if(r.v!=null){ if(r.v<mn) mn=r.v; if(r.v>mx) mx=r.v; }
  if(!(mx>mn)){ mx = mn+1; }
  const y = v => padT + ih*(mx-v)/(mx-mn);
  const xOf = p => padL + iw*(perAll.indexOf(p)+0.5)/perAll.length;
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+H); svg.setAttribute('width','100%'); svg.style.display='block';
  for(let g=0; g<=3; g++){
    const v = mn+(mx-mn)*g/3, gy = y(v);
    const l = document.createElementNS(svg.namespaceURI,'line');
    l.setAttribute('x1',padL); l.setAttribute('x2',W-padR); l.setAttribute('y1',gy); l.setAttribute('y2',gy);
    l.setAttribute('stroke','var(--grid)'); svg.append(l);
    const tx = document.createElementNS(svg.namespaceURI,'text');
    tx.setAttribute('x',W-padR+4); tx.setAttribute('y',gy+4); tx.textContent = fmt(v); svg.append(tx);
  }
  for(const p of perAll){ if(p.endsWith('T1') || perAll.length<=5){
    const tx = document.createElementNS(svg.namespaceURI,'text');
    tx.setAttribute('x',xOf(p)); tx.setAttribute('y',H-4); tx.setAttribute('text-anchor','middle');
    tx.textContent = p; svg.append(tx); } }
  ok.forEach((s,i) => {
    let dd = '', pen = false;
    for(const p of perAll){
      const r = s.rows.find(x => x.p===p);
      if(!r || r.v==null){ pen = false; continue; }
      dd += (pen?'L':'M')+xOf(p).toFixed(1)+','+y(r.v).toFixed(1); pen = true;
    }
    const path = document.createElementNS(svg.namespaceURI,'path');
    path.setAttribute('d',dd); path.setAttribute('fill','none');
    path.setAttribute('stroke',SERIE_CORES[i%SERIE_CORES.length]); path.setAttribute('stroke-width','2');
    path.setAttribute('stroke-linejoin','round'); svg.append(path);
  });
  for(const p of perAll){ // tooltip por período com todas as séries
    const hit = document.createElementNS(svg.namespaceURI,'rect');
    hit.setAttribute('x',xOf(p)-iw/perAll.length/2); hit.setAttribute('y',0);
    hit.setAttribute('width',iw/perAll.length); hit.setAttribute('height',H);
    hit.setAttribute('fill','transparent');
    hit.addEventListener('pointermove', e => showTip(e.clientX, e.clientY,
      [[p,'']].concat(ok.map(s => { const r = s.rows.find(x=>x.p===p); return [s.label, r&&r.v!=null? fmt(r.v):'—']; }))));
    hit.addEventListener('pointerleave', hideTip);
    svg.append(hit);
  }
  container.append(svg);
}

// ---- notícias por empresa (data/news.json, robô de 2h em 2h) e curadorias manuais
let NEWSD = null, SEGD = null, OPD = null, NEWSMAC = null;
// Bucket de 10 min no cache-buster: o robô publica notícia a cada 2h e o
// raw.githubusercontent guarda ~5 min. Com o bucket de 1 hora que havia antes, o
// navegador podia segurar o arquivo por uma hora depois de ele já ter mudado.
const vBucket = () => Math.floor(Date.now()/6e5);
const rawData = (branch, arq) => 'https://raw.githubusercontent.com/'+REPO+'/'+branch+'/data/'+arq+'?v='+vBucket();
// idade de uma data ISO, em dias e em texto
const diasDesde = iso => { if(!iso) return null;
  const t = Date.parse(String(iso).length<=10 ? iso+'T12:00:00Z' : iso);
  return isNaN(t) ? null : Math.floor((Date.now()-t)/864e5); };
const horasDesde = iso => { if(!iso) return null; const t = Date.parse(iso);
  return isNaN(t) ? null : (Date.now()-t)/36e5; };
const idadeTxt = d => d==null ? '' : d<=0 ? 'hoje' : d===1 ? 'ontem' : 'há '+d+' dias';
const hhmmDe = iso => { try{
    return new Date(iso).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo',
      day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+' (Brasília)';
  }catch(e){ return String(iso||'').slice(0,16).replace('T',' '); } };
// Memória com validade: sem isso, aba (ou app) que fica aberta guardava o
// news.json do instante do carregamento PARA SEMPRE — o robô publicava de 2 em 2
// horas e a tela nunca via.
let NEWSD_EM = 0;
const NEWS_TTL_MS = 15*60*1000;
async function loadNews(forcar){
  if(NEWSD && !forcar && (Date.now() - NEWSD_EM) < NEWS_TTL_MS) return NEWSD;
  // branch "news" é atualizado a cada 2 horas; main é a reserva do build diário
  for(const br of ['news','main']){
    try{
      const d = await jj(rawData(br,'news.json'), 20000);
      if(d && d.n){ d.origem = br; NEWSD = d; NEWSD_EM = Date.now(); break; }
    }catch(e){}
  }
  // Registra a falha de LEITURA: antes, os dois branches falhando devolviam um
  // objeto sem updatedAt, e nem a faixa de aviso nem a tabela ⓘ tinham como saber
  // que a notícia não carregou — a tela dizia "carrega ao abrir uma empresa".
  if(!NEWSD) NEWSD = {n:{}, origem:null, erroEm:Date.now()};
  renderAvisoIdade();
  return NEWSD;
}
// releitura periódica: notícia e manchete voltam a mudar sozinhas na tela
async function refreshNoticias(){
  if(document.hidden) return;
  const antesN = NEWSD && NEWSD.updatedAt, antesM = MACRO.noticiasAoVivoEm;
  if(NEWSD) await loadNews(true);           // só relê o que já foi carregado uma vez
  newsMacTentou = false; NEWSMAC = null;
  await loadNewsMacro();
  const mudou = (NEWSD && NEWSD.updatedAt) !== antesN || MACRO.noticiasAoVivoEm !== antesM;
  if(!mudou) return;
  if(document.body.dataset.view === 'macro') renderMacro();
  if(openCvm) openDetail(openCvm);          // a empresa aberta recarrega as manchetes dela
  renderAvisoIdade();
}
// manchetes gerais fora do HTML: sem isso elas só mudavam quando o painel inteiro
// era regerado (1x/dia em dia útil — e nada quando a CVM falhava)
let newsMacTentou = false;
async function loadNewsMacro(){
  if(newsMacTentou) return NEWSMAC;
  newsMacTentou = true;
  try{ NEWSMAC = await jj(rawData('news','news_macro.json'), 15000); }
  catch(e){ NEWSMAC = null; }
  if(NEWSMAC && NEWSMAC.updatedAt){
    // só substitui o embutido se for mais novo que o snapshot do build
    const emb = MACRO.snapshotEm ? Date.parse(MACRO.snapshotEm) : 0;
    if(Date.parse(NEWSMAC.updatedAt) >= emb){
      if((NEWSMAC.manchetes||[]).length) MACRO.manchetes = NEWSMAC.manchetes;
      if(NEWSMAC.veiculos && (NEWSMAC.veiculos.br||[]).length) MACRO.veiculos = NEWSMAC.veiculos;
      if(NEWSMAC.reddit && ((NEWSMAC.reddit.news||[]).length || (NEWSMAC.reddit.disc||[]).length)) MACRO.reddit = NEWSMAC.reddit;
      MACRO.noticiasAoVivoEm = NEWSMAC.updatedAt;
    }
  }
  renderAvisoIdade();
  return NEWSMAC;
}
// Falha de rede guardava {} em SEGD/OPD e a guarda `if(SEGD && OPD) return`
// nunca deixava tentar de novo na sessão: {} é truthy, então o aviso
// "carregando os KPIs operacionais…" ficava para sempre e o modo KPI abria vazio.
// Agora o erro NÃO é memorizado, e uma nova tentativa espera 30 s para não virar
// laço de rede quando a origem está fora.
let extrasErroEm = 0;
async function loadExtras(){
  if(SEGD && OPD && Object.keys(SEGD).length && Object.keys(OPD).length) return;
  if(extrasErroEm && (Date.now() - extrasErroEm) < 30000) return;
  const g = async f => { try{ return await jj('https://raw.githubusercontent.com/'+REPO+'/main/data/'+f+'?v='+Math.floor(Date.now()/36e5), 15000); }catch(e){ return null; } };
  const [a, b] = await Promise.all([g('segmentos.json'), g('operacionais.json')]);
  if(a === null || b === null){
    extrasErroEm = Date.now();
    SEGD = SEGD || {}; OPD = OPD || {};   // deixa a tela dizer "sem dado", não travar
    return;
  }
  extrasErroEm = 0;
  SEGD = a; OPD = b;
}

// ---- gráfico de barras horizontais (comparações) ----
function hbarChart(container, rows, fmt, onclickRow){
  container.textContent = '';
  if(!rows.length){ container.append(el('div','dim','sem dados para este filtro')); return; }
  const W = Math.max(container.clientWidth||760, 320);
  const rowH = 26, padT = 4, padB = 4;
  const labelW = Math.min(230, Math.round(W*0.34)), valW = 90;
  const H = padT + padB + rows.length*rowH;
  const iw = Math.max(40, W - labelW - valW - 14);
  // Antes o comprimento da barra era |v| e só a cor distinguia o sinal: num
  // ranking de "Maiores" a empresa com −40% ganhava barra MAIS LONGA que a de +30%.
  // Com valores dos dois sinais, o eixo passa a ter zero: barra para a direita
  // quando positivo, para a esquerda quando negativo, e uma linha fina no zero.
  const vals = rows.map(r => r.v).filter(v => v != null);
  const temNeg = vals.some(v => v < 0), temPos = vals.some(v => v > 0);
  const bipolar = temNeg && temPos;
  const mn = bipolar ? Math.min(0, ...vals) : 0;
  const mx = bipolar ? Math.max(0, ...vals) : (Math.max(...vals.map(Math.abs)) || 1);
  const amp = (mx - mn) || 1;
  const maxV = Math.max(...rows.map(r=>Math.abs(r.v))) || 1;
  const xZero = bipolar ? labelW + iw*(0 - mn)/amp : labelW;
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+H); svg.setAttribute('width','100%'); svg.style.display='block';
  rows.forEach((r,i)=>{
    const y = padT + i*rowH;
    const t = document.createElementNS(svg.namespaceURI,'text');
    t.setAttribute('x',labelW-6); t.setAttribute('y',y+17); t.setAttribute('text-anchor','end');
    if(r.hl) t.setAttribute('class','val');
    // o sufixo entre parênteses é a contagem de empresas, que a nota manda ler:
    // corta o nome, nunca o sufixo ("Bens Industriais (10)" não pode virar "(1")
    // Truncar por CONTAGEM de caracteres cortava certo no desktop e errado no
    // celular: labelW é 34% da largura (77 px num iPhone), onde cabem ~11
    // caracteres, não 34. O texto usa text-anchor:end, então o excesso invadia a
    // área do gráfico e a leitura ficava ambígua. Agora o corte é por largura
    // disponível, estimada em 6,6 px por caractere na fonte de 12,5 px do SVG.
    const suf = r.suf || '';
    const cabem = Math.max(4, Math.floor((labelW - 8) / 6.6) - suf.length);
    const base = r.label.length > cabem ? r.label.slice(0, Math.max(3, cabem - 1)) + '…' : r.label;
    t.textContent = base + suf;
    svg.append(t);
    const bw = Math.max(2, iw*Math.abs(r.v)/(bipolar ? amp : maxV));
    const bx = bipolar ? (r.v < 0 ? xZero - bw : xZero) : labelW;
    const bar = document.createElementNS(svg.namespaceURI,'rect');
    bar.setAttribute('x',bx); bar.setAttribute('y',y+4);
    bar.setAttribute('width',bw); bar.setAttribute('height',18); bar.setAttribute('rx',3);
    bar.setAttribute('fill', r.hl ? 'var(--s2)' : (r.v<0 ? 'var(--bad)' : 'var(--s1)'));
    // nome completo por toque e por mouse. Vai na BARRA e não no <text>: um
    // <title> dentro de <text> é renderizado pelo Chrome junto do rótulo, e o
    // nome aparecia duplicado na tela ('COMGASCOMGAS').
    const ttb = document.createElementNS(svg.namespaceURI, 'title');
    ttb.textContent = r.label + (r.suf||'') + ' — ' + fmt(r.v);
    bar.append(ttb);
    if(r.med) bar.setAttribute('opacity','.45');
    svg.append(bar);
    const v = document.createElementNS(svg.namespaceURI,'text');
    v.setAttribute('x', bipolar ? bx+bw+6 : labelW+bw+6); v.setAttribute('y',y+17); v.setAttribute('class','val');
    v.textContent = fmt(r.v); svg.append(v);
    // r.cvm = empresa (abre o detalhe); r.key = grupo setorial (desce para o ranking)
    const alvo = r.cvm || r.key;
    if(onclickRow && alvo){
      const hit = document.createElementNS(svg.namespaceURI,'rect');
      hit.setAttribute('x',0); hit.setAttribute('y',y); hit.setAttribute('width',W); hit.setAttribute('height',rowH);
      hit.setAttribute('fill','transparent'); hit.style.cursor='pointer';
      hit.addEventListener('click', ()=>onclickRow(alvo));
      svg.append(hit);
    }
  });
  if(bipolar){
    // linha do zero: sem ela o leitor não tem referência de onde as barras viram
    const z = document.createElementNS(svg.namespaceURI,'line');
    z.setAttribute('x1',xZero); z.setAttribute('x2',xZero);
    z.setAttribute('y1',padT); z.setAttribute('y2',H-padB);
    z.setAttribute('stroke','var(--axis)'); z.setAttribute('stroke-width','1');
    svg.append(z);
  }
  container.append(svg);
}


// ================= mapa de calor (treemap) =================
// A tabela responde "quanto", o mapa responde "onde está o peso". Num universo de
// 354 empresas e 11 setores, a pergunta "o que aconteceu hoje" é respondida em um
// olhar: o tamanho do bloco é o valor de mercado (quem realmente move o índice) e
// a cor é o indicador escolhido.
//
// Algoritmo: squarify (Bruls, Huizing e van Wijk). Ele mantém os retângulos perto
// do quadrado, que é o que torna a comparação de áreas honesta — faixas finas e
// compridas enganam a leitura. Implementado aqui em SVG puro, sem biblioteca:
// o painel é um HTML autocontido que roda offline no aplicativo.
function squarify(itens, x, y, w, h){
  const out = [];
  const total = itens.reduce((a,b)=>a+b.v,0);
  if(!(total > 0) || w <= 0 || h <= 0) return out;
  let escala = (w*h)/total;
  const fila = itens.map(i=>({...i, a:i.v*escala}));
  let px=x, py=y, pw=w, ph=h;
  const pior = (linha, lado) => {
    const s = linha.reduce((a,b)=>a+b.a,0);
    const mx = Math.max(...linha.map(r=>r.a)), mn = Math.min(...linha.map(r=>r.a));
    return Math.max((lado*lado*mx)/(s*s), (s*s)/(lado*lado*mn));
  };
  let i = 0;
  while(i < fila.length){
    const vertical = pw >= ph;
    const lado = vertical ? ph : pw;
    const linha = [fila[i]];
    let j = i + 1;
    while(j < fila.length && pior(linha, lado) >= pior([...linha, fila[j]], lado)){
      linha.push(fila[j]); j++;
    }
    const soma = linha.reduce((a,b)=>a+b.a,0);
    const esp = soma / lado;            // espessura da faixa
    let desl = 0;
    for(const r of linha){
      const comp = r.a / esp;
      if(vertical) out.push({...r, x:px, y:py+desl, w:esp, h:comp});
      else          out.push({...r, x:px+desl, y:py, w:comp, h:esp});
      desl += comp;
    }
    if(vertical){ px += esp; pw -= esp; } else { py += esp; ph -= esp; }
    i = j;
  }
  return out;
}
// escala de cor divergente, legível nos dois temas e com o zero sempre no meio.
// Não usa vermelho/verde puros: além de serem os piores pares para daltonismo
// (8% dos homens), o painel já usa --good/--bad para sinal em texto.
function corMapa(v, lim){
  if(v == null || !isFinite(v)) return 'var(--wash)';
  const r = Math.max(-1, Math.min(1, v/(lim||1)));
  const alfa = 0.14 + 0.72*Math.abs(r);
  return r >= 0 ? 'rgba(45,120,90,'+alfa.toFixed(2)+')' : 'rgba(150,60,45,'+alfa.toFixed(2)+')';
}
// métricas de cor do mapa: rótulo, valor por empresa, formato e "quanto é muito"
const MAPA_CORES = [
  ['var', 'Variação do dia (%)', c => { const t = mainTicker(c); const q = t && getQ(t.t); return q ? q.pct : null; }, fmtSign, 3],
  ['roe', 'ROE (%)', c => roeDe(c), fmtPct, 25],
  ['roic', 'ROIC (%)', c => c.fin ? null : ((mainTicker(c)||{}).roic ?? (c.ind||{}).roic ?? null), fmtPct, 20],
  ['mgL12', 'Margem líquida 12m (%)', c => niSuspeito(c) ? null : c.ind.mgL12, fmtPct, 20],
  ['mgE12', 'Margem EBITDA 12m (%)', c => c.ind.mgE12, fmtPct, 30],
  ['dlEbitda', 'Dív. líq./EBITDA (x)', c => { const v = dlEbitdaDe(c); return v == null ? null : -v; }, v => fmtX(v == null ? null : -v), 3],
  ['pl', 'P/L', c => { const v = plDe(c); return v == null ? null : -v; }, v => fmtX(v == null ? null : -v), 15],
  ['dy', 'Div. Yield (%)', c => { const t = mainTicker(c); return t ? t.dy : null; }, fmtPct, 8],
];
function renderMapa(box){
  const met = MAPA_CORES.find(m => m[0] === (cmpSel.mapaCor||'var')) || MAPA_CORES[0];
  const [, metRot, metVal, metFmt, metLim] = met;
  const escopo = porteFiltra(escopoFiltra(COS, cmpSel.setor), cmpSel.porte);
  // O tamanho é sempre o valor de mercado: é o que diz quanto cada empresa pesa.
  // Empresa sem valor de mercado calculável não entra — e a nota diz quantas são,
  // para o mapa não parecer o universo inteiro quando não é.
  const comMk = escopo.filter(c => c.ind.mktCap > 0);
  const semMk = escopo.length - comMk.length;
  if(!comMk.length){ box.append(el('div','dim','nenhuma empresa deste recorte tem valor de mercado calculável')); return; }
  const nivel = cmpSel.mapaNivel || 'setor';
  const grupos = {};
  for(const c of comMk) (grupos[c[nivel]] = grupos[c[nivel]] || []).push(c);
  const W = Math.max(box.clientWidth || 900, 320);
  const H = Math.max(340, Math.min(720, Math.round(W*0.62)));
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+H); svg.setAttribute('width','100%'); svg.style.display='block';
  const tot = g => grupos[g].reduce((a,c)=>a+c.ind.mktCap,0);
  const gs = Object.keys(grupos).sort((a,b)=>tot(b)-tot(a)).map(g=>({k:g, v:tot(g)}));
  const caixas = squarify(gs, 0, 0, W, H);
  let nEmp = 0;
  for(const cx of caixas){
    const CAB = 17;   // faixa do nome do grupo
    const g = document.createElementNS(svg.namespaceURI,'g');
    const fundo = document.createElementNS(svg.namespaceURI,'rect');
    fundo.setAttribute('x',cx.x); fundo.setAttribute('y',cx.y);
    fundo.setAttribute('width',Math.max(0,cx.w)); fundo.setAttribute('height',Math.max(0,cx.h));
    fundo.setAttribute('fill','var(--wash)'); fundo.setAttribute('stroke','var(--page)');
    fundo.setAttribute('stroke-width','2');
    g.append(fundo);
    if(cx.h > CAB + 12 && cx.w > 54){
      const tt = document.createElementNS(svg.namespaceURI,'text');
      tt.setAttribute('x',cx.x+5); tt.setAttribute('y',cx.y+12);
      tt.setAttribute('style','font:700 11px/1 inherit;fill:var(--ink)');
      const cabem = Math.max(4, Math.floor((cx.w-10)/6.2));
      tt.textContent = cx.k.length > cabem ? cx.k.slice(0, cabem-1)+'…' : cx.k;
      const ttl = document.createElementNS(svg.namespaceURI,'title');
      ttl.textContent = cx.k + ' · ' + grupos[cx.k].length + ' empresas · ' + fmtMi(cx.v);
      tt.append(ttl);
      g.append(tt);
    }
    // empresas dentro do grupo, pelo mesmo algoritmo
    const dentro = grupos[cx.k].map(c=>({k:c.name, v:c.ind.mktCap, c}))
      .sort((a,b)=>b.v-a.v);
    const sub = squarify(dentro, cx.x+2, cx.y+CAB, Math.max(0,cx.w-4), Math.max(0,cx.h-CAB-2));
    for(const s of sub){
      if(s.w < 2 || s.h < 2) continue;
      nEmp++;
      const v = metVal(s.c);
      const r = document.createElementNS(svg.namespaceURI,'rect');
      r.setAttribute('x',s.x); r.setAttribute('y',s.y);
      r.setAttribute('width',s.w); r.setAttribute('height',s.h);
      r.setAttribute('fill', corMapa(v, metLim));
      r.setAttribute('stroke','var(--page)'); r.setAttribute('stroke-width','1');
      r.style.cursor = 'pointer';
      const ttl = document.createElementNS(svg.namespaceURI,'title');
      ttl.textContent = s.c.name + ' · ' + (s.c.tickers.map(x=>x.t).join(' ') || 'sem ticker')
        + '\n' + metRot + ': ' + (v==null ? 'sem dado' : metFmt(v))
        + '\nValor de mercado: ' + fmtMi(s.c.ind.mktCap)
        + '\n' + s.c.setor + ' › ' + s.c.subsetor;
      r.append(ttl);
      r.addEventListener('click', () => openDetail(s.c.cvm));
      g.append(r);
      // rótulo só onde cabe de verdade; senão o mapa vira mancha de texto
      if(s.w > 46 && s.h > 22){
        const tk = (mainTicker(s.c)||{}).t || s.c.root;
        const tx = document.createElementNS(svg.namespaceURI,'text');
        tx.setAttribute('x',s.x+s.w/2); tx.setAttribute('y',s.y+s.h/2-1);
        tx.setAttribute('text-anchor','middle');
        tx.setAttribute('style','font:700 10.5px/1 inherit;fill:var(--ink);pointer-events:none');
        tx.textContent = tk;
        g.append(tx);
        if(s.h > 34 && v != null){
          const tv = document.createElementNS(svg.namespaceURI,'text');
          tv.setAttribute('x',s.x+s.w/2); tv.setAttribute('y',s.y+s.h/2+11);
          tv.setAttribute('text-anchor','middle');
          tv.setAttribute('style','font:600 9.5px/1 inherit;fill:var(--ink2);pointer-events:none');
          tv.textContent = metFmt(v);
          g.append(tv);
        }
      }
    }
    svg.append(g);
  }
  box.append(svg);
  const semDado = comMk.filter(c => metVal(c) == null).length;
  const nota = el('div','note');
  nota.textContent = 'Área = valor de mercado · cor = ' + metRot.toLowerCase()
    + ' (verde acima de zero, vermelho abaixo; a intensidade satura em ' + metLim + ')'
    + ' · ' + nEmp + ' empresas desenhadas'
    + (semMk ? ' · ' + semMk + ' fora do mapa por não ter valor de mercado calculável' : '')
    + (semDado ? ' · ' + semDado + ' sem o indicador da cor (bloco cinza)' : '')
    + '. Clique numa empresa para abrir a ficha.';
  box.append(nota);
}


// ---- quartis e percentil: o que uma comps table de consultoria tem e um
// ranking não tem. "P/L de 12x" não diz nada sozinho; "12x, no 3º quartil do
// peer set e no percentil 78 do setor" diz onde a empresa está. Método: quantil
// por interpolação linear (o mesmo do PERCENTIL.INC do Excel), para o número
// bater com o que o consultor vai recalcular na planilha.
function quantil(arr, q){
  const a = arr.filter(x => x != null && isFinite(x)).sort((x,y)=>x-y);
  if(!a.length) return null;
  if(a.length === 1) return a[0];
  const pos = (a.length - 1) * q;
  const lo = Math.floor(pos), hi = Math.ceil(pos);
  return lo === hi ? a[lo] : a[lo] + (a[hi] - a[lo]) * (pos - lo);
}
// percentil de v dentro de arr, em 0-100. Empates contam meio (definição de
// rank médio), senão a primeira e a última empresa iguais receberiam percentis
// diferentes só pela ordem em que aparecem na lista.
function percentilDe(v, arr){
  const a = arr.filter(x => x != null && isFinite(x));
  if(v == null || !isFinite(v) || a.length < 3) return null;
  let menores = 0, iguais = 0;
  for(const x of a){ if(x < v) menores++; else if(x === v) iguais++; }
  return Math.round(100 * (menores + iguais/2) / a.length);
}

// botão discreto que abre a explicação. Um "?" ao lado do rótulo, não um texto
// permanente: quem já sabe não precisa ler de novo a cada visita.
function ajudaInd(chave){
  const g = GLOSSARIO[chave];
  if(!g) return null;
  const b = el('button','glo','?');
  b.type = 'button';
  b.title = 'como este indicador é calculado';
  b.setAttribute('aria-label','explicação de '+g.n);
  b.onclick = (ev) => {
    ev.stopPropagation();
    showTipFixo(ev.clientX, ev.clientY, g);
  };
  return b;
}
// caixa de explicação, presa até o próximo clique (o tooltip normal some no
// pointerleave, o que no celular a torna inútil)
let gloBox = null;
function showTipFixo(x, y, g){
  if(gloBox) gloBox.remove();
  gloBox = el('div','globox');
  gloBox.append(el('b',null,g.n));
  gloBox.append(el('div','gl','Como é calculado: '+g.f));
  gloBox.append(el('div','gl','Fonte: '+g.o));
  if(g.g) gloBox.append(el('div','gl','Quando não aparece: '+g.g));
  const fechar = el('button','btn','fechar');
  fechar.onclick = () => { gloBox.remove(); gloBox = null; };
  gloBox.append(fechar);
  document.body.append(gloBox);
  const r = gloBox.getBoundingClientRect();
  gloBox.style.left = Math.max(8, Math.min(innerWidth - r.width - 8, x - r.width/2)) + 'px';
  gloBox.style.top  = Math.max(8, Math.min(innerHeight - r.height - 8, y + 14)) + 'px';
}
document.addEventListener('click', e => {
  if(gloBox && !e.target.closest('.globox') && !e.target.closest('.glo')){ gloBox.remove(); gloBox = null; }
});


// ================= sinais objetivos e anotações do consultor =================
// As plataformas concorrentes resumem a empresa num SELO ("viável", "bomba",
// floco de neve de 0 a 6). O selo é opinião embrulhada em número: some a regra e
// sobra a nota. Aqui o formato é o contrário — cada linha diz A REGRA, O DADO e
// o resultado, e quem decide é quem lê. Sem dado, a linha some em vez de virar
// "reprovado": ausência de informação não é informação negativa.
function sinaisDe(c){
  const i = c.ind || {}, b = c.bal || {};
  const roe = roeDe(c), dl = dlEbitdaDe(c);
  const regras = [
    {ok: b.pl != null && b.pl > 0, sim:'Patrimônio líquido positivo', nao:'Patrimônio líquido NEGATIVO',
     val: b.pl == null ? null : fmtMi(b.pl), grave:true},
    {ok: i.ni12 != null && i.ni12 > 0, sim:'Lucro nos últimos 12 meses', nao:'Prejuízo nos últimos 12 meses',
     val: niSuspeito(c) ? null : (i.ni12 == null ? null : fmtMi(i.ni12))},
    {ok: dl != null && dl < 3, sim:'Dívida líquida abaixo de 3× o EBITDA', nao:'Dívida líquida acima de 3× o EBITDA',
     val: dl == null ? null : fmtX(dl)},
    {ok: i.cobJuros != null && i.cobJuros > 2, sim:'EBIT cobre mais de 2× a despesa financeira', nao:'EBIT cobre menos de 2× a despesa financeira',
     val: i.cobJuros == null ? null : fmtX(i.cobJuros)},
    {ok: i.liqCorr != null && i.liqCorr > 1, sim:'Ativo circulante maior que o passivo circulante', nao:'Passivo circulante maior que o ativo circulante',
     val: i.liqCorr == null ? null : fmtX(i.liqCorr)},
    {ok: roe != null && roe > 10, sim:'ROE acima de 10%', nao:'ROE abaixo de 10%', val: roe == null ? null : fmtPct(roe)},
    {ok: i.mgL12 != null && i.mgL12 > 0, sim:'Margem líquida positiva', nao:'Margem líquida negativa',
     val: (niSuspeito(c) || i.mgL12 == null) ? null : fmtPct(i.mgL12)},
    {ok: i.fcoNi != null && i.fcoNi >= 0.8, sim:'O lucro está virando caixa (operações ≥ 80% do lucro)', nao:'O lucro NÃO está virando caixa (operações abaixo de 80% do lucro)',
     val: i.fcoNi == null ? null : fmtX(i.fcoNi)},
    {ok: i.fcl12 != null && i.fcl12 > 0, sim:'Fluxo de caixa livre positivo', nao:'Fluxo de caixa livre negativo',
     val: i.fcl12 == null ? null : fmtMi(i.fcl12)},
  ];
  // receita caindo: comparação dos dois últimos acumulados de 12 meses, só quando
  // os dois existem e nenhum trimestre da janela está marcado
  const qs = (c.q || []).filter(x => x.rev != null && !x.sus);
  if(qs.length >= 8){
    const soma4 = k => qs.slice(k, k+4).reduce((a,x)=>a+x.rev, 0);
    const atual = soma4(qs.length-4), antes = soma4(qs.length-8);
    if(antes > 0) regras.push({ok: atual >= antes, sim:'Receita de 12 meses cresceu contra os 12 meses anteriores',
      nao:'Receita de 12 meses caiu contra os 12 meses anteriores',
      val: fmtPct(+(100*(atual/antes-1)).toFixed(1))});
  }
  return regras.filter(r => r.val != null);
}
function blocoSinais(c){
  const s = sinaisDe(c);
  if(!s.length) return null;
  const wrap = el('div','card');
  const passa = s.filter(x=>x.ok).length;
  wrap.append(el('div','ct','Checagens objetivas — '+passa+' de '+s.length+' atendidas'));
  const ul = el('div','sinais');
  for(const r of s){
    const li = el('div','sinal'+(r.ok?' ok':' nao'));
    li.append(el('span','ic', r.ok ? '✓' : '✕'));
    li.append(el('span','tx', r.ok ? r.sim : r.nao));
    li.append(el('span','vl', r.val));
    ul.append(li);
  }
  wrap.append(ul);
  wrap.append(el('div','note','Cada linha é uma regra fixa aplicada ao dado desta empresa, com o valor ao lado — '
    + 'não é nota, selo nem recomendação. Regra sem dado disponível não aparece (em vez de contar como reprovada). '
    + 'Os limites (3× EBITDA, 2× juros, ROE 10%, caixa 80% do lucro) são convenções de mercado, não opinião do painel.'));
  return wrap;
}
// ---- anotações do consultor, por empresa, guardadas só neste navegador ----
// Fundamentei chama de "notas", Simply Wall St de "narrativas". Aqui é o lugar de
// registrar a tese e o que foi conferido, junto do número — sem sair da tela e
// sem mandar nada para servidor nenhum.
function blocoNotas(c){
  const chave = 'nota_'+c.cvm;
  const wrap = el('div','card');
  wrap.append(el('div','ct','Minhas anotações sobre '+c.name));
  const ta = document.createElement('textarea');
  ta.className = 'notas';
  ta.placeholder = 'Tese, o que conferir no próximo trimestre, o que já foi validado com o RI…';
  ta.value = lsGet(chave) || '';
  ta.rows = 4;
  const st = el('div','dim','');
  let tmr = null;
  ta.oninput = () => {
    clearTimeout(tmr);
    tmr = setTimeout(() => {
      lsSet(chave, ta.value);
      st.textContent = ta.value ? 'salvo neste navegador às ' + new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : '';
    }, 400);
  };
  if(ta.value) st.textContent = 'salvo neste navegador';
  wrap.append(ta, st);
  wrap.append(el('div','note','A anotação fica só neste navegador (não vai para o repositório nem para servidor). '
    + 'Use "⧉ copiar todas as anotações" no modal ⓘ Dados para levar tudo de uma vez.'));
  return wrap;
}


// ================= demonstrações completas por trimestre =====================
// O painel mostrava receita, EBIT, EBITDA e lucro. A DRE tem muito mais, e as
// contas que faltavam são padronizadas na CVM (nível 2 e 3, presentes em 438 das
// 441 empresas): custo, lucro bruto, despesas de venda e administrativas,
// resultado financeiro, lucro antes dos tributos e imposto. O mesmo vale para o
// balanço (circulante, não circulante, estoques, recebíveis, imobilizado) e para
// a demonstração de fluxo de caixa (operações, investimento, financiamento).
//
// Cada linha diz de qual CONTA veio. Isso não é enfeite: quem confere no
// documento oficial precisa saber onde procurar, e quem vê um número estranho
// precisa poder rastreá-lo.
const DEMONSTRACOES = [
  {titulo:'Demonstração de resultado', fonte:'DRE (ITR/DFP)', linhas:[
    ['Receita líquida', 'rev', '3.01'],
    ['Custo dos bens e serviços', 'custo', '3.02'],
    ['Lucro bruto', 'lucroBruto', '3.03'],
    ['Margem bruta', 'mgB', null, 'pct'],
    ['Despesas com vendas', 'despVendas', '3.04.01'],
    ['Despesas gerais e administrativas', 'despAdm', '3.04.02'],
    ['EBIT (antes do financeiro e dos tributos)', 'ebit', '3.05'],
    ['EBITDA', 'ebitda', 'EBIT + depreciação (DFC)'],
    ['Margem EBITDA', 'mgE', null, 'pct'],
    ['Receitas financeiras', 'recFin', '3.06.01'],
    ['Despesas financeiras', 'despFin', '3.06.02'],
    ['Lucro antes dos tributos', 'ebt', '3.07'],
    ['Imposto de renda e CSLL', 'ir', '3.08'],
    ['Lucro líquido', 'ni', '3.11.01 (controladora)'],
    ['Margem líquida', 'mgL', null, 'pct'],
  ]},
  {titulo:'Fluxo de caixa', fonte:'DFC método indireto (ITR/DFP)', linhas:[
    ['Caixa das operações', 'fco', '6.01'],
    ['Caixa de investimento', 'fci', '6.02'],
    ['Caixa de financiamento', 'fcf', '6.03'],
    ['Investimento em imobilizado e intangível (capex)', 'capex', '6.02.* por descrição'],
  ]},
];
// o balanço vem da outra série (c.bh), que é por data e não por trimestre
const BALANCO_LINHAS = [
  ['Ativo total', 'ativo'],
  ['Ativo circulante', 'atCirc'],
  ['Contas a receber', 'receb'],
  ['Estoques', 'estoq'],
  ['Passivo circulante', 'pasCirc'],
  ['Patrimônio líquido', 'pl'],
  ['Dívida líquida', 'divL'],
];
function tabelaDemonstracao(c, spec){
  // últimos 8 trimestres, do mais novo para o mais velho — a ordem que o leitor
  // espera quando a pergunta é "como está agora"
  const qs = (c.q || []).slice(-8).reverse();
  if(!qs.length) return null;
  const temAlgum = spec.linhas.some(([, campo]) => qs.some(q => q[campo] != null));
  if(!temAlgum) return null;
  const w = el('div','qtblwrap'); const tb = el('table','qtbl');
  const hr = el('tr');
  hr.append(el('th',null,'Conta'));
  for(const q of qs){
    const th = el('th',null, q.p + (q.sus ? ' ⚠' : ''));
    if(q.sus) th.title = q.susTxt || 'trimestre marcado: a aritmética da entrega da empresa não fecha';
    hr.append(th);
  }
  const th = el('thead'); th.append(hr); tb.append(th);
  const body = el('tbody');
  const linhasTsv = [];
  for(const [rot, campo, conta, tipo] of spec.linhas){
    if(!qs.some(q => q[campo] != null)) continue;   // linha vazia não entra
    const tr = el('tr');
    const td0 = el('td');
    td0.append(document.createTextNode(rot));
    if(conta){ const s = el('span','cconta', ' ' + conta); td0.append(s); }
    tr.append(td0);
    for(const q of qs){
      const v = q[campo];
      const td = el('td', v == null ? 'dim' : (v < 0 ? 'neg' : ''),
                     v == null ? '—' : (tipo === 'pct' ? fmtPct(v) : fmtNum(v)));
      if(q.sus) td.style.opacity = '.55';
      tr.append(td);
    }
    body.append(tr);
    linhasTsv.push([rot + (conta ? ' ('+conta+')' : ''), ...qs.map(q => q[campo])]);
  }
  tb.append(body); w.append(tb);
  return {el: w, headers: ['Conta', ...qs.map(q=>q.p)], linhas: linhasTsv};
}
function tabelaBalanco(c){
  const bs = (c.bh || []).slice(-8).reverse();
  if(!bs.length) return null;
  const w = el('div','qtblwrap'); const tb = el('table','qtbl');
  const hr = el('tr'); hr.append(el('th',null,'Conta'));
  const rotuloDt = d => d.slice(0,4)+'T'+({'03':'1','06':'2','09':'3','12':'4'}[d.slice(5,7)]||'?');
  for(const b of bs) hr.append(el('th',null, rotuloDt(b.dt)));
  const th = el('thead'); th.append(hr); tb.append(th);
  const body = el('tbody'); const linhasTsv = [];
  for(const [rot, campo] of BALANCO_LINHAS){
    if(!bs.some(b => b[campo] != null)) continue;
    const tr = el('tr'); tr.append(el('td',null,rot));
    for(const b of bs){
      const v = b[campo];
      tr.append(el('td', v == null ? 'dim' : (v < 0 ? 'neg' : ''), v == null ? '—' : fmtNum(v)));
    }
    body.append(tr);
    linhasTsv.push([rot, ...bs.map(b => b[campo])]);
  }
  tb.append(body); w.append(tb);
  return {el: w, headers: ['Conta', ...bs.map(b=>rotuloDt(b.dt))], linhas: linhasTsv};
}
function blocoDemonstracoes(c){
  const partes = [];
  for(const spec of DEMONSTRACOES){
    const r = tabelaDemonstracao(c, spec);
    if(!r) continue;
    const card = el('div','card');
    card.append(el('div','ct', spec.titulo + ' — R$, por trimestre'));
    card.append(r.el);
    card.append(chartTools(() => null, () => ({headers:r.headers, linhas:r.linhas}), () => c.name+' — '+spec.titulo));
    card.append(el('div','note','Fonte: '+spec.fonte+'. O código ao lado do nome é a conta na CVM — '
      + 'é por ele que se confere no documento oficial. Linha sem nenhum valor não é exibida.'));
    partes.push(card);
  }
  const b = tabelaBalanco(c);
  if(b){
    const card = el('div','card');
    card.append(el('div','ct','Balanço patrimonial — R$, por trimestre'));
    card.append(b.el);
    card.append(chartTools(() => null, () => ({headers:b.headers, linhas:b.linhas}), () => c.name+' — Balanço'));
    card.append(el('div','note','Fonte: BPA/BPP (ITR/DFP). Patrimônio líquido já descontada a participação '
      + 'de não controladores. Dívida líquida = empréstimos e financiamentos menos caixa e aplicações; '
      + 'não é calculada para banco e seguradora.'));
    partes.push(card);
  }
  return partes;
}

// B3 e o mercado brasileiro usam, em R$; ficam escritos na tela para ninguém ter
// de adivinhar o que é "small".
const PORTES = [

function porteFiltra(lista, chave){
  const p = PORTES.find(x => x[0] === chave);

// ================= estatísticas de série (CAGR, média, extremos) =================
// CAGR só faz sentido em série de nível positivo (receita, EBITDA). Em indicador
// que já é percentual ou múltiplo, ou que tenha valor <= 0, devolve null em vez de
// um número sem significado.
function estat(rows, permiteCagr){
  const vs = (rows||[]).filter(r=>r && r.v!=null && isFinite(r.v));
  if(!vs.length) return null;
  const nums = vs.map(r=>r.v);
  const ini = vs[0], fim = vs[vs.length-1];
  const anos = vs.length>1 ? (pNum(fim.p) - pNum(ini.p))/4 : 0;
  let cagr = null;
  if(permiteCagr && anos >= 0.9 && ini.v > 0 && fim.v > 0)
    cagr = (Math.pow(fim.v/ini.v, 1/anos) - 1) * 100;
  return {
    n: vs.length, ini, fim, anos,
    cagr,
    media: nums.reduce((a,b)=>a+b,0)/nums.length,
    mediana: med(nums),
    min: Math.min(...nums), max: Math.max(...nums),
    // Percentual sobre base NEGATIVA inverte o sinal: sair de −959 mi de prejuízo
    // para +1,2 bi de lucro aparecia como "queda de 227,9%". Com base não positiva
    // o painel publica a variação ABSOLUTA (em varAbs) e deixa o percentual vazio.
    varTotal: (ini.v != null && ini.v > 0) ? (fim.v/ini.v - 1)*100 : null,
    varAbs: (ini.v != null && fim.v != null) ? (fim.v - ini.v) : null,
  };
}
const pNum = p => (+String(p).slice(0,4))*4 + (+String(p).slice(5) || 0);
// indicadores em que CAGR faz sentido (nível, não razão)
const CAGR_OK = new Set(['rev12','ebitda12','ni12']);

// ================= filtro de escopo em 3 níveis =================
// A B3 tem só 11 setores, e eles são grossos: "Consumo Cíclico" junta construtora,
// autopeça, eletrodoméstico e varejo de roupa. Quem quer "varejo" precisa descer
// para subsetor (42) ou segmento (80). O valor guardado leva o nível num prefixo:
//   ''  = tudo | 'set:Consumo Cíclico' | 'sub:Comércio' | 'seg:Eletrodomésticos'
const NIVEIS = [['set','setor'],['sub','subsetor'],['seg','segmento']];
function escopoOpcoes(){
  const conta = campo => {
    const m = {};
    for(const c of COS){ const v = c[campo]; if(v) m[v] = (m[v]||0)+1; }
    return Object.keys(m).sort((a,b)=>a.localeCompare(b,'pt-BR')).map(v => [v, m[v]]);
  };
  return {set: conta('setor'), sub: conta('subsetor'), seg: conta('segmento')};
}
// migra valor antigo (sem prefixo) para o formato novo
// O escopo pode conter VÁRIOS grupos separados por '+' (ex.:
// 'sub:Comércio+sub:Comércio e Distribuição'). Isso existe porque um apelido do
// dia a dia às vezes cobre mais de um grupo da B3: "varejo" abrange o subsetor
// Comércio (Magalu, Renner) e o subsetor Comércio e Distribuição (Assaí, GPA,
// Grupo Mateus) — antes o painel silenciosamente devolvia só o primeiro, e o
// varejo alimentar inteiro ficava fora do ranking.
const escopoPartes = v => String(v||'').split('+').map(x=>x.trim()).filter(Boolean);
function escopoNorm(v){
  if(!v) return '';
  return escopoPartes(v).map(p => /^(set|sub|seg):/.test(p) ? p : 'set:'+p).join('+');
}
const campoDeNivel = n => n==='set' ? 'setor' : n==='sub' ? 'subsetor' : 'segmento';
function escopoFiltra(lista, valor){
  const v = escopoNorm(valor);
  if(!v) return lista;
  const alvos = escopoPartes(v).map(p => [campoDeNivel(p.slice(0,3)), p.slice(4)]);
  return lista.filter(c => alvos.some(([campo, alvo]) => c[campo] === alvo));
}
// acrescenta o porte ao rótulo do recorte: sem isso o título dizia "todos os
// setores" com metade das empresas fora por causa do filtro de porte
function rotuloRecorte(){
  const base = escopoRotulo(cmpSel.setor);
  const p = PORTES.find(x => x[0] === (cmpSel.porte||''));
  return (p && p[0]) ? base + ' · ' + p[1].split(' — ')[0].toLowerCase() + ' cap' : base;
}
function escopoRotulo(valor){
  const v = escopoNorm(valor);
  if(!v) return 'todos os setores';
  const partes = escopoPartes(v);
  const um = p => {
    const nome = (NIVEIS.find(x=>x[0]===p.slice(0,3))||[])[1] || 'setor';
    return nome + ' ' + p.slice(4);
  };
  if(partes.length === 1) return um(partes[0]);
  // "subsetores Comércio e Comércio e Distribuição" — o leitor precisa saber que
  // o recorte tem mais de um grupo, senão a contagem não fecha com a árvore lateral
  const mesmoNivel = partes.every(p => p.slice(0,3) === partes[0].slice(0,3));
  const nome = (NIVEIS.find(x=>x[0]===partes[0].slice(0,3))||[])[1] || 'setor';
  return mesmoNivel
    ? nome + 'es ' + partes.map(p=>p.slice(4)).join(' + ')
    : partes.map(um).join(' + ');
}

// ================= comparar os SETORES entre si (modo "set") =================
// "Qual setor tem a melhor margem?" tem duas respostas legítimas e diferentes:
//  · mediana/média das razões de cada empresa → como é a empresa TÍPICA do grupo;
//  · agregado = razão das SOMAS dos componentes → a margem do grupo somado, que é
//    o que se quer dizer com "a margem do varejo".
// O agregado só existe onde os componentes estão na base (CVM, 12 meses); onde não
// estão, a opção simplesmente não aparece em vez de virar uma média de razões
// disfarçada de agregado.
const SET_AGG = {
  mgE12:    {num: c=>c.ind.ebitda12,          den: c=>c.ind.rev12,     k:100, den2:'receita de 12 meses', rot:'soma(EBITDA 12m) ÷ soma(receita 12m)'},
  mgL12:    {num: c=>ni12De(c),               den: c=>c.ind.rev12,     k:100, den2:'receita de 12 meses', rot:'soma(lucro líquido 12m) ÷ soma(receita 12m)'},
  roe:      {num: c=>ni12De(c),               den: c=>(c.bal||{}).pl,  k:100, den2:'patrimônio líquido', rot:'soma(lucro líquido 12m) ÷ soma(patrimônio líquido)'},
  dlEbitda: {num: c=>(c.bal||{}).divL,        den: c=>c.ind.ebitda12,  k:1,   den2:'EBITDA de 12 meses', rot:'soma(dívida líquida) ÷ soma(EBITDA 12m)'},
  evebitda: {num: c=>evOf(c),                 den: c=>c.ind.ebitda12,  k:1,   den2:'EBITDA de 12 meses', rot:'soma(valor da firma) ÷ soma(EBITDA 12m)'},

  // agregados dos indicadores novos — a razão das somas é a leitura certa de
  // "a margem bruta do varejo" ou "a alavancagem do setor", e não a média de razões
  mgB12:    {num: c=>(c.ind||{}).lucroBruto12, den: c=>c.ind.rev12,    k:100, den2:'receita de 12 meses', rot:'soma(lucro bruto 12m) ÷ soma(receita 12m)'},
  roa:      {num: c=>ni12De(c),               den: c=>(c.bal||{}).ativo, k:100, den2:'ativo total', rot:'soma(lucro líquido 12m) ÷ soma(ativo total)'},
  giro:     {num: c=>c.ind.rev12,             den: c=>(c.bal||{}).ativo, k:1, den2:'ativo total', rot:'soma(receita 12m) ÷ soma(ativo total)'},
  liqCorr:  {num: c=>(c.bal||{}).atCirc,      den: c=>(c.bal||{}).pasCirc, k:1, den2:'passivo circulante', rot:'soma(ativo circulante) ÷ soma(passivo circulante)'},
  ativoPl:  {num: c=>(c.bal||{}).ativo,       den: c=>(c.bal||{}).pl,  k:1,   den2:'patrimônio líquido', rot:'soma(ativo total) ÷ soma(patrimônio líquido)'},
  capexRev: {num: c=>(c.ind||{}).capex12,     den: c=>c.ind.rev12,     k:100, den2:'receita de 12 meses', rot:'soma(capex 12m) ÷ soma(receita 12m)'},
  fcoNi:    {num: c=>(c.ind||{}).fco12,       den: c=>ni12De(c),       k:1,   den2:'lucro líquido de 12 meses', rot:'soma(caixa das operações 12m) ÷ soma(lucro líquido 12m)'},

// piso do denominador somado, em R$ milhões: abaixo disso o grupo não sustenta
// indicador agregado (é bolso de holding, não setor)
const SET_AGG_PISO = 100;
// indicadores de NÍVEL (R$), onde somar o grupo faz sentido
// indicadores que são VALOR em R$ (somam entre empresas) e não razão
const SET_SOMA = new Set(['mktCap','ev','rev12','fco12','fcl12']);
const SET_STATS = [['med','Mediana do grupo'],['avg','Média do grupo'],
                   ['agg','Agregado (soma dos componentes)'],['sum','Soma do grupo']];
function setStatOpcoes(indKey){
  return SET_STATS.filter(([k]) => k==='med' || k==='avg'
    || (k==='agg' && SET_AGG[indKey]) || (k==='sum' && SET_SOMA.has(indKey)));
}
const setStatRotulo = st => ({med:'mediana', avg:'média', agg:'agregado', sum:'soma'})[st] || 'mediana';
const nivelCampo = niv => niv==='set' ? 'setor' : niv==='sub' ? 'subsetor' : 'segmento';
const nivelNome  = niv => (NIVEIS.find(x=>x[0]===niv)||[])[1] || 'setor';
const nivelPlural = niv => niv==='seg' ? 'segmentos' : niv==='sub' ? 'subsetores' : 'setores';
// Agrupar por um nível IGUAL OU ACIMA do filtro já escolhido daria um grupo só.
// "compare os setores do varejo" quer dizer "compare as partes do varejo": desce
// um nível a partir do escopo.
function setNivelEfetivo(){
  const ordem = ['set','sub','seg'];
  const esc = escopoNorm(cmpSel.setor);
  let niv = ordem.includes(cmpSel.setNivel) ? cmpSel.setNivel : 'set';
  if(esc){
    const iEsc = ordem.indexOf(esc.slice(0,3));
    if(ordem.indexOf(niv) <= iEsc) niv = ordem[iEsc+1] || null;   // null = escopo já é segmento
  }

}
function gruposDe(lista, niv){
  const campo = nivelCampo(niv), m = new Map();
  for(const c of lista){
    const v = c[campo]; if(!v) continue;
    if(!m.has(v)) m.set(v, []);
    m.get(v).push(c);
  }
  return [...m.entries()].map(([nome, empresas]) => ({nome, chave: niv+':'+nome, empresas}))
    .sort((a,b) => a.nome.localeCompare(b.nome,'pt-BR'));
}
// todas as estatísticas de um grupo para um indicador (a tabela mostra todas;
// o gráfico usa a escolhida)
function setEstat(grupo, indKey){
  const g = CMP_INDS.find(x=>x[0]===indKey);
  const getter = g ? g[2] : (()=>null);
  const vals = grupo.empresas.map(getter).filter(v => v!=null && isFinite(v));
  const out = {n: vals.length, nGrupo: grupo.empresas.length,
    med: med(vals),
    avg: vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null,
    min: vals.length ? Math.min(...vals) : null,
    max: vals.length ? Math.max(...vals) : null,
    sum: SET_SOMA.has(indKey) && vals.length ? vals.reduce((a,b)=>a+b,0) : null,
    agg: null, nAgg: 0, somaNum: null, somaDen: null};
  const A = SET_AGG[indKey];
  if(A){
    let sn = 0, sd = 0, k = 0, maiorDen = 0, maiorNome = null;
    const dentro = [];
    // Empresa com denominador negativo fica FORA da soma, e sai também do
    // numerador: somar patrimônio negativo com positivo produz número sem
    // significado. Foi o caso de Eletrodomésticos, onde a CASAS BAHIA (PL
    // −8,3 bi e prejuízo de 13,2 bi) fazia o "ROE do segmento" virar −193%.
    const fora = [];
    for(const c of grupo.empresas){
      const nu = A.num(c), de = A.den(c);
      if(nu==null || de==null || !isFinite(nu) || !isFinite(de)) continue;
      if(de <= 0){ fora.push(c.name); continue; }
      sn += nu; sd += de; k++; dentro.push(c);
      if(Math.abs(de) > Math.abs(maiorDen)){ maiorDen = de; maiorNome = c.name; }
    }
    out.foraNeg = fora;
    out.nAgg = k; out.somaNum = k ? sn : null; out.somaDen = k ? sd : null;
    // concentração: quanto a maior empresa pesa no denominador somado. Petrobras
    // dominar o setor de petróleo é legítimo, mas o leitor precisa saber.
    out.conc = (k && sd) ? Math.abs(maiorDen / sd) : null;
    out.concNome = maiorNome; out.dentro = dentro;
    // Guardas do agregado, nesta ordem:
    //  · denominador somado não positivo → múltiplo sem significado;
    //  · denominador somado minúsculo → o setor "Outros" (8 holdings) somava R$ 39,7 mi
    //    de patrimônio contra um prejuízo de R$ 86 mi e produzia "ROE do setor = -208%".
    if(k && sd > 0 && sd >= SET_AGG_PISO) out.agg = A.k * sn / sd;
  }
  return out;
}

const UNIDADES = [[/\btri(lh[õo]es?|lh[ãa]o)?\b/, 1e6], [/\bbi(lh[õo]es?|lh[ãa]o)?\b/, 1e3],

// ---- "você quis dizer?": aproxima o termo digitado do vocabulário que existe ----
function distancia(a, b){                       // Levenshtein, curto e suficiente
  if(a === b) return 0;
  const m = a.length, n = b.length;
  if(!m || !n) return Math.max(m, n);
  let ant = Array.from({length:n+1}, (_,j)=>j), atual = new Array(n+1);
  for(let i=1;i<=m;i++){
    atual[0] = i;
    for(let j=1;j<=n;j++)
      atual[j] = Math.min(ant[j]+1, atual[j-1]+1, ant[j-1] + (a[i-1]===b[j-1] ? 0 : 1));
    [ant, atual] = [atual, ant];
  }
  return ant[n];
}
// vocabulário pesquisável: indicadores + os três níveis de classificação + apelidos
// Compara pelo termo limpo: sem "(%)", "12m" e pontuação, "ROIQ" chega em "ROIC".
function limpaTermo(t){
  return semAcento(t)
    .replace(/\((?:%|r\$|divulgado pela empresa|empresa)\)/g, ' ')
    .replace(/\b(12m|5 anos|a\.a\.)\b/g, ' ')
    .replace(/[^a-z0-9\/ ]/g, ' ')
    .replace(/\s+/g, ' ').trim();
}
function vocabulario(){
  const v = [];
  for(const [k, label] of CMP_INDS.map(x=>[x[0],x[1]]))
    v.push({tipo:'indicador', termo:label, busca:limpaTermo(label), chave:k});
  const OPC = escopoOpcoes();
  for(const [pref, nome] of NIVEIS)
    for(const [nomeVal] of OPC[pref])
      v.push({tipo:nome, termo:nomeVal, busca:limpaTermo(nomeVal), chave:pref+':'+nomeVal});
  return v;
}
// para cada palavra não reconhecida, o que mais se parece com ela
function sugereTermos(palavras, limite){
  const voc = vocabulario();
  const vistos = new Set(), saida = [];
  for(const p of (palavras||[])){
    const alvo = semAcento(p);
    if(alvo.length < 3) continue;
    const notas = voc.map(v => {
      const t = v.busca || semAcento(v.termo);
      // contém a palavra vale mais que só ser parecido
      const contem = t.includes(alvo) || alvo.includes(t);
      const d = distancia(alvo, t);
      return {...v, nota: contem ? -1 : d / Math.max(t.length, alvo.length)};
    }).filter(x => (x.nota < 0 || x.nota <= 0.5) && !/^(outros|diversos)$/i.test(x.termo))
      .sort((a,b)=>a.nota-b.nota)
      .slice(0, 3);
    for(const n of notas){
      if(vistos.has(n.chave)) continue;
      vistos.add(n.chave); saida.push({...n, origem:p});
      if(saida.length >= (limite||6)) return saida;
    }
  }
  return saida;
}
// ---- acha a empresa DENTRO da frase (não só a frase inteira) ----

// Acha a empresa citada na frase: apelido, ticker, nome por prefixo ou aproximado.
function achaEmpresaNaFrase(frase){
  const f = semAcento(frase).replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
  const palavras = f.split(' ');

  // 1) apelido do dia a dia
  for(const [re, nome] of APELIDOS_EMPRESA){
    if(re.test(f)){
      const c = COS.find(x => semAcento(x.name) === semAcento(nome))
             || COS.find(x => semAcento(x.name).startsWith(semAcento(nome).slice(0,8)));
      if(c) return {cvm:c.cvm, nome:c.name, nota:100, via:'apelido'};
    }
  }
  // 2) ticker escrito na frase
  for(const c of COS)
    for(const t of (c.tickers||[]))
      if(palavras.includes(t.t.toLowerCase())) return {cvm:c.cvm, nome:c.name, nota:99, via:'ticker'};

  // 3) nome/razão social por prefixo de token.
  //
  // O prefixo INVERSO (a palavra digitada é prefixo do token do nome) existe para
  // aceitar "petro" → PETROBRAS, mas com 4 letras ele transformava palavra
  // funcional em empresa: "entre" casava ENTRETENIMENTO e a frase
  // "compare os setores entre si" era interpretada como a empresa TIME FOR FUN,
  // o que matava a comparação entre grupos e punha "Não consegui interpretar" na
  // tela. Agora o prefixo inverso exige 6 letras e a palavra não pode ser
  // funcional (GENERICAS vale nos dois sentidos).
  let melhor = null;
  for(const c of COS){
    for(const fonte of [c.name, c.fullName]){
      if(!fonte) continue;
      const toks = tokensNome(fonte);
      if(!toks.length) continue;
      const casam = toks.filter(t => palavras.some(w =>
        (!GENERICAS.has(w)) && (w.startsWith(t) || (t.startsWith(w) && w.length >= 6))));
      if(casam.length === toks.length && (toks.length >= 2 || toks[0].length >= 5)){
        const nota = toks.join('').length;
        if(!melhor || nota > melhor.nota) melhor = {cvm:c.cvm, nome:c.name, nota, via:'nome'};
      }
    }
  }
  if(melhor) return melhor;

  // 4) aproximado — só com vencedor CLARO. "brakem" empata Braskem, Bradesco e
  // Bradespar em 0,333; "lojas" empata Quero-Quero, Marisa e Renner. Nesses casos
  // escolher seria adivinhar: devolvemos os candidatos para o usuário decidir.
  const cands = [];
  for(const c of COS){
    let melhorDaEmpresa = null;
    for(const fonte of [c.name, c.fullName]){
      if(!fonte) continue;
      const junto = semAcento(fonte).replace(LIXO_RAZAO,' ').replace(/[^a-z0-9]/g,'');
      if(junto.length < 4) continue;
      for(const w of palavras){
        if(w.length < 6 || GENERICAS.has(w)) continue;
        const d = distancia(w, junto.slice(0, Math.max(w.length, 6)));
        const nota = d / Math.max(w.length, 5);
        if(nota <= 0.34 && (!melhorDaEmpresa || nota < melhorDaEmpresa.nota))
          melhorDaEmpresa = {cvm:c.cvm, nome:c.name, nota};
      }
    }
    if(melhorDaEmpresa) cands.push(melhorDaEmpresa);
  }
  if(!cands.length) return null;
  cands.sort((a,b)=>a.nota-b.nota);
  const primeiro = cands[0];
  const segundo = cands.find(x => x.cvm !== primeiro.cvm);
  const claro = primeiro.nota <= 0.25 && (!segundo || segundo.nota - primeiro.nota >= 0.08);
  if(claro) return {...primeiro, via:'aproximado'};
  return {ambiguo: cands.slice(0,5).map(x=>({cvm:x.cvm, nome:x.nome}))};
}
// Palavras de negócio que aparecem em nome de empresa mas que, sozinhas, não

const GENERICAS = new Set([
  // termos de negócio que aparecem em razão social mas não identificam ninguém
  'lojas','loja','vendas','venda','producao','clientes','cliente','receita','lucro','total',
  'media','medio','mercado','capital','credito','energia','agua','papel','banco','bancos',
  'seguros','saude','educacao','transporte','servicos','industria','comercio','tecnologia',
  'participacoes','empresas','empresa','setor','indice','margem','ticket','carteira','volume',
  'preco','custo','ativos','acoes','geral','brasil','holding','grupo','uniao','nacional',
  // palavras funcionais da consulta — "acima" fica a 1 letra de "ANIMA"
  'acima','abaixo','maior','maiores','menor','menores','melhor','melhores','pior','piores',
  'entre','mais','menos','superior','inferior','positivo','negativo','quais','qual','quem',
  'tenha','tenham','todas','todos','ranking','ultimo','ultimos','ultima','trimestre','anual',
  'alta','baixa','crescimento','queda','sobre','tambem','desde','apenas','somente','desses',
]);

// exemplos que sempre funcionam, para o usuário partir de algo concreto
const BUSCA_EXEMPLOS = [
  'bancos com maior ROE',
  'varejo com ROIC acima de 15',
  'energia com dividend yield acima de 8',
  'maiores empresas de mineração',
  'construtoras com margem EBITDA entre 15 e 30',
  'menores P/L do setor de saúde',
  'compare os setores por ROIC',
  'quais subsetores têm maior margem EBITDA',
  'setores com ROE acima de 15',
  'compare os segmentos do varejo por receita',
];
function buscaInterpreta(txt){
  const bruto = String(txt||'').trim();
  if(!bruto) return null;
  const s = semAcento(bruto).replace(/\s+/g,' ');
  const usado = [];                       // pedaços que conseguimos ler
  let resto = s;
  // `marca` apagava só a PRIMEIRA alternativa casada da regex, então
  // "papel e celulose com maior margem" reconhecia o subsetor por "papel" e
  // depois acusava "celulose" como termo ignorado. Agora apaga todas.
  const marca = re => {
    const m = resto.match(re);
    if(m){ usado.push(m[0]); resto = resto.replace(new RegExp(re.source, 'g' + (re.flags||'').replace('g','')), ' '); }
    return m;
  };
  const campoDoNivel = p => p==='set' ? 'setor' : p==='sub' ? 'subsetor' : 'segmento';

  // 1) escopo (setor/subsetor/segmento) — apelido primeiro, depois nome literal
  let escopoAchado = '', escopoExtra = [];
  for(const [re, alvo] of APELIDOS){
    if(!re.test(s)) continue;
    // um apelido pode cobrir vários grupos da B3 (ver APELIDOS): fica com todos
    // os que existem na base, e o rótulo da tela cita a lista inteira
    const alvos = (Array.isArray(alvo) ? alvo : [alvo]).filter(a =>
      COS.some(c => c[campoDoNivel(a.slice(0,3))] === a.slice(4)));
    if(!alvos.length) continue;
    escopoAchado = alvos.join('+');     // escopo composto: ver escopoFiltra
    escopoExtra = alvos.slice(1);
    marca(re);
    break;
  }
  if(!escopoAchado){
    // Casamento com FRONTEIRA DE PALAVRA. Com `includes` puro, "imóveis" caía no
    // segmento "Móveis" (3 empresas de mobiliário) e "quais outros setores"
    // caía no setor "Outros" — escopo errado, silenciosamente. Em empate, vale
    // o nome mais longo, que é o mais específico.
    const OPC = escopoOpcoes();
    let hit = null;
    // Nome de grupo que é palavra funcional em português não vira escopo por
    // acidente: "quais OUTROS setores têm ROE alto" caía no setor "Outros"
    // (8 holdings) e o ranking saía daquelas 8 empresas. Um nome desses só entra
    // pelo seletor de escopo, onde a escolha é explícita.
    const ESCOPO_AMBIGUO = new Set(['outros','outras','diversos','diversas','geral']);
    for(const [pref] of NIVEIS){
      for(const [v] of OPC[pref]){
        const alvo = semAcento(v);
        if(!alvo || ESCOPO_AMBIGUO.has(alvo)) continue;
        const re = new RegExp('(^|[^a-z0-9])' + alvo.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '($|[^a-z0-9])');
        if(re.test(s) && (!hit || alvo.length > hit.alvo.length)) hit = {pref, v, alvo};
      }
      if(hit) break;
    }
    if(hit){
      escopoAchado = hit.pref+':'+hit.v;
      usado.push(hit.alvo);
      resto = resto.replace(new RegExp(hit.alvo.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g'), ' ');
    }
  }

  // 2) filtros: <indicador> <operador> <número>  (aceita "entre X e Y")
  // Cada indicador só lê o trecho até o PRÓXIMO indicador, e vale o operador mais
  // próximo dele. Sem isso, "alavancagem abaixo de 2 e ROIC acima de 10" fazia a
  // alavancagem capturar o "acima de 10" do ROIC.
  const achados = [];
  for(const [reInd, chave] of BUSCA_INDS){
    // TODAS as ocorrências, não só a primeira: "ROE acima de 15 e ROE abaixo de 30"
    // perdia o segundo limite e ainda acusava "roe" como termo não reconhecido.
    const reG = new RegExp(reInd.source, 'g' + (reInd.flags||'').replace('g',''));
    let m;
    while((m = reG.exec(resto)) !== null){
      achados.push({chave, ini:m.index, fim:m.index + m[0].length, texto:m[0]});
      if(m.index === reG.lastIndex) reG.lastIndex++;   // regex que casa vazio
    }
  }
  // SOBREPOSIÇÃO: descarta o casamento contido em outro maior. É o que faz
  // "crescimento da receita" ganhar de "receita" e "ev ebitda" ganhar de "ev",
  // sem depender da ordem da lista.
  const contido = (a, b) => a !== b && a.ini >= b.ini && a.fim <= b.fim &&
                            (b.fim - b.ini) > (a.fim - a.ini);
  const limpos = achados.filter(a => !achados.some(b => contido(a, b)));
  limpos.sort((a,b)=>a.ini-b.ini);
  achados.length = 0;
  achados.push(...limpos);
  // número seguido de unidade opcional (%, x, bi, mi, mil…). Sem aceitar a unidade
  // aqui, "margem EBITDA entre 20% e 30%" não casava o intervalo e a consulta virava
  // um ranking de TODAS as empresas, sem nenhum aviso.
  const num = '(-?\\d+(?:[.,]\\d+)?)\\s*((?:%|x|tri|bi|mi|mil)(?:lh[õoãa][eo]?s?)?)?';
  const OPS = [
    ['bt', new RegExp('entre\\s*'+num+'\\s*(?:e|a|-)\\s*'+num)],
    ['gt', new RegExp('(?:acima de|maior que|maior do que|superior a|mais de|>=?|acima)\\s*'+num)],
    ['lt', new RegExp('(?:abaixo de|menor que|menor do que|inferior a|menos de|<=?|abaixo)\\s*'+num)],
  ];
  // converte o número lido para a unidade interna do indicador (R$ milhões)
  const escala = (chave, un) => {
    if(!un || !INDS_REAIS.has(chave)) return 1;
    const u = String(un).toLowerCase();
    for(const [re, mult] of UNIDADES) if(re.test(u)) return mult;
    return 1;
  };
  const filtros = [];
  achados.forEach((a, ix) => {
    const limite = ix+1 < achados.length ? achados[ix+1].ini : Math.min(resto.length, a.fim + 60);
    const trecho = resto.slice(a.fim, limite);
    let melhor = null; const achadosOp = {};
    for(const [op, re] of OPS){
      const m = trecho.match(re);
      if(!m) continue;
      const cand = {op, pos:m.index,
                    v1: +m[1].replace(',','.') * escala(a.chave, m[2]),
                    v2: m[3]!=null ? +m[3].replace(',','.') * escala(a.chave, m[4]) : null,
                    un: m[2]||m[4]||''};
      achadosOp[op] = cand;
      if(!melhor || m.index < melhor.pos) melhor = cand;
    }
    // "ROIC acima de 15 e abaixo de 30": o segundo limite não tem indicador antes
    // dele, então ficava fora do filtro sem nenhum aviso. Quando os dois lados
    // aparecem na MESMA janela do indicador, vale o intervalo.
    if(achadosOp.gt && achadosOp.lt && !achadosOp.bt){
      melhor = {op:'bt', pos:Math.min(achadosOp.gt.pos, achadosOp.lt.pos),
                v1: Math.min(achadosOp.gt.v1, achadosOp.lt.v1),
                v2: Math.max(achadosOp.gt.v1, achadosOp.lt.v1), un:''};
    }
    if(melhor){
      const f = {ind:a.chave, op:melhor.op, v1:melhor.v1, v2:melhor.v2};
      if(f.op==='bt' && f.v2==null) f.op = 'gt';
      // dois limites do MESMO indicador (gt + lt) viram um intervalo em vez de o
      // segundo ser descartado em silêncio
      const irmao = filtros.find(x => x.ind === f.ind && x.op !== 'bt' && f.op !== 'bt' && x.op !== f.op);
      if(irmao){
        const lo = (irmao.op === 'gt' ? irmao.v1 : f.v1), hi = (irmao.op === 'gt' ? f.v1 : irmao.v1);
        irmao.op = 'bt'; irmao.v1 = Math.min(lo, hi); irmao.v2 = Math.max(lo, hi);
      } else if(!filtros.some(x => x.ind === f.ind && x.op === f.op && x.v1 === f.v1)){
        filtros.push(f);
      }
      usado.push(a.texto);
    } else if(!filtros.some(x => x.ind === a.chave)) { a.semValor = true; usado.push(a.texto); }
    else { usado.push(a.texto); }
  });
  // remove do "resto" tudo que foi lido, para o aviso de não-entendido ser honesto
  for(const a of achados.slice().reverse()) resto = resto.slice(0, a.ini) + ' ' + resto.slice(a.fim);
  for(const [,re] of OPS) resto = resto.replace(new RegExp(re.source,'g'),' ');

  // 3) KPI operacional (SSS, nº de lojas, produção…) e empresa citada na frase.
  // Esses dados vêm da curadoria dos releases, não da CVM estruturada, e vivem
  // no modo "KPIs operacionais" e no detalhe da empresa.
  // Vem ANTES do cálculo da sobra: senão o KPI e o nome da empresa acabariam na
  // lista de "não reconheci", como se tivessem sido ignorados.
  // Lê da frase original (s), não de `resto`: o bloco dos indicadores financeiros
  // roda antes e apaga os operadores do resto — "acima de 5" já teria sumido.
  // Aceita VÁRIOS KPIs na mesma frase ("SSS acima de 5 e nº de lojas acima de 300"),
  // e cada um só lê o trecho até o próximo, como nos indicadores financeiros.
  const nn = '(-?\\d+(?:[.,]\\d+)?)';
  const OPS_K = [
    ['bt', new RegExp('entre\\s*'+nn+'\\s*(?:e|a|-)\\s*'+nn)],
    ['gt', new RegExp('(?:acima de|maior que|maior do que|superior a|mais de|>=?|acima|positivo)\\s*'+nn)],
    ['lt', new RegExp('(?:abaixo de|menor que|menor do que|inferior a|menos de|<=?|abaixo)\\s*'+nn)],
  ];
  // Algumas famílias de KPI repetem um indicador financeiro (o ROIC que a empresa
  // divulga no release vs. o ROIC calculado da CVM). Quando o financeiro já foi
  // reconhecido, o KPI é descartado: ele cobre poucas empresas e criaria um
  // segundo filtro sobre a mesma coisa, zerando o resultado.
  const KPI_DUPLICA_FINANCEIRO = {
    'ROIC (divulgado pela empresa)': 'roic',
    'Margem EBITDA (empresa)': 'mgE12',
    'Margem bruta (empresa)': 'mgL12',
    'Alavancagem (dív. líq./EBITDA)': 'dlEbitda',
  };
  const jaFinanceiro = new Set(filtros.map(f=>f.ind));
  const kpisNaFrase = [];
  for(const [re, fam] of KPI_FAMILIAS){
    const equiv = KPI_DUPLICA_FINANCEIRO[fam];
    if(equiv && (jaFinanceiro.has(equiv) || achados.some(a=>a.chave===equiv))) continue;
    const m = s.match(re);
    if(m && !kpisNaFrase.some(k=>k.fam===fam))
      kpisNaFrase.push({fam, ini:m.index, fim:m.index+m[0].length, texto:m[0]});
  }
  kpisNaFrase.sort((a,b)=>a.ini-b.ini);
  let kpiAchado = kpisNaFrase.length ? kpisNaFrase[0].fam : null;
  const kpiFiltros = [];
  kpisNaFrase.forEach((k, ix) => {
    const limite = ix+1 < kpisNaFrase.length ? kpisNaFrase[ix+1].ini : Math.min(s.length, k.fim + 60);
    const depois = s.slice(k.fim, limite);
    let melhorK = null;
    for(const [op, reOp] of OPS_K){
      const mm = depois.match(reOp);
      if(!mm || mm[1]==null) continue;
      if(!melhorK || mm.index < melhorK.pos)
        melhorK = {op, pos:mm.index, v1:+mm[1].replace(',','.'), v2: mm[2]!=null ? +mm[2].replace(',','.') : null};
    }
    if(melhorK) kpiFiltros.push({kpi:true, ind:k.fam, op:melhorK.op, v1:melhorK.v1, v2:melhorK.v2});
    // limpa o que foi lido para não sobrar em "não reconheci"
    resto = resto.split(k.texto).join(' ');
    if(melhorK) for(const [,reOp] of OPS_K) resto = resto.replace(new RegExp(reOp.source,'g'), ' ');
  });
  const kpiFiltro = kpiFiltros.length ? kpiFiltros[0] : null;
  const empRaw = achaEmpresaNaFrase(bruto);
  const empAmbigua = (empRaw && empRaw.ambiguo) ? empRaw.ambiguo : null;
  const empAchada = (empRaw && !empRaw.ambiguo) ? empRaw : null;
  if(empAchada){
    const c = COS.find(x=>x.cvm===empAchada.cvm) || {};
    const toks = [...new Set([...tokensNome(c.fullName||''), ...tokensNome(c.name||''), ...semAcento(String(empAchada.nome)).split(/\s+/)])];
    resto = resto.split(' ').filter(w => !w || !toks.some(t => t.length>=4 && (w.startsWith(t) || t.startsWith(w)))).join(' ');
    for(const t of (c.tickers||[])) resto = resto.split(' ').filter(w=>w!==t.t.toLowerCase()).join(' ');
    // apelido usado na frase (magalu, ambev…) também não é "não reconhecido"
    for(const [re] of APELIDOS_EMPRESA){ const m = resto.match(re); if(m) resto = resto.replace(m[0],' '); }
  }

  // 3b) o que sobrou de relevante (ignora conectivos e números já consumidos)
  const sobra = resto
    .replace(/\b(e|com|de|do|da|dos|das|em|no|na|que|as|os|a|o|empresas?|setor(es)?|subsetor(es)?|segmentos?|compar\w*|cada|nivel|niveis|medi[ao]s?|mediana|agregad[oa]s?|somad[oa]s?|soma|totais|total|ultimo|trimestre|ano|acima|abaixo|maior|menor|entre|mais|menos|por|para|sobre|tem|ter|todas?|todos?)\b/g,' ')
    .replace(/\d+(?:[.,]\d+)?\s*(?:%|x|bi|mi|mil)?/g,' ')   // números e unidades
    .replace(/[><=$/()\-.,;:!?]+/g,' ')
    .replace(/\s+/g,' ').trim();

  // 3c) pedido de comparar os SETORES entre si ("compare os setores por ROIC")
  // Só dispara com pedido explícito de comparação ENTRE grupos. "empresas do setor
  // de varejo com ROIC acima de 15" tem "setor" no singular como filtro e continua
  // sendo screener de empresas — por isso o singular só conta acompanhado de
  // "por/cada/entre", de "qual/quais" ou de "compar…".
  const RE_G_PLURAL  = /\b(setores|subsetores|segmentos)\b/;
  const RE_G_POR     = /\b(por|cada|entre)\s+(subsetor|setor|segmento)\b/;
  const RE_G_QUAL    = /\b(qual|quais)\s+(?:(?:o|a|os|as)\s+)?(?:(?:melhor|pior|maior|menor)(?:es)?\s+)?(subsetor|setor|segmento)(es|s)?\b/;
  const RE_G_COMPARA = /\bcompar\w*\s+(?:(?:os|as|o|a)\s+)?(subsetor|setor|segmento)/;
  const RE_G_SUPER   = /\b(subsetor|setor|segmento)\s+(?:com|de)\s+(?:o\s+|a\s+)?(maior|menor|melhor|pior)/;
  const querGrupos = RE_G_PLURAL.test(s) || RE_G_POR.test(s) || RE_G_QUAL.test(s)
                     || RE_G_COMPARA.test(s) || RE_G_SUPER.test(s);
  const nivelPedido = /\bsubsetor/.test(s) ? 'sub' : /\bsegmento/.test(s) ? 'seg' : 'set';
  // estatística pedida na frase: "ROIC médio por setor", "receita total por setor".
  // "mediana" é explícita; "total/soma/agregado" quer o grupo somado.
  const statPedido = /\bmediana\b/.test(s) ? 'med'
    : /\bmedi[ao]s?\b/.test(s) ? 'avg'
    : /\b(total|totais|somad[oa]s?|soma|agregad[oa]s?)\b/.test(s) ? 'somar' : null;

  // 4) intenção: com valor → screener (filtra); sem valor → ranking (ordena)
  // "bancos com maior ROIC" não tem número: é pedido de ranking, não de filtro.
  const RE_MENOR = /\b(menor(es)?|pior(es)?|mais baix|menos)\b/;
  const RE_MAIOR = /\b(maior(es)?|melhor(es)?|mais alt|top\s*\d*|ranking|rank)\b/;
  const ehMenor = RE_MENOR.test(s);
  const ehMaior = RE_MAIOR.test(s);
  // A direção tem de ser a da palavra MAIS PRÓXIMA do indicador escolhido. Antes,
  // "menores" vencia sempre que aparecia na frase: "maiores ROE do setor financeiro
  // e menores P/L" desenhava o gráfico dos MENORES ROE — o oposto do pedido.
  const ondeNaFrase = (re) => {
    const o = []; const r = new RegExp(re.source, 'g' + (re.flags||'').replace('g','')); let m;
    while((m = r.exec(s)) !== null){ o.push(m.index); if(m.index === r.lastIndex) r.lastIndex++; }
    return o;
  };
  const posMenor = ondeNaFrase(RE_MENOR), posMaior = ondeNaFrase(RE_MAIOR);
  const posDoInd = (chave) => {
    const par = BUSCA_INDS.find(([, k]) => k === chave);
    if(!par) return 0;
    const m = s.match(par[0]);
    return m ? m.index : 0;
  };
  const dirPerto = (chave) => {
    if(!posMenor.length) return 'desc';
    if(!posMaior.length) return 'asc';
    const p = posDoInd(chave);
    const dMenor = Math.min(...posMenor.map(x => Math.abs(x - p)));
    const dMaior = Math.min(...posMaior.map(x => Math.abs(x - p)));
    return dMenor < dMaior ? 'asc' : 'desc';
  };
  const semValor = achados.find(a => a.semValor);
  let intencao = null, indRank = null, dir = 'desc';
  let nivel = null, setStat = null, setFiltros = [], avisoGrupo = '';
  if(kpiFiltros.length){                                // "SSS acima de 5" → filtra
    intencao = 'scr';
    for(const kf of kpiFiltros) filtros.push(kf);
    if(querGrupos) avisoGrupo = 'KPI operacional (curadoria dos releases) não tem comparação por setor — '
      + 'poucas empresas divulgam e a definição varia entre elas. O resultado abaixo é por empresa.';
  }
  else if(kpiAchado && empAchada) intencao = 'kpiEmpresa';   // "SSS Magazine Luiza" → detalhe
  else if(kpiAchado){                                        // "SSS" → compara entre empresas
    intencao = 'kpi';
    if(querGrupos) avisoGrupo = 'KPI operacional (curadoria dos releases) não tem comparação por setor — '
      + 'poucas empresas divulgam e a definição varia entre elas. Comparei entre as empresas que divulgam.';
  }
  // comparar os grupos entre si: precisa de um indicador financeiro (os KPIs
  // operacionais, tratados acima, não têm cobertura para virar média de setor)
  else if(querGrupos && (achados.length || filtros.length)){
    intencao = 'setores';
    nivel = nivelPedido;
    const fFin = filtros.find(f => !f.kpi);
    indRank = fFin ? fFin.ind : (achados[0] ? achados[0].chave : 'mktCap');
    dir = dirPerto(indRank);
    setFiltros = filtros.filter(f => !f.kpi && typeof f.v1 === 'number');
    // "somar" pedido na frase vira agregado (razão das somas) quando o indicador
    // tem componentes na base, e soma simples quando é valor em R$
    setStat = statPedido === 'somar'
      ? (SET_AGG[indRank] ? 'agg' : (SET_SOMA.has(indRank) ? 'sum' : 'med'))
      : statPedido || (SET_SOMA.has(indRank) ? 'sum' : 'med');
  }
  // sem indicador na frase: "compare os setores" = tamanho dos setores. Não vale
  // quando a frase cita uma empresa e nenhum setor — "segmentos de negócio da Vale"
  // é pedido do detalhe da empresa, não comparação de grupos. Só bloqueia com
  // identificação FORTE da empresa (apelido, ticker ou nome escrito): a busca
  // aproximada erra fácil ("energia" casa com AZT ENERGIA) e não pode barrar
  // "segmentos de energia".
  else if(querGrupos && (!(empAchada && ['apelido','ticker','nome'].includes(empAchada.via)) || escopoAchado)){
    intencao = 'setores'; nivel = nivelPedido; indRank = 'mktCap';
    setStat = statPedido === 'avg' ? 'avg' : statPedido === 'med' ? 'med' : 'sum';
    dir = dirPerto(indRank);
  }
  else if(filtros.length) intencao = 'scr';
  else if(semValor){ intencao = 'rank'; indRank = semValor.chave; dir = dirPerto(indRank); }
  else if((ehMaior || ehMenor) && escopoAchado){
    // "maiores empresas do varejo" → ranking por valor de mercado
    intencao = 'rank'; indRank = 'mktCap'; dir = dirPerto(indRank);
  }

  const sobraLimpa = sobra.replace(/\b(maior(es)?|menor(es)?|melhor(es)?|pior(es)?|top|ranking|rank|alto|alta|baixo|baixa|quais|qual|quem|tem|tenha|possuem?)\b/g,' ').replace(/\s+/g,' ').trim();

  return {
    escopo: escopoAchado,
    filtros,
    intencao,
    ind: indRank,
    dir,
    kpi: kpiAchado,
    empresa: empAchada,
    empresaAmbigua: empAmbigua,
    nivel, setStat, setFiltros, avisoGrupo,
    naoEntendi: sobraLimpa ? sobraLimpa.split(' ').filter(w=>w.length>2).slice(0,6) : [],
    frase: bruto,
  };
}
// KPIs operacionais para comparação: cada empresa nomeia do seu jeito, então
// agrupamos em FAMÍLIAS por palavra-chave (SSS da RD casa com o da Renner).

const kpiFamilia = nome => { for(const [re, fam] of KPI_FAMILIAS) if(re.test(nome)) return fam; return nome; };
// unidade canônica: impede comparar % com valor absoluto na mesma barra
function unidadeCanon(u){
  const s = (u||'').toLowerCase();
  if(!s) return '(sem unidade)';
  if(s.includes('%') || s.includes('p.p')) return '%';
  if(s.includes('r$')) return 'R$';
  if(s.includes('us$') || s.includes('usd')) return 'US$';
  if(/\bx\b|vezes/.test(s)) return 'x (múltiplo)';
  if(s.includes('ton')) return 'toneladas';
  if(s.includes('m³') || s.includes('m3')) return 'm³';
  if(s.includes('gwh') || s.includes('mwh') || s.includes('mw')) return 'energia';
  if(s.includes('milh') || s.includes('mil ') || s.includes('unidades')) return 'quantidade';
  return s.slice(0,18);
}
// opsIndex() custa ~19 ms e era refeito a cada renderCmp — ou seja, a cada troca
// de qualquer seletor da aba Comparar. OPD só muda quando loadExtras carrega, então
// a memória invalida sozinha por identidade do objeto.
let _opsIdx = null, _opsSrc = undefined;
function opsIndexCache(){
  if(_opsSrc !== OPD){ _opsSrc = OPD; _opsIdx = opsIndex(); }
  return _opsIdx;
}
function opsIndex(){
  const idx = {};   // família -> [{cvm, empresa, setor, nomeOriginal, unidade, valores}]
  if(!OPD) return idx;
  for(const [cvm, o] of Object.entries(OPD)){
    if(cvm.startsWith('_') || !o || !Array.isArray(o.indicadores)) continue;
    const emp = COS.find(c=>c.cvm===cvm); if(!emp) continue;
    for(const ind of o.indicadores){
      if(!ind || !ind.nome || !ind.valores) continue;
      const fam = kpiFamilia(ind.nome);
      (idx[fam] = idx[fam] || []).push({cvm, empresa:emp.name, setor:emp.setor,
        nomeOriginal:ind.nome, unidade:ind.unidade||'', uc:unidadeCanon(ind.unidade), valores:ind.valores});
    }
  }
  return idx;
}
const ultimoPeriodo = valores => Object.keys(valores||{}).sort().pop();

// ============ KPIs operacionais como filtro do screener ============
// Diferente dos indicadores financeiros, aqui cada empresa nomeia o KPI do seu
// jeito, usa a unidade que quer e reporta até um trimestre diferente. Três
// proteções para o filtro não comparar coisas diferentes:
//  1. só famílias com 2+ empresas entram (uma empresa só não é comparação)
//  2. dentro da família, filtra apenas o grupo de unidade DOMINANTE — quem
//     reporta em outra unidade fica de fora e é listado no aviso
//  3. o período de cada valor viaja junto e aparece na tabela
function ucDominante(arr){
  const cont = {};
  for(const x of arr) cont[x.uc] = (cont[x.uc]||0)+1;
  const e = Object.entries(cont).sort((a,b)=>b[1]-a[1])[0];
  return e ? e[0] : null;
}
function kpiFamiliasFiltraveis(idx){
  return Object.keys(idx)
    .filter(f => new Set(idx[f].map(x=>x.cvm)).size >= 2)
    .sort((a,b) => (new Set(idx[b].map(x=>x.cvm)).size - new Set(idx[a].map(x=>x.cvm)).size)
                   || a.localeCompare(b,'pt-BR'));
}
// valor mais recente do KPI para uma empresa, já restrito à unidade dominante
function kpiValor(idx, fam, cvm){
  const arr = idx[fam] || [];
  const uc = ucDominante(arr);
  const x = arr.find(a => a.cvm === cvm && a.uc === uc);
  if(!x) return null;
  const p = ultimoPeriodo(x.valores);
  if(!p || x.valores[p] == null || !isFinite(x.valores[p])) return null;
  return {v: x.valores[p], p, unidade: x.unidade, uc: x.uc, nome: x.nomeOriginal};
}
// quem ficou fora da família por reportar em outra unidade
function kpiForaDaUnidade(idx, fam){
  const arr = idx[fam] || [];
  const uc = ucDominante(arr);
  return arr.filter(x => x.uc !== uc).map(x => x.empresa + ' (' + (x.unidade||'sem unidade') + ')');
}
const fmtKpi = (idx, fam) => {
  const arr = idx[fam] || [];
  const uc = ucDominante(arr);
  const un = (arr.find(x=>x.uc===uc)||{}).unidade || '';
  const uns = new Set(arr.filter(x=>x.uc===uc).map(x=>x.unidade||'')).size;
  return v => v==null ? '—' : nbr2.format(v) + (un && un.length<12 && uns===1 ? ' '+un : '');
};

// junto do resultado — senão o usuário acha que pesquisou algo que na verdade foi
